name: Deploy TYOV Viewer to Pages
 
on:
  push:
    branches: [main]
    paths:
      - 'TTRPGs/Thousand Year Old Vampire/**'
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
 
      - name: Build site files
        run: |
          mkdir -p _site
          cp "TTRPGs/Thousand Year Old Vampire/tyov-viewer.html" _site/index.html
          cp "TTRPGs/Thousand Year Old Vampire/Manual.html" _site/Manual.html
 
      - name: Deploy to gh-pages subfolder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: TTRPGs/Thousand-Year-Old-Vampire
          keep_files: true
 