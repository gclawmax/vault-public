<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TYOV Viewer — Section Editor Test Suite</title>
<style>
  body { font-family: monospace; font-size: 13px; padding: 20px; background: #1a1a1a; color: #ccc; }
  .pass { color: #4f8f55; font-weight: bold; }
  .fail { color: #b33a2e; font-weight: bold; }
  .section-title { color: #d1b15a; font-weight: bold; margin-top: 18px; padding-bottom: 4px; border-bottom: 1px solid #333; }
  .test-line { margin: 2px 0; white-space: pre-wrap; }
  .test-line:before { content: '  '; color: #555; }
  pre { background: #0a0a0a; padding: 10px; margin: 4px 0 14px; overflow-x: auto; font-size: 12px; border: 1px solid #333; }
  code { color: #e8a050; }
</style>
</head>
<body id="app">
<script>
// ════════════════════════════════════════════════════════════════════════
// Load & parse the schema
// ════════════════════════════════════════════════════════════════════════
const SCHEMA_PATH = '../references/vampire-schema.json';

function log(s) { document.getElementById('app').insertAdjacentHTML('beforeend', s); }
function logEl(tag, cls, text) {
  return document.getElementById('app').insertAdjacentHTML('beforeend',
    `<div class="test-line ${cls}">${text}</div>`);
}
function logPre(text) {
  return document.getElementById('app').insertAdjacentHTML('beforeend',
    `<pre>${text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`);
}

async function loadJSON(path) {
  const resp = await fetch(path);
  if (!resp.ok) throw Error('Failed to load ' + path + ': ' + resp.status);
  return resp.json();
}

async function loadViewerJS(path) {
  const resp = await fetch(path);
  if (!resp.ok) throw Error('Failed to load ' + path + ': ' + resp.status);
  return await resp.text();
}

// ════════════════════════════════════════════════════════════════════════
// Test helpers
// ════════════════════════════════════════════════════════════════════════
let passCount = 0, failCount = 0;
let allPass = true;

function check(condition, label, extra) {
  if (condition) {
    passCount++;
    logEl('', 'pass', '✓ PASS: ' + label + (extra ? ' (' + extra + ')' : ''));
  } else {
    failCount++;
    allPass = false;
    logEl('', 'fail', '✗ FAIL: ' + label + (extra ? ' (' + extra + ')' : ''));
  }
}

// ════════════════════════════════════════════════════════════════════════
// Main test sequence
// ════════════════════════════════════════════════════════════════════════
(async function runAllTests() {

  log('<b>TYOV Viewer Test Suite</b><br>');

  // ── Step 1: Load schema ──
  log('<div class="section-title">Loading schema...</div>');
  let schema;
  try {
    schema = await loadJSON(SCHEMA_PATH);
    logEl('', 'pass', 'Schema loaded: ' + schema.title);
  } catch(e) {
    logEl('', 'fail', 'Cannot load schema from ' + SCHEMA_PATH);
    return;
  }

  // ── Step 2: Load viewer JS code ──
  log('<div class="section-title">Loading viewer code...</div>');
  let viewerSrc;
  try {
    viewerSrc = await loadViewerJS('../tyov-viewer.html');
    logEl('', 'pass', 'tyov-viewer.html loaded');
  } catch(e) {
    logEl('', 'fail', 'Cannot load viewer: ' + e.message);
    return;
  }

  // ── Step 3: Parse serializeJson & jsonToParsedData from the viewer ──
  log('<div class="section-title">Extracting functions from viewer...</div>');
  const serializeJsonRE = /function serializeJson\(d\)\s*\{(?:[^{}]|{(?:[^{}]*)})*\}/;
  const parseJsonRE = /function jsonToParsedData\(json\)\s*\{(?:[^{}]|{(?:[^{}]*)})*\}/;

  const serializeRE = /function serializeJson\(d\)\s*\{/;
  const parseRE = /function jsonToParsedData\(json\)\s*\{/;

  /* More robust extraction: scan for the actual function bodies */
  const extractFunction = (searchRE, src) => {
    const m = src.search(searchRE);
    if (m < 0) return null;
    const start = m;
    let depth = 0, started = false;
    for (let i = start; i < src.length; i++) {
      if (src[i] === '{') { depth++; started = true; }
      else if (src[i] === '}') { depth--; }
      if (started && depth === 0) return src.substring(start, i + 1);
    }
    return null;
  };

  const serializeFn = extractFunction(/function serializeJson\(d\)/, viewerSrc);
  const parseFn = extractFunction(/function jsonToParsedData\(json\)/, viewerSrc);

  if (!serializeFn) { logEl('', 'fail', 'Cannot find serializeJson in viewer'); return; }
  if (!parseFn) { logEl('', 'fail', 'Cannot find jsonToParsedData in viewer'); return; }

  logEl('', 'pass', 'serializeJson extracted');
  logEl('', 'pass', 'jsonToParsedData extracted');

  // ── Step 4: Build a test JSON skeleton and run it through parse->serialize->validate ──
  log('<div class="section-title">Test skeleton creation</div>');

  function createTestSkeleton() {
    return {
      name: "Test Vampire",
      vampire_desc: "A test vampire for the viewer test suite",
      mortal_self: "Mortal life summary in the years before the turning.",
      game_start: "2026-01-01",
      modified: "2026-05-15",
      game_over: false,
      game_completed: null,
      current_prompt: 5,
      prompts_resolved: 3,
      marks: [
        { name: "Cold Skin", description: "Skin perpetually cold to the touch", concealment: "Hidden under layered clothing" },
        { name: "Morgue Mark", description: "Body was stolen from St. Bartholomew's morgue", concealment: "No one alive would remember" }
      ],
      memories: [
        {
          name: "The First Grave",
          description": "My earliest memory as an undeath.",
          experiences: [
            "I woke up in a stone chamber with no memory of how I got there.",
            "The cold was absolute, and the hunger was worse."
          ],
          status: "available",
          in_diary: false
        },
        {
          name: "The First Hunger",
          description: "When I first took a life.",
          experiences: [
            "I found a stray dog in an alley and could not resist its warmth.",
            "The act was automatic, almost mechanical. My body knew what to do before my mind caught up.",
            "I felt nothing. Not guilt, not relief. Just a hollow ache that was partially filled."
          ],
          status: "struck"
        }
      ],
      diary: {
        memories: [
          { name: "The First Grave", experiences: [
            "I woke up in a stone chamber with no memory of how I got there.",
            "The cold was absolute, and the hunger was worse."
          ]}
        ]
      },
      skills: [
        { name: "Bookbinding", description: "Profession learned in mortal life", status: "available" },
        { name: "First Hunger", description: "Gained immediately after creation; the hunger still bites.", status: "available" },
        { name: "Churchcraft", description: "I know the old prayers and how to turn them.", status: "spent" },
        { name: "Trench Medicine", description: "Field medicine learned in the war.", status: "available" }
      ],
      resources: [
        { name: "Black Grimoire", description: "An ancient book bound in black leather.", type: "stationary", status: "available" },
        { name: "Silver Reliquary", description: "A small silver box containing a fragment of a relic.", type: "portable", status: "available" },
        { name: "Iron Cross", description: "Awarded for bravery. A bitter reminder of the man I was.", type: "portable", status: "struck" }
      ],
      characters: [
        { name: "Clara Whitmore", type: "mortal", description: "Red Cross nurse. She knew what I was and showed mercy.", status: "alive" },
        { name: "Father Hargrave", type: "mortal", description: "The parish priest. He discovered my secret and warned me.", status: "dead", death_reason: "Old age, 1931." },
        { name: "Silas Vorne", type: "immortal", description: "My dam. He turned me three weeks after my death.", status: "alive" },
        { name: "Lady Ashworth", type: "immortal", description: "A centuries-old vampire, now an ally.", status: "alive" }
      ],
      journal: [
        {
          turn: 1,
          prompt: 1,
          entry: 1,
          prompt_text: "You wake in a cold, silent place.",
          resolved: true,
          paraphrased_prompt: "Waking as undeath.",
          experience: "The air smelled of death and carbolic. I stood.",
          changes: "Gained skill: First Hunger"
        },
        {
          turn: 2,
          prompt: 2,
          entry: 1,
          prompt_text: "Silas appears.",
          resolved: true,
          paraphrased_prompt: "The creator appears.",
          experience: "Silas stood in the doorway.",
          changes: "Gained skill: Churchcraft"
        }
      ],
      epitaph: null
    };
  }

  const origSkeleton = createTestSkeleton();

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 0: Validate the skeleton against the schema BEFORE any edits
  // ════════════════════════════════════════════════════════════════════════
  log('<div class="section-title">PHASE 0: Schema validation of original skeleton</div>');

  // Serialize the skeleton through the viewer's serializeJson, then parse it back, then validate
  const fakeParsed = structuredClone(origSkeleton);
  // fakeParsed is already in the format serializeJson expects
  const serialized = JSON.stringify(fakeParsed, null, 2);

  // Import json-validate via a dynamic eval of the viewer's serializeJson function
  // We'll do this in a sandboxed way using JavaScript's Function constructor

  // Helper: evaluate a function from the viewer's source and call it
  function evalSerialize(parsedData) {
    // The serializeJson function uses no external dependencies
    return new Function(
      'parsedData',
      'function esc(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;"); }' +
      '; return ' + serializeFn + '(parsedData);'
    )(parsedData);
  }

  // Helper: evaluate jsonToParsedData
  function evalParse(jsonStr) {
    return new Function(
      'json',
      'function esc(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;"); }' +
      '; return ' + parseFn.replace(/function jsonToParsedData\(json\)/, 'return') + '(json);'
    )(JSON.parse(jsonStr));
  }

  // Use json-validate to validate the serialized output against the schema
  function validateAgainstSchema(jsonObj, path) {
    const Ajv = require('ajv').default;
    try {
      const ajv = new Ajv({ allErrors: true, strict: false });
      const validate = ajv.compile(schema);
      const valid = validate(jsonObj);
      if (!valid) {
        return { valid: false, errors: validate.errors };
      }
      return { valid: true };
    } catch(e) {
      return { valid: false, errors: [e.message] };
    }
  }

  // Validate the skeleton
  const skeletonValidation = validateAgainstSchema(origSkeleton, 'skeleton');
  check(skeletonValidation.valid, 'Original skeleton passes schema validation',
    skeletonValidation.valid ? '✓ All fields valid' : skeletonValidation.errors.map(e => e.message).join('; '));

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 1: Header Editor
  // ════════════════════════════════════════════════════════════════════════
  log('<div class="section-title">PHASE 1: Header Editor (editHeader)</div>');
  log('<i>Tests: edit name, edit subtitle, serialize and validate</i><br>');

  {
    const t = structuredClone(origSkeleton); // start fresh copy
    // Simulate the viewer's editHeader changes:
    // parsedData.vampireName = "Test Vampire" (unchanged, already set)
    // parsedData.subtitle = "A test vampire for the viewer test suite" (unchanged, already set)
    // parsedData.frontmatter.vampire_desc = parsedData.subtitle
    // parsedData.frontmatter.vampire = parsedData.vampireName

    // Test 1: Change name only
    const t1 = structuredClone(origSkeleton);
    t1.name = "Modified Name Vampire — Test";
    t1.vampire_desc = "A test vampire for the viewer test suite";
    const res1 = validateAgainstSchema(t1, 'header-name');
    check(res1.valid, 'Header: changed vampire name serializes validly',
      res1.valid ? 'name field accepts new string' : res1.errors.map(e => e.message).join('; '));
    check(typeof t1.name === 'string' && t1.name.length > 0, 'Header: name is still a non-empty string');
    check(Array.isArray(t1.memories), 'Header: memories still an array (' + t1.memories.length + ' items)');
    check(Array.isArray(t1.skills), 'Header: skills still an array (' + t1.skills.length + ' items)');
    check(Array.isArray(t1.resources), 'Header: resources still an array (' + t1.resources.length + ' items)');
    check(Array.isArray(t1.characters), 'Header: characters still an array (' + t1.characters.length + ' items)');
    check(Array.isArray(t1.journal), 'Header: journal still an array (' + t1.journal.length + ' items)');
    check(Array.isArray(t1.marks), 'Header: marks still an array (' + t1.marks.length + ' items)');

    // Test 2: Empty name (should still be valid — schema allows "")
    const t2 = structuredClone(origSkeleton);
    t2.name = "";
    const res2 = validateAgainstSchema(t2, 'header-empty-name');
    check(res2.valid, 'Header: empty string name is schema-valid', 'Schema allows empty name string');

    // Test 3: Very long name (still valid)
    const t3 = structuredClone(origSkeleton);
    t3.name = "A".repeat(5000);
    const res3 = validateAgainstSchema(t3, 'header-long-name');
    check(res3.valid, 'Header: 5000-char name is schema-valid', 'Schema has no length constraint on name');
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 2: Marks Editor (editMarks)
  // ════════════════════════════════════════════════════════════════════════
  log('<div class="section-title">PHASE 2: Marks Editor (editMarks)</div>');
  log('<i>Tests: add mark, remove mark (struck), serialize and validate</i><br>');

  {
    // Test 1: Add a new mark
    const t1 = structuredClone(origSkeleton);
    t1.marks.push({
      name: "The Mark of Ash",
      description: "Ash always clings to my skin, even after washing.",
      concealment: "Always wear gloves and long sleeves."
    });
    const res1 = validateAgainstSchema(t1, 'marks-add');
    check(res1.valid, 'Marks: add new mark serializes validly',
      res1.valid ? '✓ name, description, concealment, status all valid' : res1.errors.map(e => e.message).join('; '));
    check(t1.marks.length === 3, 'Marks: now have 3 marks total');
    check(typeof t1.marks[2].description === 'string', 'Marks: new mark has description string');
    check(typeof t1.marks[2].concealment === 'string', 'Marks: new mark has concealment string');

    // Test 2: Remove a mark (mark as struck)
    const t2 = structuredClone(origSkeleton);
    t2.marks[0].status = "struck";
    const res2 = validateAgainstSchema(t2, 'marks-struck');
    check(res2.valid, 'Marks: struck mark serializes validly',
      res2.valid ? '✓ status="struck" is valid enum' : res2.errors.map(e => e.message).join('; '));
    check(t2.marks[0].status === "struck", 'Marks: status is "struck"');

    // Test 3: Remove all marks
    const t3 = structuredClone(origSkeleton);
    t3.marks = [];
    const res3 = validateAgainstSchema(t3, 'marks-all-removed');
    check(res3.valid, 'Marks: empty marks array serializes validly', 'Schema uses items constraint, no required on marks itself');

    // Test 4: Mark with minimal fields (name only, description omitted)
    const t4 = structuredClone(origSkeleton);
    t4.marks.push({ name: "Minimal Mark" });
    const res4 = validateAgainstSchema(t4, 'marks-minimal');
    check(res4.valid, 'Marks: mark with only name is schema-valid', 'description/concealment are optional');
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 3: Memories Editor (editMemories)
  // ════════════════════════════════════════════════════════════════════════
  log('<div class="section-title">PHASE 3: Memories Editor (editMemories)</div>');
  log('<i>Tests: add memory, forget memory, add experiences, cross out experience</i><br>');

  {
    // Test 1: Add a new memory (max 5 active)
    const t1 = structuredClone(origSkeleton);
    t1.memories.push({
      n: 3,
      name: "The First Blood",
      description: "My first killing as a vampire.",
      experiences: [
        "Found a stray dog in an alley after dark.",
        "The hunger took over before my mind could object.",
        "I felt nothing. Not guilt, not relief."
      ],
      status: "available",
      in_diary: false
    });
    check(t1.memories.length === 3, 'Memories: now have 3 memories after adding one');
    // Validate only the new memory item
    check(t1.memories[2].name !== undefined, 'Memories: new memory has required "name" field');
    check(Array.isArray(t1.memories[2].experiences), 'Memories: new memory has experiences array');
    check(t1.memories[2].experiences.length === 3, 'Memories: new memory has exactly 3 experiences');
    check(typeof t1.memories[2].experiences[0] === 'string', 'Memories: first experience is a string');

    // Test 2: Forget a memory (mark struck)
    const t2 = structuredClone(origSkeleton);
    t2.memories[1].status = "struck";
    check(t2.memories[1].status === "struck", 'Memories: struck memory is valid');
    const res2 = validateAgainstSchema(t2, 'memories-strucked');
    // This should still validate — struck is just a status value

    // Test 3: Add 3rd experience (hit max)
    const t3 = structuredClone(origSkeleton);
    // Add one more experience to the first memory (which has 2)
    t3.memories[0].experiences.push("A third memory line that fills the quota.");
    check(t3.memories[0].experiences.length === 3, 'Memories: first memory now has 3 experiences (max)');
    check(t3.memories[0].experiences.every(e => typeof e === 'string'), 'Memories: all experiences are strings');

    // Test 4: Cross out an experience
    const t4 = structuredClone(origSkeleton);
    // Simulate experience text change to indicate it's been crossed out
    t4.memories[0].experiences[0] = "I awoke in darkness." + "[CROSSED OUT]";
    check(t4.memories[0].experiences.length === 2, 'Memories: still 2 experiences after crossing out');

    // Test 5: Memory exceeds max (6th memory)
    const t5 = structuredClone(origSkeleton);
    for (let i = 3; i < 8; i++) {
      t5.memories.push({
        name: "Extra Memory " + i,
        experiences: ["test"],
        status: "available"
      });
    }
    check(t5.memories.length === 8, 'Memories: now have 8 memories (over the schema limit)');
    // Note: this should fail schema validation due to maxItems: 5
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 4: Skills Editor (editSkills)
  // ════════════════════════════════════════════════════════════════════════
  log('<div class="section-title">PHASE 4: Skills Editor (editSkills)</div>');
  log('<i>Tests: add skill, change status (unchecked→checked→lost)</i><br>');

  {
    // Test 1: Add a new skill
    const t1 = structuredClone(origSkeleton);
    t1.skills.push({
      name: "Night Vision",
      description: "I can see perfectly in darkness.",
      status: "available"
    });
    check(t1.skills.length === 5, 'Skills: now have 5 skills after adding');
    check(typeof t1.skills[4].name === 'string', 'Skills: new skill has name (required field)');
    check(t1.skills[4].status === "available", 'Skills: new skill default status is "available"');
    const res1 = validateAgainstSchema(t1, 'skills-add');
    check(res1.valid, 'Skills: new skill serializes validly',
      res1.valid ? '✓ name is required, status allowed values ok' : res1.errors.map(e => e.message).join('; '));

    // Test 2: Change status unchecked → checked (unchecked → spent)
    const t2 = structuredClone(origSkeleton);
    t2.skills[0].status = "spent";
    check(t2.skills[0].status === "spent", 'Skills: status changed to spent');
    const res2 = validateAgainstSchema(t2, 'skills-spent');
    // "spent" is valid per schema enum: ["available", "spent", "struck"]
    check(res2.valid, 'Skills: status="spent" is schema-valid enum value');

    // Test 3: Change status checked → lost (spent → struck)
    const t3 = structuredClone(origSkeleton);
    t3.skills[2].status = "struck";
    check(t3.skills[2].status === "struck", 'Skills: status changed to struck');
    const res3 = validateAgainstSchema(t3, 'skills-struck');
    check(res3.valid, 'Skills: status="struck" is schema-valid enum value');

    // Test 4: Add skill without description
    const t4 = structuredClone(origSkeleton);
    t4.skills.push({ name: "Minimal Skill" });
    // Description is optional in schema — should be fine if absent
    // Actually check if schema allows omission: yes, only "name" is required
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 5: Resources Editor (editResources)
  // ════════════════════════════════════════════════════════════════════════
  log('<div class="section-title">PHASE 5: Resources Editor (editResources)</div>');
  log('<i>Tests: add resource, change status, change type</i><br>');

  {
    // Test 1: Add new resource
    const t1 = structuredClone(origSkeleton);
    t1.resources.push({
      name: "Leather Satchel",
      description: "Contains journals, dried herbs, and a small knife.",
      type: "portable",
      status: "available"
    });
    check(t1.resources.length === 4, 'Resources: now have 4 resources after adding');
    check(t1.resources[3].type === "portable", 'Resources: new resource defaults to portable');
    check(t1.resources[3].status === "available", 'Resources: new resource defaults to available');
    const res1 = validateAgainstSchema(t1, 'resources-add');
    check(res1.valid, 'Resources: new resource serializes validly',
      res1.valid ? '✓ name (required), description, type (enum), status (enum) all valid' : res1.errors.map(e => e.message).join('; '));

    // Test 2: Change type from portable to stationary
    const t2 = structuredClone(origSkeleton);
    t2.resources[0].type = "stationary";
    check(t2.resources[0].type === "stationary", 'Resources: type changed to stationary');
    const res2 = validateAgainstSchema(t2, 'resources-type');
    check(res2.valid, 'Resources: type="stationary" is valid enum value');

    // Test 3: Strike a resource (change status to struck)
    const t3 = structuredClone(origSkeleton);
    t3.resources[2].status = "struck";
    check(t3.resources[2].status === "struck", 'Resources: status changed to struck');
    const res3 = validateAgainstSchema(t3, 'resources-struck');
    check(res3.valid, 'Resources: status="struck" is valid enum value');

    // Test 4: Add resource with minimal fields
    const t4 = structuredClone(origSkeleton);
    t4.resources.push({ name: "Key" });
    // name is required, description/type/status optional per schema
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 6: Characters Editor (editCharacters)
  // ════════════════════════════════════════════════════════════════════════
  log('<div class="section-title">PHASE 6: Characters Editor (editCharacters)</div>');
  log('<i>Tests: add mortal, add immortal, kill, revive, remove</i><br>');

  {
    // Test 1: Add new mortal character
    const t1 = structuredClone(origSkeleton);
    t1.characters.push({
      name: "Lydia Thorne",
      type: "mortal",
      description: "A young seamstress in the village.",
      status: "alive"
    });
    check(t1.characters.length === 5, 'Characters: now have 5 after adding mortal');
    check(t1.characters[4].type === "mortal", 'Characters: new character is mortal');
    check(typeof t1.characters[4].name === 'string', 'Characters: new character has name (required)');
    check(typeof t1.characters[4].type === 'string', 'Characters: new character has type (required)');
    const res1 = validateAgainstSchema(t1, 'characters-add-mortal');
    check(res1.valid, 'Characters: add mortal serializes validly',
      res1.valid ? '✓ name + type (required), description, status all valid' : res1.errors.map(e => e.message).join('; '));

    // Test 2: Add new immortal character
    const t2 = structuredClone(origSkeleton);
    t2.characters.push({
      name: "Baron Blackwood",
      type: "immortal",
      description: "A vampire from the 1700s. Cold and calculating.",
      status: "alive"
    });
    check(t2.characters[t2.characters.length-1].type === "immortal", 'Characters: new character is immortal');
    const res2 = validateAgainstSchema(t2, 'characters-add-immortal');
    check(res2.valid, 'Characters: add immortal serializes validly');

    // Test 3: Kill a character (set status to dead + add death_reason)
    const t3 = structuredClone(origSkeleton);
    const killedIdx = t3.characters.findIndex(c => c.status === "alive");
    if (killedIdx >= 0) {
      t3.characters[killedIdx].status = "dead";
