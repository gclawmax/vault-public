<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thousand Year Old Vampire — Chronicle Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #e8dfc8; --bg2: #dfd5ba; --bg3: #d4c9a8; --surface: #f0e8d0; --surface2: #e8ddc0;
  --ink: #1c1208; --ink-dim: #3a2c18; --ink-faint: #7a6040;
  --blood: #8b1a1a; --blood-bright: #c0392b; --accent: #5c3a10; --accent-dim: #8a6030;
  --border: #b8a070; --border-bright: #8a6030;
  --topbar-bg: #d4c9a8f2; --topbar-border: #b8a070;
  --pill-bg: #d4c9a8; --tag-bg: #c8b888; --shadow: rgba(0,0,0,.18); --torn-shadow: rgba(0,0,0,.14);
  --status-ok: #3a6a2a; --card-bg: #f5edd8; --card-bg2: #ece0c4;
  --edit-ring: #8b1a1a44;
}
[data-skin="dark"] {
  --bg: #14100c; --bg2: #1b1611; --bg3: #241d16; --surface: #1a140f; --surface2: #120d09;
  --ink: #efe3c6; --ink-dim: #cbb996; --ink-faint: #8a755c;
  --blood: #7a1a1a; --blood-bright: #b33a2e; --accent: #d1b15a; --accent-dim: #9a7c36;
  --border: #4f3a25; --border-bright: #7a5936;
  --topbar-bg: #0f0c08f2; --topbar-border: #2a1e12;
  --pill-bg: #241b13; --tag-bg: #2a2118; --shadow: rgba(0,0,0,.55); --torn-shadow: rgba(0,0,0,.45);
  --status-ok: #4f8f55; --card-bg: #1e1711; --card-bg2: #17110c;
  --edit-ring: #c0392b55;
}
[data-skin="scholar"] {
  --bg: #f5f0e8; --bg2: #ede6d8; --bg3: #e4dccc; --surface: #faf7f0; --surface2: #f0ebe0;
  --ink: #1a1208; --ink-dim: #4a3c28; --ink-faint: #9a8a70;
  --blood: #6b0f0f; --blood-bright: #9b2020; --accent: #2c4a6e; --accent-dim: #4a6a8e;
  --border: #c8bca0; --border-bright: #a09070;
  --topbar-bg: #ede6d8f5; --topbar-border: #c8bca0;
  --pill-bg: #e4dccc; --tag-bg: #ddd4c0; --shadow: rgba(0,0,0,.10); --torn-shadow: rgba(0,0,0,.08);
  --status-ok: #2a5a2a; --card-bg: #faf7f0; --card-bg2: #f0ebe0;
  --edit-ring: #6b0f0f44;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;min-height:100vh;}

/* ── Key Panel ── */
#key-panel{position:fixed;left:-320px;top:0;width:300px;height:100vh;background:var(--bg2);border-right:1px solid var(--border);padding:20px;z-index:200;transition:left .3s ease;overflow-y:auto;box-shadow:2px 0 15px var(--shadow);}
#key-panel.open{left:0;}
#key-toggle{position:fixed;left:10px;top:120px;z-index:199;background:var(--blood);border:none;color:white;width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:left .3s ease;}
#key-toggle.hidden{display:none;}
.key-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:8px;display:block;}
.key-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:8px;font-size:12px;font-family:'EB Garamond',serif;margin-bottom:16px;}
.key-input:focus{outline:none;border-color:var(--blood);box-shadow:0 0 4px var(--blood);}
.key-info{font-size:11px;color:var(--ink-faint);line-height:1.4;margin-bottom:16px;}

/* ── Top bar ── */
#top-bar{position:sticky;top:0;z-index:100;background:var(--topbar-bg);border-bottom:1px solid var(--topbar-border);backdrop-filter:blur(8px);}
#picker-row{display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap;}
#picker-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;color:var(--accent-dim);text-transform:uppercase;}
#game-select{flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--border);color:var(--ink);padding:8px 10px;font-size:15px;}
#game-select:disabled{opacity:.5;cursor:not-allowed;}
.top-btn{background:transparent;border:1px solid var(--border-bright);color:var(--accent);padding:6px 12px;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;text-transform:uppercase;}
.top-btn:hover{background:var(--blood);color:white;border-color:var(--blood);}
.top-btn.active-edit{background:var(--blood);color:white;border-color:var(--blood);}
#status-row{display:flex;align-items:center;gap:10px;padding:4px 16px 6px;font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--topbar-border);}
#status-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);}
#status-dot.ok{background:var(--status-ok);}
#status-dot.err{background:var(--blood-bright);}
#status-dot.busy{background:var(--accent);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.skin-btn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.skin-btn.active{border-color:var(--border-bright);}
.skin-btn[data-s="book"]{background:radial-gradient(circle at 35% 35%,#f0e8d0,#b8a070);}
.skin-btn[data-s="dark"]{background:radial-gradient(circle at 35% 35%,#4a3520,#1a1410);}
.skin-btn[data-s="scholar"]{background:radial-gradient(circle at 35% 35%,#faf7f0,#c8bca0);}

/* ── Edit mode indicator bar ── */
#edit-mode-banner{display:none;background:var(--blood);color:white;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:5px 16px;text-align:center;}
#edit-mode-banner.visible{display:block;}

/* ── App ── */
#app{max-width:1600px;margin:0 auto;padding:0 0 40px;}

/* ── Section edit wrapper ── */
.section-editwrap{position:relative;}
.section-editwrap .edit-section-btn{
  position:absolute;top:8px;right:10px;
  display:none;
  background:var(--blood);color:white;border:none;
  padding:3px 10px;cursor:pointer;
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  z-index:10;opacity:.85;
}
.section-editwrap .edit-section-btn:hover{opacity:1;}
body.edit-mode .section-editwrap .edit-section-btn{display:block;}
body.edit-mode .section-editwrap{outline:1px dashed var(--edit-ring);outline-offset:-2px;}

/* ── Section icon size ── */
.section-icon {
    font-size: 3em;
    margin-right: 0.35em;
    vertical-align: middle;
}

/* ── Modal overlay ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;}
#modal-overlay.open{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--border-bright);max-width:660px;width:90vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px var(--shadow);display:flex;flex-direction:column;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg3);}
.modal-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);}
.modal-close{background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:20px;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--blood);}
.modal-body{padding:20px 22px;flex:1;}
.modal-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg3);}
.modal-btn{background:var(--surface);border:1px solid var(--border-bright);color:var(--accent);padding:7px 18px;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;text-transform:uppercase;}
.modal-btn.primary{background:var(--blood);color:white;border-color:var(--blood);}
.modal-btn:hover{opacity:.9;}

/* ── Form elements inside modal ── */
.form-row{margin-bottom:16px;}
.form-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:6px;display:block;}
.form-input,.form-textarea,.form-select{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--ink);
  padding:8px 10px;font-family:'EB Garamond',serif;font-size:15px;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--blood);}
.form-textarea{resize:vertical;min-height:80px;line-height:1.6;}
.form-select{cursor:pointer;}
.form-hint{font-size:11px;color:var(--ink-faint);margin-top:4px;line-height:1.4;}
.form-row-inline{display:flex;gap:10px;align-items:flex-end;}
.form-row-inline .form-row{flex:1;margin-bottom:0;}

/* ── Strike button style ── */
.strike-btn{background:none;border:1px solid var(--border);color:var(--ink-faint);padding:3px 8px;cursor:pointer;font-size:11px;font-family:'Cinzel',serif;letter-spacing:.08em;text-transform:uppercase;}
.strike-btn.struck{background:var(--blood);color:white;border-color:var(--blood);opacity:.7;}
.strike-btn:hover{border-color:var(--blood);color:var(--blood);}
.strike-btn.struck:hover{opacity:1;}

/* ── Delete / trashcan button ── */
.trash-btn{background:none;border:1px solid var(--border);color:var(--ink-faint);padding:2px 6px;cursor:pointer;font-size:13px;line-height:1;opacity:.5;}
.trash-btn:hover{opacity:1;background:var(--blood);color:white;border-color:var(--blood);}

/* ── List items in edit modal (existing entries) ── */
.edit-list-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 10px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;
}
.edit-list-item.struck-item{opacity:.5;}
.edit-list-item-text{flex:1;font-size:.92rem;line-height:1.5;}
.edit-list-item-text.struck-text{text-decoration:line-through;text-decoration-color:var(--blood);}
.edit-list-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.edit-divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
.edit-section-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:10px;}

/* ── Skill / resource status chips ── */
.status-radio-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.status-radio{cursor:pointer;display:flex;align-items:center;gap:5px;font-size:.88rem;}
.status-radio input{cursor:pointer;}

/* ── Vampire header ── */
.vamp-header{text-align:center;padding:36px 20px 28px;border-bottom:1px solid var(--border);margin-bottom:0;}
.vamp-name-wrap{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 auto;max-width:700px;}
.vamp-rule{flex:1;display:flex;flex-direction:column;gap:4px;}
.vamp-rule span{display:block;background:var(--blood);height:1px;}
.vamp-rule span:first-child{opacity:.5;}
.vamp-rule span:last-child{opacity:.3;}
.vamp-name{font-family:'Cinzel Decorative',serif;font-weight:400;font-size:clamp(1.6rem,3.5vw,2.8rem);line-height:1.15;color:var(--blood);letter-spacing:.04em;white-space:nowrap;}
.vamp-subtitle{font-family:'Cinzel Decorative',serif;font-weight:400;font-size:clamp(.7rem,1.5vw,1rem);color:var(--ink-faint);letter-spacing:.08em;margin-top:10px;}
.vamp-epitaph{margin:14px auto 0;max-width:600px;padding:10px 16px;border-left:2px solid var(--blood);text-align:left;color:var(--ink-dim);font-style:italic;font-size:.95rem;background:var(--surface2);}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;}
.meta-pill{background:var(--pill-bg);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:9px;font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.08em;}
.meta-pill span{color:var(--accent);font-weight:700;}

/* ── Dashboard strip ── */
.dashboard-strip{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);background:var(--bg2);}
.strip-cell{padding:14px 18px;border-right:1px solid var(--border);}
.strip-cell:last-child{border-right:none;}
.strip-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:8px;display:flex;align-items:center;gap:6px;}

/* ── Marks ── */
.marks-inline{display:flex;flex-wrap:wrap;gap:6px;}
.mark-chip{background:var(--surface);border:1px solid var(--border);padding:3px 10px;font-size:.85rem;color:var(--ink-dim);position:relative;padding-left:18px;}
.mark-chip::before{content:'⬥';position:absolute;left:6px;color:var(--blood);font-size:.7rem;}

/* ── Skills ── */
.skills-inline{display:flex;flex-wrap:wrap;gap:6px;}
.skill-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);padding:3px 10px;font-size:.85rem;}
.skill-chip.lost{opacity:.4;text-decoration:line-through;text-decoration-color:var(--blood);}
.skill-chip.checked{border-color:var(--blood);}
.skill-box{width:12px;height:12px;border:1px solid var(--border-bright);display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0;}
.skill-chip.checked .skill-box{background:var(--blood);color:white;}

/* ── Resources ── */
.resources-inline{display:flex;flex-wrap:wrap;gap:6px;}
.resource-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);padding:3px 10px;font-size:.85rem;}
.resource-chip.lost{opacity:.4;text-decoration:line-through;text-decoration-color:var(--blood);}
.resource-type-icon{font-size:1rem;flex-shrink:0;filter:grayscale(0);}
/* Lost resources still get full icon, opacity on the chip */

/* ── Main layout ── */
.main-layout{display:grid;grid-template-columns:1fr minmax(0,2fr) 1fr;gap:0;min-height:60vh;}.char-col{border-right:1px solid var(--border);background:var(--bg2);min-width:0;flex-shrink:0;overflow-y:auto;}
.char-panel{flex:1;padding:16px;display:flex;flex-direction:column;min-height:0;}
.panel-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.char-group-label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:14px 0 6px;}
.char-group-label:first-child{margin-top:0;}
.char-list{flex:1;overflow-y:auto;min-height:0;padding-top:8px;}
.char-row{padding:7px 0;border-bottom:1px solid var(--border);font-size:.88rem;flex-shrink:0;}
.char-row:last-child{border-bottom:none;}
.char-row.dead{opacity:.4;}
.char-row.dead .char-row-name{text-decoration:line-through;text-decoration-color:var(--blood);}
.char-row-name{font-weight:600;color:var(--accent);font-size:.88rem;}
.char-row-desc{color:var(--ink-faint);font-size:.8rem;line-height:1.3;margin-top:1px;}

/* ── Journal ── */
.journal-col{padding:24px 28px;min-width:0;overflow-y:auto;min-height:0;max-height:85vh;}
.journal-entry{margin-bottom:30px;}
.journal-turn{font-family:'Cinzel',serif;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--blood);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.journal-turn::after{content:'';flex:1;height:1px;background:var(--border);}
.journal-scrap{background:var(--card-bg);border:1px solid var(--border);padding:18px 22px;box-shadow:2px 3px 10px var(--torn-shadow);}
.journal-prompt-text{margin-bottom:14px;padding:8px 12px;background:var(--tag-bg);border-left:3px solid var(--blood);font-size:.88rem;color:var(--ink-dim);line-height:1.5;}
.journal-body{line-height:1.8;}
.journal-body p{margin-bottom:12px;}
.journal-body p:last-child{margin-bottom:0;}
.journal-body em,.journal-body i{font-style:italic;}
.journal-awaiting{font-style:italic;color:var(--ink-faint);font-size:.9rem;}

/* ── Memories ── */
.memories-section{border-top:1px solid var(--border);background:var(--bg2);padding:20px 28px 28px;}
.memories-section-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.memories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.memory-block{background:var(--card-bg);border:1px solid var(--border);padding:14px 16px;font-size:.88rem;line-height:1.6;box-shadow:1px 2px 5px var(--shadow);}
.memory-block.forgotten{opacity:.4;border-style:dashed;}
.memory-block.forgotten .memory-title{text-decoration:line-through;text-decoration-color:var(--blood);}
.memory-title{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:8px;}
.memory-block p,.memory-block li{margin-bottom:6px;}
.memory-block ol,.memory-block ul{padding-left:16px;}

/* ── Diary ── */
.diary-strip{border-top:1px solid var(--border);background:var(--card-bg2);padding:16px 28px;}
.diary-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:10px;}
.diary-block{font-size:.92rem;line-height:1.75;color:var(--ink-dim);}
.diary-block p{margin-bottom:8px;}

/* ── Empty state ── */
#empty-state{text-align:center;padding:100px 20px;color:var(--ink-faint);}
#empty-state h2{font-family:'Cinzel Decorative',serif;font-size:2.2rem;font-weight:400;color:var(--blood);margin-bottom:10px;letter-spacing:.04em;}

/* ── Responsive ── */
@media(max-width:860px){
  .dashboard-strip{grid-template-columns:1fr;}
  .strip-cell{border-right:none;border-bottom:1px solid var(--border);}
  .strip-cell:last-child{border-bottom:none;}
  .main-layout{grid-template-columns:1fr;}
  .chars-col{border-right:none;border-bottom:1px solid var(--border);}
  .journal-col{padding:18px 16px;}
  .memories-section{padding:16px;}
  .memories-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- Key Panel -->
<button id="key-toggle" style="display:none;">🔑</button>
<div id="key-panel">
  <div class="key-label">🔑 Vault Key</div>
  <input type="password" id="vault-key" class="key-input" placeholder="ghp_...">
  <div class="key-info">The key to your vault.</div>
  <div class="key-label">🧠 Memory Key</div>
  <input type="password" id="memory-key" class="key-input" placeholder="ghp_...">
  <div class="key-info">The key to your memories...</div>
  <button class="modal-btn primary" onclick="closeKeyPanel()" style="width:100%">Done</button>
</div>

<!-- Edit Mode Banner -->
<div id="edit-mode-banner">✎ Edit Mode Active — Changes are local until you save</div>

<div id="top-bar">
  <div id="picker-row">
    <span id="picker-label">Chronicle</span>
    <select id="game-select"><option value="">— Loading games… —</option></select>
    <button id="back-btn" class="top-btn" onclick="resetToGameList()">← Games</button>
    <button id="refresh-btn" class="top-btn" onclick="refreshCurrent()">↻ Refresh</button>
    <button id="edit-mode-btn" class="top-btn" style="display:none;" onclick="toggleEditMode()">✎ Edit</button>
    <button id="save-btn" class="top-btn" style="display:none;" onclick="saveChronicle()">✓ Save</button>
    <button id="cancel-btn" class="top-btn" style="display:none;" onclick="cancelEditMode()">✕ Cancel</button>
    <div id="skin-switcher">
      <button class="skin-btn active" data-s="book"></button>
      <button class="skin-btn" data-s="dark"></button>
      <button class="skin-btn" data-s="scholar"></button>
    </div>
  </div>
  <div id="status-row">
    <div id="status-dot"></div>
    <span id="status-text">Loading game list…</span>
  </div>
</div>

<div id="app">
  <div id="empty-state">
    <h2>Thousand Year Old Vampire</h2>
    <p>Select a chronicle to begin.</p>
  </div>
  <div id="content" style="display:none;"></div>
</div>

<!-- Modal Overlay -->
<div id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Edit</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" id="modal-confirm-btn" onclick="modalConfirm()">Update</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════════
const GITHUB_API = 'https://api.github.com/repos/gclawmax/vault-public/contents/TTRPGs/Thousand%20Year%20Old%20Vampire/Vampires';
const RAW_BASE = 'https://raw.githubusercontent.com/gclawmax/vault-public/main/TTRPGs/Thousand%20Year%20Old%20Vampire/Vampires/';

let currentSha = null;
let currentFileUrl = null;
let currentJson = null;       // the raw source string currently loaded (JSON state)
let workingJson = null;       // the source string being edited (may differ from currentJson)
let editMode = false;
let hasUnsaved = false;
let parsedData = null;      // structured parse of current source
let currentModalConfirm = null;

// UTILITY
// ═══════════════════════════════════════════════════
function setStatus(state, msg) {
  document.getElementById('status-dot').className = state;
  document.getElementById('status-text').textContent = msg;
}
function getVaultKey() { return document.getElementById('vault-key').value.trim(); }
function getMemoryKey() { return document.getElementById('memory-key').value.trim(); }

document.querySelectorAll('.skin-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.body.removeAttribute('data-skin');
    if (btn.dataset.s !== 'book') document.body.setAttribute('data-skin', btn.dataset.s);
    document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    localStorage.setItem('tyov-skin', btn.dataset.s);
  });
});
(function(){
  const s = localStorage.getItem('tyov-skin') || 'book';
  if (s !== 'book') document.body.setAttribute('data-skin', s);
  document.querySelectorAll('.skin-btn').forEach(b => { if (b.dataset.s === s) b.classList.add('active'); else b.classList.remove('active'); });

// ═══════════════════════════════════════════════════
// GAME LIST LOADING
// ═══════════════════════════════════════════════════
async function loadGameList() {
  setStatus('busy', 'Loading chronicles…');
  try {
    const resp = await fetch(GITHUB_API);
    if (!resp.ok) throw new Error('GitHub API error: ' + resp.status);
    const files = await resp.json();
    const jsonFiles = files.filter(f => f.name.endsWith('.json') && f.name !== 'vampire-schema.json' && !f.name.startsWith('TEST_') && !f.name.startsWith('test_'));
    const sel = document.getElementById('game-select');
    sel.innerHTML = '<option value="">— Select a chronicle —</option>';
    jsonFiles.forEach(f => {
      const o = document.createElement('option');
      o.value = f.name;
      o.textContent = f.name.replace('.json', '');
      sel.appendChild(o);
    });
    setStatus('ok', `${jsonFiles.length} chronicle${jsonFiles.length !== 1 ? 's' : ''} found`);
  } catch(e) {
    setStatus('err', 'Failed to load game list: ' + e.message);
  }
}

document.getElementById('game-select').addEventListener('change', async (e) => {
  if (!e.target.value) return;
  await loadVampire(e.target.value);
});

async function loadVampire(filename) {
  setStatus('busy', `Loading ${filename}…`);
  try {
    const url = GITHUB_API + '/' + encodeURIComponent(filename);
    const resp = await fetch(url + (getVaultKey() ? '' : ''), {
      headers: getVaultKey() ? { Authorization: 'token ' + getVaultKey() } : {}
    });
    if (!resp.ok) throw new Error(resp.status);
    const data = await resp.json();
    currentSha = data.sha;
    currentFileUrl = url;
    currentJson = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    workingJson = currentJson;
    parsedData = parseSource(currentJson);
    // Fallback for lastPlayed: use GitHub commit date when JSON lacks it
    if (!parsedData.lastPlayed && data.committed_date) {
      parsedData.lastPlayed = data.committed_date.slice(0, 10);
    }
    renderChronicle(parsedData);
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('edit-mode-btn').style.display = '';
    setStatus('ok', `Loaded: ${filename}`);
  } catch(e) {
    setStatus('err', 'Load failed: ' + e.message);
  }
}

function resetToGameList() {
  if (editMode && hasUnsaved) {
    if (!confirm('You have unsaved changes. Discard them?')) return;
  }
  leaveEditMode();
  document.getElementById('content').style.display = 'none';
  document.getElementById('empty-state').style.display = 'block';
  document.getElementById('edit-mode-btn').style.display = 'none';
  document.getElementById('game-select').value = '';
  currentJson = null; workingJson = null; parsedData = null;
}

async function refreshCurrent() {
  const sel = document.getElementById('game-select');
  if (sel.value) await loadVampire(sel.value);
  else await loadGameList();
}

// ═══════════════════════════════════════════════
// ⏰ AUTO-POLLER — ETag conditional GET (30s, visible-only)
// GitHub docs: "304 responses do NOT count against rate limits."
// Only 200 (content changed) consumes quota (~60/hr unauth, 5k/hr+ with token).
// ═══════════════════════════════════════════════
var _ptl = null, _pviz = document.visibilityState === 'visible', _etag = {};

function _armPoll() { if (_pviz && !_ptl) { _ptl = setTimeout(_pollTick, 30000); } }
function _disPoll() { clearTimeout(_ptl); _ptl = null; }

function _pollTick() {
  if (!_pviz) { _ptl = setTimeout(_pollTick, 30000); return; }
  var t = [];
  var sel = document.getElementById('game-select');
  // Poll current vampire sheet
  if (sel.value) {
    t.push(_chkFile(GITHUB_API + '/' + encodeURIComponent(sel.value), 'v'));
  } else {
    t.push(_chkFile(GITHUB_API, 'g')); // refresh game list
  }
  Promise.allSettled(t).then(function() { _ptl = setTimeout(_pollTick, 30000); });
}

function _chkFile(url, key) {
  var h = {}, o = _etag['' + key];
  if (o && key !== '_') { h['If-None-Match'] = o; }
  var tok = getVaultKey();
  if (tok) { h['Authorization'] = 'token ' + tok; }
  fetch(url, {cache: 'no-store', headers: h}).then(function(r) {
    if (r.status === 304) {
      // unchanged — ZERO rate-limit cost
      return;
    }
    if (r.status === 403) {
      setStatus('err', 'Rate-limited — add Vault Key for 5,000/hr');
      return;
    }
    if (!r.ok) { return; }
    var et = r.headers.get('etag');
    if (et) { _etag['' + key] = et; }
    // Content changed
    if (key === 'v' && currentFileUrl) {
      return r.json().then(function(d) {
        currentSha = d.sha;
        currentJson = decodeURIComponent(escape(atob(d.content.replace(/\n/g, ''))));
        workingJson = currentJson;
        parsedData = parseSource(currentJson);
        renderChronicle(parsedData);
        setStatus('ok', '✓ Chronicle refreshed — ' + new Date().toLocaleTimeString());
      });
    }
    if (key === 'g') {
      // Game list changed — reload
      return r.json().then(function(files) {
        loadGameList();
        setStatus('ok', '✓ Chronicle list refreshed — ' + new Date().toLocaleTimeString());
      });
    }
  }).catch(function() { /* transient network error */ });
}

document.addEventListener('visibilitychange', function() {
  _pviz = document.visibilityState === 'visible';
  if (_pviz) { _armPoll(); } else { _disPoll(); }
});

// Start the poller immediately when the page is visible
if (_pviz) { _armPoll(); }

// ═══════════════════════════════════════════════
// JSON PARSER  (produces structured parsedData)
// ═══════════════════════════════════════════════
function parseSource(source) {
  const trimmed = source.trim();
  if (!trimmed) throw new Error('Empty JSON source');
  return jsonToParsedData(JSON.parse(trimmed));
}

function jsonToParsedData(json) {
  const data = {
    frontmatter: {},
    vampireName: json.name || '',
    subtitle: json.vampire_desc || '',
    mortalSelf: json.mortal_self || '',
    epithet: (json.epitaph && json.epitaph.experience) ? json.epitaph.experience : '',
    marks: (json.marks || []).map(m => ({ desc: m.description || '', concealment: m.concealment || '', struck: m.status === 'struck' })),
    memories: (json.memories || []).map((mem, idx) => {
      // Parse experiences — schema says they are raw strings, but in practice they may be objects {text, struck}
      const normalisedExps = [];
      ((mem.experiences || []).map(e => {
        if (typeof e === 'string') {
          normalisedExps.push({ text: e, struck: false });
        } else {
          // e is an object like { text, struck }
          normalisedExps.push({ text: e.text || e.description || '', struck: !!e.struck });
        }
      }));
      return {
        n: mem.n || idx + 1,
        theme: mem.name || '',
        experiences: normalisedExps,
        struck: mem.status === 'struck',
        inDiary: !!mem.in_diary,
        description: mem.description || ''    // ← schema field, currently not rendered
      };
    }),
    diary: {
      exists: Array.isArray(json.diary?.memories) && json.diary.memories.length > 0,
      memories: (json.diary?.memories || []).map((mem, idx) => {
        const name = typeof mem === 'string' ? mem : (mem.name || '');
        const exps = typeof mem === 'string' ? [] : (mem.experiences || []).map(e => {
          if (typeof e === 'string') return { text: e };
          return { text: e.text || e.description || '' };
        });
        return { n: mem.n || idx + 1, theme: name, experiences: exps };
      })
    },
    skills: (json.skills || []).map(sk => ({ name: sk.name || '', description: sk.description || '', status: sk.status === 'available' ? 'unchecked' : sk.status === 'spent' ? 'checked' : 'lost' })),
    resources: (json.resources || []).map(r => ({ name: r.name || '', description: r.description || '', type: r.type || 'portable', status: r.status === 'available' ? 'active' : 'lost' })),
    mortals: [],
    immortals: [],
    journal: (json.journal || []).map(j => ({
      turn: j.turn,
      prompt: j.prompt,
      entry: j.entry,
      promptText: j.prompt_text || j.paraphrased_prompt || '',
      prose: j.experience || '',
      changes: j.changes || '',
      awaiting: j.resolved === false
    })),
    epitaph: (json.epitaph && json.epitaph.experience) ? json.epitaph.experience : '',
    gameOver: !!json.game_over,
    lastPlayed: json.modified || '',
    rawAfterJournal: ''
  };

  (json.characters || []).forEach(c => {
    const entry = { name: c.name || '', desc: c.description || '', description: c.description || '', dead: c.status === 'dead', death_reason: c.death_reason || '' };
    if (c.type === 'mortal') data.mortals.push(entry);
    else data.immortals.push(entry);
  });

  data.frontmatter = {
    game_start: json.game_start || '',
    modified: json.modified || '',
    game_over: json.game_over ? 'true' : 'false',
    game_completed: json.game_completed || '',
    current_prompt: json.current_prompt !== undefined ? String(json.current_prompt) : '',
    prompts_resolved: json.prompts_resolved !== undefined ? String(json.prompts_resolved) : '',
    show_suggestions: json.show_suggestions ? 'true' : 'false',
    vampire: data.vampireName,
    vampire_desc: json.vampire_desc || ''
  };

  return data;
}

function serializeJson(d) {
  const json = {
    name: d.vampireName || '',
    vampire_desc: d.subtitle || '',
    mortal_self: d.mortalSelf || '',
    game_over: d.frontmatter.game_over === 'true',
    game_start: d.frontmatter.game_start || '',
    modified: new Date().toISOString().slice(0, 10),
    game_completed: d.frontmatter.game_completed || '',
    show_suggestions: d.frontmatter.show_suggestions === 'true',
    current_prompt: d.frontmatter.current_prompt ? parseInt(d.frontmatter.current_prompt, 10) : 0,
    prompts_resolved: d.frontmatter.prompts_resolved ? parseInt(d.frontmatter.prompts_resolved, 10) : 0,
    marks: (d.marks || []).map(m => ({ description: m.desc || '', concealment: m.concealment || '', status: m.struck ? 'struck' : 'available' })),
    memories: (d.memories || []).map(mem => ({
      name: mem.theme || `Memory ${mem.n || ''}`,
      description: mem.description || '',
      experiences: (mem.experiences || []).map(exp => {
        // The schema says experiences is string[]; store pure strings on save
        return typeof exp.text === 'string' ? exp.text : String(exp.text || '');
      }),
      status: mem.struck ? 'struck' : 'available',
      in_diary: !!mem.inDiary
    })),
    diary: {
      memories: (d.diary?.memories || []),
    },
    skills: (d.skills || []).map(sk => ({ name: sk.name || '', description: sk.description || '', status: sk.status === 'checked' ? 'spent' : sk.status === 'lost' ? 'struck' : 'available' })),
    resources: (d.resources || []).map(r => ({ name: r.name || '', description: r.description || '', type: r.type || 'portable', status: r.status === 'active' ? 'available' : 'struck' })),
    characters: [
      ...(d.mortals || []).map(c => ({ name: c.name || '', type: 'mortal', description: c.description || c.desc || '', status: c.dead ? 'dead' : 'alive', death_reason: c.death_reason || '' })),
      ...(d.immortals || []).map(c => ({ name: c.name || '', type: 'immortal', description: c.description || c.desc || '', status: c.dead ? 'dead' : 'alive', death_reason: c.death_reason || '' }))
    ],
    journal: (d.journal || []).map(j => ({
      turn: j.turn,
      prompt: j.prompt,
      entry: j.entry,
      prompt_text: j.promptText || '',
      resolved: !j.awaiting,
      paraphrased_prompt: j.promptText || '',
      experience: j.prose || '',
      changes: j.changes || ''
    }))
  };

  if (d.epitaph) json.epitaph = { experience: d.epitaph };
  return JSON.stringify(json, null, 2);
}

// ═══════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════
function renderChronicle(d) {
  const el = document.getElementById('content');
  const fm = d.frontmatter;

  let html = '';

  // ── Header ──
  html += `<div class="section-editwrap" data-section="header">
    <button class="edit-section-btn" onclick="editHeader()">✎ Edit</button>
    <div class="vamp-header">
      <div class="vamp-name-wrap">
        <div class="vamp-rule"><span></span><span></span></div>
        <div class="vamp-name">${esc(d.vampireName)}</div>
        <div class="vamp-rule"><span></span><span></span></div>
      </div>
      <div class="vamp-subtitle">A Thousand Year Old Vampire</div>
      <div class="vamp-epitaph">${esc(d.subtitle)}</div>
      <div class="meta-row">
        ${fm.game_start ? `<span class="meta-pill">Started <span>${fm.game_start}</span></span>` : ''}
        ${fm.game_over === 'true' ? `<span class="meta-pill" style="color:var(--blood)">Game Over</span>` : ''}
        ${d.lastPlayed ? `<span class="meta-pill">Last played <span>${d.lastPlayed}</span></span>` : ''}
      </div>
    </div>
  </div>`;

  // ── Dashboard (Marks / Skills / Resources) ──
  html += `<div class="dashboard-strip">`;

  // Marks cell
  html += `<div class="strip-cell section-editwrap" data-section="marks">
    <button class="edit-section-btn" onclick="editMarks()">✎ Edit</button>
    <div class="strip-label"><span class="section-icon">⚰</span> Marks</div>
    <div class="marks-inline">`;
  d.marks.filter(m=>!m.struck).forEach(m => {
    html += `<span class="mark-chip" title="Concealed: ${esc(m.concealment)}">${esc(m.desc)}</span>`;
  });
  if (d.marks.filter(m=>!m.struck).length === 0) html += `<span style="color:var(--ink-faint);font-size:.85rem;">None</span>`;
  html += `</div></div>`;

  // Skills cell
  html += `<div class="strip-cell section-editwrap" data-section="skills">
    <button class="edit-section-btn" onclick="editSkills()">✎ Edit</button>
    <div class="strip-label"><span class="section-icon">⚔</span> Skills</div>
    <div class="skills-inline">`;
  d.skills.forEach(sk => {
    const cls = sk.status === 'lost' ? 'lost' : sk.status === 'checked' ? 'checked' : '';
    html += `<span class="skill-chip ${cls}">
      <span class="skill-box">${sk.status === 'checked' ? '✓' : ''}</span>
      ${esc(sk.name)}
    </span>`;
  });
  html += `</div></div>`;

  // Resources cell
  html += `<div class="strip-cell section-editwrap" data-section="resources">
    <button class="edit-section-btn" onclick="editResources()">✎ Edit</button>
    <div class="strip-label"><span class="section-icon">🏚</span> Resources</div>
    <div class="resources-inline">`;
  d.resources.forEach(r => {
    const cls = r.status === 'lost' ? 'lost' : r.type;
    const icon = r.type === 'portable' ? '\uD83D\uDCE6' : r.type === 'stationary' ? '\uD83D\uDCCD' : '\u25CB';
    html += `<span class="resource-chip ${cls}" title="${r.type}">
      <span class="resource-type-icon">${esc(icon)}</span>
      ${esc(r.name)}
    </span>`;
  });
  html += `</div></div>`;

  html += `</div>`; // dashboard-strip

  // ── Main layout: Mortals | Journal | Immortals ──
  html += `<div class="main-layout">`;

  // ── Left: Mortal Characters ──
  html += `<div class="char-col section-editwrap" data-section="characters-mortal">
    <button class="edit-section-btn" onclick="editCharacters()">✎ Edit</button>
    <div class="char-panel" style="height:100%;"><div class="panel-title"><span class="section-icon">🧑</span> Mortal Characters</div>
    <div class="char-list">`;
  if (d.mortals.length === 0) {
    html += `<p style="color:var(--ink-faint);font-style:italic;font-size:.85rem;padding:8px 0;">None yet</p>`;
  }
  d.mortals.forEach(c => {
    html += `<div class="char-row ${c.dead ? 'dead' : ''}">
      <div class="char-row-name">${esc(c.name)}</div>
      <div class="char-row-desc">${esc(c.desc)}</div>
    </div>`;
  });
  html += `</div></div></div>`;

  // ── Middle: Journal ──
  html += `<div class="journal-col section-editwrap" data-section="journal">
    <button class="edit-section-btn" onclick="editJournal()">✎ Edit</button>`;
  if (d.journal.length === 0) {
    html += `<p style="color:var(--ink-faint);font-style:italic;">No journal entries yet.</p>`;
  }
  d.journal.forEach(j => {
    html += `<div class="journal-entry">
      <div class="journal-turn">Turn ${j.turn} — Prompt ${j.prompt}, Entry ${j.entry}</div>
      <div class="journal-scrap">
        <div class="journal-prompt-text">${esc(j.promptText)}</div>
        <div class="journal-body">`;
    if (j.prose) html += `<p>${esc(j.prose)}</p>`;
    if (j.awaiting) {
      html += `<p class="journal-awaiting">Awaiting resolution…</p>`;
    } else if (j.changes) {
      html += `<p style="font-size:.85rem;color:var(--ink-faint);border-top:1px solid var(--border);padding-top:10px;margin-top:10px;"><strong>Changes:</strong> ${esc(j.changes)}</p>`;
    }
    html += `</div></div></div>`;
  });
  html += `</div>`;

  // ── Right: Immortal Characters ──
  html += `<div class="char-col section-editwrap" data-section="characters-immortal">
    <div class="char-panel" style="height:100%;"><div class="panel-title"><span class="section-icon">🧛</span> Immortal Characters</div>
    <div class="char-list">`;
  if (d.immortals.length === 0) {
    html += `<p style="color:var(--ink-faint);font-style:italic;font-size:.85rem;padding:8px 0;">None yet</p>`;
  }
  d.immortals.forEach(c => {
    html += `<div class="char-row ${c.dead ? 'dead' : ''}">
      <div class="char-row-name">${esc(c.name)}</div>
      <div class="char-row-desc">${esc(c.desc)}</div>
    </div>`;
  });
  html += `</div></div></div>`;

  html += `</div>`; // main-layout

  // ── Memories ──
  html += `<div class="memories-section section-editwrap" data-section="memories">
    <button class="edit-section-btn" onclick="editMemories()">✎ Edit</button>
    <div class="memories-section-label"><span class="section-icon">🧠</span> Memories</div>
    <div class="memories-grid">`;
  d.memories.forEach(mem => {
    const cls = mem.struck ? 'forgotten' : '';
    const tag = mem.inDiary ? ' <span style="font-size:.75em;color:var(--blood)">(in diary)</span>' : '';
    html += `<div class="memory-block ${cls}">
      <div class="memory-title">Memory ${mem.n} — ${esc(mem.theme)}${tag}</div>
      <ol>`;
    mem.experiences.forEach(exp => {
      html += `<li${exp.struck ? ' style="text-decoration:line-through;opacity:.5"' : ''}>${esc(exp.text)}</li>`;
    });
    html += `</ol></div>`;
  });
  html += `</div></div>`;

  // ── Diary ──
  html += `<div class="diary-strip section-editwrap" data-section="diary">
    <button class="edit-section-btn" onclick="editDiary()">✎ Edit</button>
    <div class="diary-label">📖 Diary</div>
    <div class="diary-block">`;
  if (!d.diary.exists || d.diary.memories.length === 0) {
    html += `<p style="font-style:italic;color:var(--ink-faint)">No diary yet.</p>`;
  } else {
    d.diary.memories.forEach(mem => {
      html += `<p><strong>${esc(mem.theme)}</strong></p>`;
      mem.experiences.forEach(e => html += `<p style="padding-left:1em">— ${esc(e.text)}</p>`);
    });
  }
  html += `</div></div>`;

  el.innerHTML = html;
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════
// EDIT MODE TOGGLE
// ═══════════════════════════════════════════════════
function toggleEditMode() {
  if (!editMode) enterEditMode();
  else cancelEditMode();
}

function enterEditMode() {
  editMode = true;
  hasUnsaved = false;
  workingJson = currentJson;
  parsedData = parseSource(workingJson);
  document.body.classList.add('edit-mode');
  document.getElementById('edit-mode-btn').classList.add('active-edit');
  document.getElementById('edit-mode-btn').textContent = '✎ Editing';
  document.getElementById('save-btn').style.display = '';
  document.getElementById('cancel-btn').style.display = '';
  document.getElementById('edit-mode-banner').classList.add('visible');
  document.getElementById('game-select').disabled = true;
  document.getElementById('key-toggle').style.display = 'flex';
  setStatus('busy', 'Edit mode — changes not yet saved');
}

function leaveEditMode() {
  editMode = false;
  hasUnsaved = false;
  document.body.classList.remove('edit-mode');
  document.getElementById('edit-mode-btn').classList.remove('active-edit');
  document.getElementById('edit-mode-btn').textContent = '✎ Edit';
  document.getElementById('save-btn').style.display = 'none';
  document.getElementById('cancel-btn').style.display = 'none';
  document.getElementById('edit-mode-banner').classList.remove('visible');
  document.getElementById('game-select').disabled = false;
  document.getElementById('key-toggle').style.display = 'none';
  document.getElementById('key-panel').classList.remove('open');
}

function cancelEditMode() {
  if (hasUnsaved && !confirm('Discard unsaved changes?')) return;
  leaveEditMode();
  parsedData = parseSource(currentJson);
  renderChronicle(parsedData);
  setStatus('ok', 'Edit cancelled.');
}

function markUnsaved() {
  hasUnsaved = true;
  setStatus('busy', 'Unsaved changes');
}

// ═══════════════════════════════════════════════════
// SAVE TO GITHUB
// ═══════════════════════════════════════════════════
async function saveChronicle() {
  const token = getVaultKey();
  if (!token) { openKeyPanel(); alert('Please enter your vault key first (🔑 key panel).'); return; }
  if (!currentFileUrl) { setStatus('err', 'No file URL — reload the chronicle.'); return; }
  setStatus('busy', 'Saving…');
  try {
    const newJson = serializeJson(parsedData);
    const encoded = btoa(unescape(encodeURIComponent(newJson)));
    const resp = await fetch(currentFileUrl, {
      method: 'PUT',
      headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Chronicle update via TYOV viewer', content: encoded, sha: currentSha })
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.message || resp.status);
    }
    const result = await resp.json();
    currentSha = result.content.sha;
    currentJson = newJson;
    workingJson = newJson;
    leaveEditMode();
    renderChronicle(parsedData);
    setStatus('ok', 'Saved successfully ✓');
  } catch(e) {
    setStatus('err', 'Save failed: ' + e.message);
    alert('Save failed: ' + e.message);
  }
}

  if (parsedData.diary.memories.length === 0) {

      </div>
    </div>`;
  });

  const activeMemsNotInDiary = parsedData.memories.filter(m => !m.struck && !m.inDiary);
  if (parsedData.diary.memories.length < 4 && activeMemsNotInDiary.length > 0) {
    bodyHtml += `<hr class="edit-divider">
      <div class="edit-section-title">Move Active Memory to Diary</div>

    bodyHtml += `<p style="margin-top:12px;color:var(--blood);font-size:.85rem;font-style:italic;">Diary is full (4/4 memories).</p>`;

  openModal('Edit Diary', bodyHtml, () => {
    const sel = document.getElementById('ed-diary-mem');
    if (sel) {
      const memN = parseInt(sel.value);
      const mem = parsedData.memories.find(m => m.n === memN);
      if (mem) {
        // Move to diary: mark inDiary on active, add copy to diary section
        mem.inDiary = true;
        const newDiaryN = parsedData.diary.memories.length + 1;
        parsedData.diary.memories.push({ n: newDiaryN, theme: mem.theme, experiences: mem.experiences.filter(e=>!e.struck).map(e=>({text:e.text})) });
        parsedData.frontmatter.diary_exists = 'true';
        parsedData.frontmatter.diary_name = parsedData.frontmatter.diary_name || 'Diary';
        parsedData.diary.exists = true;
      }
    }
    closeModal(); markUnsaved(); renderChronicle(parsedData);
  });
}

function removeDiaryMem(i) {
  const removed = parsedData.diary.memories[i];
  // Unmark inDiary on the active memory
  const activeMem = parsedData.memories.find(m => m.theme === removed.theme);
  if (activeMem) activeMem.inDiary = false;
  parsedData.diary.memories.splice(i, 1);
  // Re-number
  parsedData.diary.memories.forEach((m, idx) => m.n = idx + 1);
  if (parsedData.diary.memories.length === 0) {
    parsedData.diary.exists = false;
    parsedData.frontmatter.diary_exists = 'false';
  }
  markUnsaved(); editDiary();
}

// These are separate from game actions (striking, killing, forgetting).
// Any admin with edit permission can delete items entirely from the JSON.

function deleteSkill(i) {
  if (!editMode) return;
  const sk = parsedData.skills[i];
  if (!confirm(`Delete the skill "${sk.name || ('Skill ' + (i+1))}"?

This is an admin action — it removes the skill entirely from the sheet, not just striking it.`)) return;
  parsedData.skills.splice(i, 1);
  markUnsaved();

function deleteResource(i) {
  if (!editMode) return;
  const r = parsedData.resources[i];
  if (!confirm(`Delete the resource "${r.name || ('Resource ' + (i+1))}"?

This is an admin action — it removes the resource entirely from the sheet.`)) return;
  parsedData.resources.splice(i, 1);

  setStatus('ok', 'Resource deleted');
  editResources();
}

function deleteChar(type, i) {
  if (!editMode) return;
  const arr = (type === 'mortal') ? parsedData.mortals : parsedData.immortals;
  const c = arr[i];
  if (!confirm(`Delete the character "${c.name || ('Character ' + (i+1))}"?

This is an admin action — it removes the character entirely from the sheet, different from killing (which marks them as dead).`)) return;
  arr.splice(i, 1);
  markUnsaved();
  setStatus('ok', 'Character deleted');
  editCharacters();
}

function deleteMemory(i) {
  if (!editMode) return;
  const mem = parsedData.memories[i];
  const label = mem.inDiary ? ' (in diary)' : '';
  if (!confirm(`Delete Memory ${mem.n} — "${mem.theme || ('Memory ' + mem.n)}"${label}?

This is an admin action — it removes the entire memory (and all its experiences) from the sheet.
If this memory has an entry in the diary, it will also be removed there.`)) return;
  if (mem.inDiary) {
    const diaryIdx = parsedData.diary.memories.findIndex(d => d.theme === mem.theme);
    if (diaryIdx !== -1) {
      parsedData.diary.memories.splice(diaryIdx, 1);
      parsedData.diary.memories.forEach((m, idx) => { m.n = idx + 1; });
      if (parsedData.diary.memories.length === 0) {
        parsedData.diary.exists = false;
      }
      // Clean up frontmatter
      parsedData.frontmatter.diary_exists = 'true';
      parsedData.frontmatter.diary_name = 'Diary';
      parsedData.diary.exists = true;
    }
  }
  parsedData.memories.splice(i, 1);
  parsedData.memories.forEach((m, idx) => { m.n = idx + 1; });
  markUnsaved();
  setStatus('ok', 'Memory deleted');
  editMemories();
}

function deleteDiaryMem(i) {
  if (!editMode) return;
  const mem = parsedData.diary.memories[i];
  if (!confirm(`Delete diary entry "${mem.theme || ('Diary ' + (i+1))}" entirely?

This is an admin action — removes it from the diary permanently.`)) return;
  const removed = parsedData.diary.memories[i];
  // Unmark inDiary on the active memory
  const activeMem = parsedData.memories.find(m => m.theme === removed.theme);
  if (activeMem) activeMem.inDiary = false;
  parsedData.diary.memories.splice(i, 1);
  parsedData.diary.memories.forEach((m, idx) => { m.n = idx + 1; });
  if (parsedData.diary.memories.length === 0) {
    parsedData.diary.exists = false;
    parsedData.frontmatter.diary_exists = 'false';
    parsedData.frontmatter.diary_name = 'Diary';
  }
  markUnsaved();
  setStatus('ok', 'Diary entry deleted');
  editDiary();
}

function deleteJournalEntry(i) {
  if (!editMode) return;
  const je = parsedData.journal[i];
  if (!confirm(`Delete journal entry (Turn ${je.turn}, Prompt ${je.prompt})?

This is an admin action — it removes the entire entry from the sheet.`)) return;
  parsedData.journal.splice(i, 1);
  // Re-number turns
  parsedData.journal.forEach((j, idx) => { j.turn = idx + 1; });
  markUnsaved();
  setStatus('ok', 'Journal entry deleted');
  editJournal();
}

// ── Journal ───────────────────────────────────────
function editJournal() {
  if (!editMode) return;
  const topEntry = parsedData.journal.length > 0 ? parsedData.journal.reduce((a,b) => a.turn > b.turn ? a : b) : null;

  let bodyHtml = '';

  // List existing journal entries (for deletion)
  if (parsedData.journal.length > 0) {
    bodyHtml += `<div class="edit-section-title">Journal Entries</div>`;
    parsedData.journal.forEach((je, idx) => {
      bodyHtml += `<div class="edit-list-item ${je.awaiting ? '' : ''}">
        <div class="edit-list-item-text"><strong>Turn ${je.turn} — Prompt ${je.prompt}, Entry ${je.entry}</strong><br><span style="color:var(--ink-dim);font-size:.85rem">${esc(je.promptText || je.prose || 'No text')}</span></div>
        <div class="edit-list-actions">
          <button class="trash-btn" onclick="deleteJournalEntry(${idx})" title="Delete journal entry entirely">🗑</button>
        </div>
      </div>`;
    });
    bodyHtml += `<hr class="edit-divider">`;
  }

  if (topEntry && topEntry.awaiting) {
    // Resolve current prompt
    bodyHtml += `<div class="edit-section-title" style="color:var(--blood);">Resolve Current Prompt — Turn ${topEntry.turn}</div>
      <div style="background:var(--tag-bg);border-left:3px solid var(--blood);padding:8px 12px;margin-bottom:14px;font-size:.88rem;color:var(--ink-dim);">${esc(topEntry.promptText)}</div>
      <div class="form-row">
        <label class="form-label">Journal Prose</label>
        <textarea class="form-textarea" id="ed-j-prose" style="min-height:100px;">${esc(topEntry.prose)}</textarea>
        <div class="form-hint">Your character's experience resolving this prompt.</div>
      </div>
      <div class="form-row">
        <label class="form-label">Changes (mechanical summary)</label>
        <input class="form-input" id="ed-j-changes" placeholder="e.g. Killed Lydia Thorne. Gained skill Bloodthirsty.">
        <div class="form-hint">Required. Describe what changed: characters killed, skills gained/lost, resources changed, memories added.</div>
      </div>
      <hr class="edit-divider">`;
  }

  // Add new prompt entry
  bodyHtml += `<div class="edit-section-title">Add New Journal Entry</div>
    <div class="form-row">
      <label class="form-label">Prompt Number (1–80)</label>
      <input class="form-input" id="ed-j-prompt" type="number" min="1" max="80" placeholder="e.g. 5">
    </div>
    <div class="form-row">
      <label class="form-label">Entry Number</label>
      <input class="form-input" id="ed-j-entry" type="number" min="1" max="3" value="1">
      <div class="form-hint">Prompts 1–71 allow up to 3 entries; 72–80 allow only 1.</div>
    </div>
    <div class="form-row">
      <label class="form-label">Prompt Text (exact, from prompts.json)</label>
      <textarea class="form-textarea" id="ed-j-ptext" style="min-height:60px;" placeholder="Paste the exact prompt text here…"></textarea>
    </div>`;

  openModal('Edit Journal', bodyHtml, () => {
    // Resolve current if awaiting
    if (topEntry && topEntry.awaiting) {
      const prose = document.getElementById('ed-j-prose') ? document.getElementById('ed-j-prose').value.trim() : '';
      const changes = document.getElementById('ed-j-changes') ? document.getElementById('ed-j-changes').value.trim() : '';
      if (changes) {
        topEntry.prose = prose;
        topEntry.changes = changes;
        topEntry.awaiting = false;
      }
    }
    // Add new entry
    const promptNum = parseInt(document.getElementById('ed-j-prompt').value || '0');
    const entryNum = parseInt(document.getElementById('ed-j-entry').value || '1');
    const pText = document.getElementById('ed-j-ptext').value.trim();
    if (promptNum >= 1 && pText) {
      const maxTurn = parsedData.journal.length > 0 ? Math.max(...parsedData.journal.map(j=>j.turn)) : 0;
      parsedData.journal.push({
        turn: maxTurn + 1,
        prompt: promptNum,
        entry: entryNum,
        promptText: pText,
        prose: '',
        changes: '',
        awaiting: true
      });
      parsedData.frontmatter.current_prompt = promptNum;
    }
    closeModal(); markUnsaved(); renderChronicle(parsedData);
  }, topEntry && topEntry.awaiting ? 'Resolve & Save' : 'Add Entry');
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
loadGameList();
</script>
