<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thousand Year Old Vampire — Chronicle Viewer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #e8dfc8;
      --bg2: #dfd5ba;
      --bg3: #d4c9a8;
      --surface: #f0e8d0;
      --surface2: #e8ddc0;
      --ink: #1c1208;
      --ink-dim: #3a2c18;
      --ink-faint: #7a6040;
      --blood: #8b1a1a;
      --blood-bright: #c0392b;
      --accent: #5c3a10;
      --accent-dim: #8a6030;
      --border: #b8a070;
      --border-bright: #8a6030;
      --topbar-bg: #d4c9a8f2;
      --topbar-border: #b8a070;
      --pill-bg: #d4c9a8;
      --tag-bg: #c8b888;
      --shadow: rgba(0, 0, 0, 0.18);
      --torn-shadow: rgba(0, 0, 0, 0.14);
      --status-ok: #3a6a2a;
    }

    [data-skin="dark"] {
      --bg: #1a1410;
      --bg2: #221c15;
      --bg3: #2d2418;
      --surface: #1e1710;
      --surface2: #160f08;
      --ink: #e8d9b8;
      --ink-dim: #a89070;
      --ink-faint: #6a5840;
      --blood: #8b1a1a;
      --blood-bright: #c0392b;
      --accent: #c9a84c;
      --accent-dim: #8a6e30;
      --border: #4a3520;
      --border-bright: #7a5530;
      --topbar-bg: #110d08f2;
      --topbar-border: #2a1e10;
      --pill-bg: #2a1e10;
      --tag-bg: #2d2418;
      --shadow: rgba(0, 0, 0, 0.5);
      --torn-shadow: rgba(0, 0, 0, 0.4);
      --status-ok: #4a8a4a;
    }

    [data-skin="scholar"] {
      --bg: #f5f0e8;
      --bg2: #ede6d8;
      --bg3: #e4dccc;
      --surface: #faf7f0;
      --surface2: #f0ebe0;
      --ink: #1a1208;
      --ink-dim: #4a3c28;
      --ink-faint: #9a8a70;
      --blood: #6b0f0f;
      --blood-bright: #9b2020;
      --accent: #2c4a6e;
      --accent-dim: #4a6a8e;
      --border: #c8bca0;
      --border-bright: #a09070;
      --topbar-bg: #ede6d8f5;
      --topbar-border: #c8bca0;
      --pill-bg: #e4dccc;
      --tag-bg: #ddd4c0;
      --shadow: rgba(0, 0, 0, 0.10);
      --torn-shadow: rgba(0, 0, 0, 0.08);
      --status-ok: #2a5a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      line-height: 1.75;
      min-height: 100vh;
    }

    #top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--topbar-border);
      backdrop-filter: blur(8px);
    }

    #picker-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      flex-wrap: wrap;
    }

    #picker-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: .14em;
      color: var(--accent-dim);
      text-transform: uppercase;
    }

    #game-select {
      flex: 1;
      min-width: 180px;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 8px 10px;
      font-size: 15px;
    }

    .top-btn {
      background: transparent;
      border: 1px solid var(--border-bright);
      color: var(--accent);
      padding: 6px 12px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      text-transform: uppercase;
    }

    .top-btn:hover {
      background: var(--blood);
      color: white;
    }

    #status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 16px 6px;
      font-size: 12px;
      color: var(--ink-faint);
      border-bottom: 1px solid var(--topbar-border);
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink-faint);
    }

    #status-dot.ok {
      background: var(--status-ok);
    }

    #status-dot.err {
      background: var(--blood-bright);
    }

    #status-dot.busy {
      background: var(--accent);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    #app {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 110px;
      max-height: calc(100vh - 130px);
      overflow-y: auto;
      padding-right: 4px;
    }

    .sidebar details {
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 14px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .sidebar summary {
      cursor: pointer;
      list-style: none;
      padding: 14px 16px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 1px solid transparent;
      background: var(--bg2);
    }

    .sidebar details[open] summary {
      border-bottom-color: var(--border);
    }

    .sidebar-content {
      padding: 16px;
    }

    .main-column {
      min-width: 0;
    }

    .vamp-header {
      text-align: center;
      padding: 44px 0 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .vamp-name {
      font-family: 'UnifrakturMaguntia', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .vamp-subtitle {
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: 10px;
      margin-top: 8px;
      font-family: 'Cinzel', serif;
    }

    .vamp-epitaph {
      margin: 18px auto 0;
      max-width: 700px;
      padding-left: 16px;
      border-left: 2px solid var(--blood);
      text-align: left;
      color: var(--ink-dim);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .meta-pill {
      background: var(--pill-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 10px;
      font-family: 'Cinzel', serif;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .meta-pill span {
      color: var(--accent);
      font-weight: 700;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent-dim);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .marks-list {
      list-style: none;
    }

    .marks-list li {
      padding: 10px 0 10px 22px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .marks-list li::before {
      content: '⬥';
      position: absolute;
      left: 0;
      color: var(--blood);
    }

    .memory-block,
    .skill-row,
    .resource-card,
    .char-card,
    .diary-block {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .memory-block.forgotten,
    .skill-row.lost,
    .resource-card.lost,
    .char-card.dead {
      opacity: .45;
      text-decoration: line-through;
      text-decoration-color: var(--blood);
    }

    .memory-title,
    .char-group-title {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent-dim);
      margin-bottom: 10px;
    }

    .skills-grid,
    .resource-grid {
      display: grid;
      gap: 10px;
    }

    .skill-row {
      display: flex;
      gap: 12px;
    }

    .skill-check {
      width: 18px;
      height: 18px;
      border: 1px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .skill-row.checked .skill-check {
      background: var(--blood);
      color: white;
    }

    .resource-card {
      display: flex;
      gap: 12px;
    }

    .resource-icon {
      font-size: 18px;
    }

    .char-name,
    .resource-name,
    .skill-name {
      font-weight: 700;
      color: var(--accent);
    }

    .char-desc,
    .resource-desc,
    .skill-desc {
      color: var(--ink-dim);
      font-size: .95rem;
    }

    .journal-entry {
      margin-bottom: 34px;
    }

    .journal-turn {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--blood);
      margin-bottom: 8px;
    }

    .journal-scrap {
      background: var(--surface2);
      padding: 20px 24px;
      box-shadow: 0 3px 10px var(--torn-shadow);
    }

    .journal-prompt-text {
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--tag-bg);
      border-left: 3px solid var(--blood);
    }

    .journal-body {
      line-height: 1.8;
    }

    .journal-body p {
      margin-bottom: 14px;
    }

    .journal-body em,
    .journal-body i {
      font-style: normal;
    }

    .journal-changes {
      margin-top: 16px;
      padding: 10px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      font-size: .85rem;
    }

    .journal-changes strong {
      text-transform: uppercase;
      font-family: 'Cinzel', serif;
      font-size: .8rem;
    }

    #empty-state {
      text-align: center;
      padding: 100px 20px;
      color: var(--ink-faint);
    }

    #empty-state h2 {
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    .skin-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .skin-btn.active {
      border-color: var(--border-bright);
    }

    .skin-btn[data-s="book"] {
      background: radial-gradient(circle at 35% 35%, #f0e8d0, #b8a070);
    }

    .skin-btn[data-s="dark"] {
      background: radial-gradient(circle at 35% 35%, #4a3520, #1a1410);
    }

    .skin-btn[data-s="scholar"] {
      background: radial-gradient(circle at 35% 35%, #faf7f0, #c8bca0);
    }

    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .right-sidebar {
        grid-column: 1 / -1;
        position: static;
        max-height: none;
      }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

      .left-sidebar {
        order: 1;
      }

      .main-column {
        order: 2;
      }

      .right-sidebar {
        order: 3;
      }

      #app {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div id="top-bar">
    <div id="picker-row">
      <span id="picker-label">Chronicle</span>
      <select id="game-select">
        <option value="">— Loading games… —</option>
      </select>
      <button id="back-btn" class="top-btn">← Games</button>
      <button id="refresh-btn" class="top-btn">↻ Refresh</button>

      <div id="skin-switcher">
        <button class="skin-btn active" data-s="book"></button>
        <button class="skin-btn" data-s="dark"></button>
        <button class="skin-btn" data-s="scholar"></button>
      </div>
    </div>

    <div id="status-row">
      <div id="status-dot"></div>
      <span id="status-text">Loading game list…</span>
    </div>
  </div>

  <div id="app">

    <div id="empty-state">
      <h2>Thousand Year Old Vampire</h2>
      <p>Select a chronicle to begin.</p>
    </div>

    <div id="content" style="display:none"></div>

  </div>

  <script>
    const POLL_INTERVAL = 60;

    const GITHUB_API = 'https://api.github.com/repos/gclawmax/vault-public/contents/TTRPGs/Thousand%20Year%20Old%20Vampire';

    const RAW_BASE = 'https://raw.githubusercontent.com/gclawmax/vault-public/main/TTRPGs/Thousand%20Year%20Old%20Vampire/';

    let currentSha = null;
    let currentUrl = null;

    function setStatus(state, msg) {
      document.getElementById('status-dot').className = state;
      document.getElementById('status-text').textContent = msg;
    }

    (function () {
      const saved = localStorage.getItem('tyov-skin') || 'book';
      applySkin(saved);

      document.querySelectorAll('.skin-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applySkin(btn.dataset.s);
          localStorage.setItem('tyov-skin', btn.dataset.s);
        });
      });

      function applySkin(skin) {
        if (skin === 'book') {
          document.documentElement.removeAttribute('data-skin');
        } else {
          document.documentElement.setAttribute('data-skin', skin);
        }

        document.querySelectorAll('.skin-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.s === skin);
        });
      }
    })();

    async function loadGameList() {
      setStatus('busy', 'Fetching chronicle list…');

      try {
        const res = await fetch(GITHUB_API + '?nocache=' + Date.now());
        const files = await res.json();

        const mds = files.filter(f => f.name.endsWith('.md'));

        const sel = document.getElementById('game-select');

        sel.innerHTML = '<option value="">— Choose a chronicle —</option>';

        mds.forEach(f => {
          const opt = document.createElement('option');
          opt.value = RAW_BASE + encodeURIComponent(f.name);
          opt.textContent = f.name.replace('.md', '');
          sel.appendChild(opt);
        });

        setStatus('ok', 'Chronicles loaded');

      } catch (e) {
        setStatus('err', e.message);
      }
    }

    async function loadChronicle(url) {
      if (!url) return;

      currentUrl = url;

      setStatus('busy', 'Loading chronicle…');

      try {
        const res = await fetch(url + '?nocache=' + Date.now());
        let md = await res.text();

        md = md.replace(/\bBorn\b/g, 'Game Started');

        const html = render(md);

        const content = document.getElementById('content');

        content.innerHTML = html;
        content.style.display = 'block';

        document.getElementById('empty-state').style.display = 'none';

        setStatus('ok', 'Chronicle loaded');

      } catch (e) {
        setStatus('err', e.message);
      }
    }

    function stripFrontmatter(md) {
      if (md.startsWith('---')) {
        const end = md.indexOf('---', 3);

        if (end !== -1) {
          return {
            fm: md.slice(3, end).trim(),
            body: md.slice(end + 3).trim()
          };
        }
      }

      return { fm: '', body: md };
    }

    function parseFrontmatter(fm) {
      const meta = {};

      fm.split('\n').forEach(line => {
        const m = line.match(/^(\w+):\s*(.+)$/);

        if (m) {
          meta[m[1]] = m[2].replace(/^["']|["']$/g, '');
        }
      });

      return meta;
    }

    function parseVampire(md) {
      const { fm, body } = stripFrontmatter(md);
      const meta = parseFrontmatter(fm);

      const sections = {};
      let current = '__header__';
      const buf = [];

      for (const line of body.split('\n')) {
        if (line.startsWith('## ')) {
          sections[current] = buf.join('\n').trim();
          buf.length = 0;
          current = line.replace('## ', '').replace(/^[^\w]+/, '').trim();
        } else {
          buf.push(line);
        }
      }

      sections[current] = buf.join('\n').trim();

      return { meta, sections };
    }

    function renderMarks(text) {
      const items = text.match(/^[-*]\s+.+/gm) || [];

      return '<ul class="marks-list">' +
        items.map(i => '<li>' + i.replace(/^[-*]\s+/, '') + '</li>').join('') +
        '</ul>';
    }

    function renderMemories(text) {
      return text.split(/\n(?=###\s)/).map(block => {
        const tm = block.match(/^###\s+(.+)/);
        const title = tm ? tm[1].replace(/~~/g, '') : '';

        const forgotten = block.includes('~~');

        const rest = block.replace(/^###.+\n/, '').trim();

        return '<div class="memory-block' + (forgotten ? ' forgotten' : '') + '">' +
          '<div class="memory-title">' + title + '</div>' +
          marked.parse(rest.replace(/~~/g, '')) +
          '</div>';
      }).join('');
    }

    function renderDiary(text) {
      return '<div class="diary-block">' + marked.parse(text) + '</div>';
    }

    function renderJournal(text) {
      return text.split(/\n(?=###\s)/).map(block => {
        const tm = block.match(/^###\s+(.+)/);
        const title = tm ? tm[1] : '';

        const rest = block.replace(/^###.+\n/, '').trim();

        const pm = rest.match(/^\*(.+)\*/);
        const promptText = pm ? pm[1] : '';

        const body = promptText ? rest.replace(/^\*.+\*\n+/, '') : rest;

        return '<div class="journal-entry">' +
          '<div class="journal-turn">' + title + '</div>' +
          '<div class="journal-scrap">' +
          (promptText ? '<div class="journal-prompt-text">' + promptText + '</div>' : '') +
          '<div class="journal-body">' + marked.parse(body) + '</div>' +
          '</div>' +
          '</div>';
      }).join('');
    }

    function renderSkills(text) {
      const rows = text.match(/\|.+\|/g) || [];

      return '<div class="skills-grid">' +
        rows.slice(2).map(r => {
          const cells = r.split('|').map(c => c.trim()).filter(Boolean);

          const rn = cells[0] || '';
          const rs = cells[1] || '';

          const lost = rn.includes('~~');
          const checked = rs.includes('☑');

          return '<div class="skill-row ' + (lost ? 'lost' : checked ? 'checked' : '') + '">' +
            '<div class="skill-check">' + (checked ? '✓' : '') + '</div>' +
            '<div>' +
            '<div class="skill-name">' + rn.replace(/~~/g, '') + '</div>' +
            '<div class="skill-desc">' + rs.replace(/☑/g, '') + '</div>' +
            '</div>' +
            '</div>';
        }).join('') +
        '</div>';
    }

    function renderResources(text) {
      const rows = text.match(/\|.+\|/g) || [];

      return '<div class="resource-grid">' +
        rows.slice(2).map(r => {
          const cells = r.split('|').map(c => c.trim()).filter(Boolean);

          const rn = cells[0] || '';
          const rt = cells[1] || '';

          const lost = rn.includes('~~');

          return '<div class="resource-card ' + (lost ? 'lost' : '') + '">' +
            '<div class="resource-icon">🎒</div>' +
            '<div>' +
            '<div class="resource-name">' + rn.replace(/~~/g, '') + '</div>' +
            '<div class="resource-desc">' + rt + '</div>' +
            '</div>' +
            '</div>';
        }).join('') +
        '</div>';
    }

    function renderCharacters(text) {
      return text.split(/\n(?=###\s)/).map(block => {
        const tm = block.match(/^###\s+(.+)/);
        const title = tm ? tm[1] : '';

        const rest = block.replace(/^###.+\n/, '').trim();

        const cards = rest.split('\n').filter(l => l.startsWith('-')).map(line => {
          const dead = line.includes('~~');

          const clean = line.replace(/^-\s*/, '').replace(/~~/g, '');

          const parts = clean.split('—');

          return '<div class="char-card ' + (dead ? 'dead' : '') + '">' +
            '<div class="char-name">' + parts[0] + '</div>' +
            '<div class="char-desc">' + (parts[1] || '') + '</div>' +
            '</div>';
        }).join('');

        return '<div class="char-group-title">' + title + '</div>' + cards;
      }).join('');
    }

    function render(md) {
      const { meta, sections } = parseVampire(md);

      const header = sections['__header__'] || '';

      const vampName = (header.match(/^#\s+(.+)/m) || [])[1] || 'Unknown Vampire';

      const epitaph = (header.match(/^>\s*\*?(.+?)\*?\s*$/m) || [])[1] || '';

      return `
        <div class="layout">

          <aside class="sidebar left-sidebar">

            <details open>
              <summary>👥 Characters</summary>
              <div class="sidebar-content">
                ${sections['Characters'] ? renderCharacters(sections['Characters']) : ''}
              </div>
            </details>

            <details>
              <summary>⚰ Marks</summary>
              <div class="sidebar-content">
                ${sections['Marks'] ? renderMarks(sections['Marks']) : ''}
              </div>
            </details>

            <details>
              <summary>🏚 Resources</summary>
              <div class="sidebar-content">
                ${sections['Resources'] ? renderResources(sections['Resources']) : ''}
              </div>
            </details>

            <details>
              <summary>⚔ Skills</summary>
              <div class="sidebar-content">
                ${sections['Skills'] ? renderSkills(sections['Skills']) : ''}
              </div>
            </details>

          </aside>

          <main class="main-column">

            <div class="vamp-header">
              <div class="vamp-name">${vampName}</div>
              <div class="vamp-subtitle">A Thousand Year Old Vampire</div>

              ${epitaph ? `<div class="vamp-epitaph">${epitaph}</div>` : ''}

              <div class="meta-row">
                ${meta.current_prompt ? `<div class="meta-pill">Prompt <span>${meta.current_prompt}</span></div>` : ''}
                ${meta.prompts_resolved ? `<div class="meta-pill">Resolved <span>${meta.prompts_resolved}</span></div>` : ''}
                ${meta.created ? `<div class="meta-pill">Game Started <span>${meta.created}</span></div>` : ''}
                ${meta.modified ? `<div class="meta-pill">Updated <span>${meta.modified}</span></div>` : ''}
              </div>
            </div>

            <div class="section">
              <div class="section-title">📜 Journal</div>
              ${sections['Journal'] ? renderJournal(sections['Journal']) : ''}
            </div>

          </main>

          <aside class="sidebar right-sidebar">

            <details open>
              <summary>📖 Diary</summary>
              <div class="sidebar-content">
                ${sections['Diary'] ? renderDiary(sections['Diary']) : ''}
              </div>
            </details>

            <details>
              <summary>🧠 Memories</summary>
              <div class="sidebar-content">
                ${sections['Memories'] ? renderMemories(sections['Memories']) : ''}
              </div>
            </details>

          </aside>

        </div>
      `;
    }

    document.getElementById('game-select').addEventListener('change', e => {
      loadChronicle(e.target.value);
    });

    document.getElementById('refresh-btn').addEventListener('click', () => {
      if (currentUrl) loadChronicle(currentUrl);
    });

    window.addEventListener('load', loadGameList);
  </script>

</body>
</html>
