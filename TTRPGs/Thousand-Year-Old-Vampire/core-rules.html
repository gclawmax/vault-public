// ═══════════════════════════════════════════════════════
// SLUG HELPER — used everywhere IDs are generated
// ═══════════════════════════════════════════════════════
function slugify(text) {
  return text.trim()
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-');
}

// ═══════════════════════════════════════════════════════
// MARKDOWN RENDERER
// Handles: headings (with anchor links), bold, italic,
// inline code, blockquotes, hr, ul, ol, tables,
// inline links [text](url or #anchor), cross-links
// ═══════════════════════════════════════════════════════
function renderMarkdown(raw) {
  const lines = raw.split('\n');
  let html = '';
  let i = 0;

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Process inline formatting (bold, italic, code, links)
  function inline(s) {
    // inline code (before other replacements)
    s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
    // bold
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // italic (single * or _)
    s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
    s = s.replace(/_([^_\n]+?)_/g, '<em>$1</em>');
    // markdown links [text](#anchor) or [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => {
      if (href.startsWith('#')) {
        const slug = slugify(href.slice(1).replace(/-/g,' '));
        return `<a class="xlink" href="#${slug}" onclick="smoothScrollTo('${slug}');return false;">${text}</a>`;
      }
      return `<a href="${escHtml(href)}" target="_blank" rel="noopener">${escHtml(text)}</a>`;
    });
    // strikethrough
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
    return s;
  }

  function headingHtml(level, text) {
    const slug = slugify(text);
    const tag = `h${level}`;
    const anchorLink = `<a class="anchor-link" href="#${slug}" onclick="smoothScrollTo('${slug}');return false;" title="Link to this section">§</a>`;
    return `<${tag} id="${slug}">${anchorLink}${inline(text)}</${tag}>\n`;
  }

  while (i < lines.length) {
    const line = lines[i];

    // Headings
    const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
    if (hMatch) {
      html += headingHtml(hMatch[1].length, hMatch[2].trim());
      i++; continue;
    }

    // HR
    if (/^---+$/.test(line.trim())) {
      html += '<hr>\n';
      i++; continue;
    }

    // Blockquote
    if (line.startsWith('> ')) {
      let bqContent = '';
      while (i < lines.length && lines[i].startsWith('> ')) {
        bqContent += inline(lines[i].slice(2)) + ' ';
        i++;
      }
      html += `<blockquote><p>${bqContent.trim()}</p></blockquote>\n`;
      continue;
    }

    // Table
    if (line.includes('|') && lines[i+1] && /^\|?[\s\-:]+\|/.test(lines[i+1])) {
      const headerCells = line.split('|').map(c=>c.trim()).filter(c=>c!=='');
      i += 2; // skip separator
      let tableHtml = '<table>\n<thead><tr>';
      headerCells.forEach(c => { tableHtml += `<th>${inline(c)}</th>`; });
      tableHtml += '</tr></thead>\n<tbody>\n';
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c=>c.trim()).filter(c=>c!=='');
        tableHtml += '<tr>';
        cells.forEach(c => { tableHtml += `<td>${inline(c)}</td>`; });
        tableHtml += '</tr>\n';
        i++;
      }
      tableHtml += '</tbody></table>\n';
      html += tableHtml;
      continue;
    }

    // Unordered list
    if (/^[-*]\s/.test(line)) {
      html += '<ul>\n';
      while (i < lines.length && /^[-*]\s/.test(lines[i])) {
        // Sub-list?
        if (/^\s{2,}[-*]\s/.test(lines[i])) {
          html += `<li class="sub">${inline(lines[i].replace(/^\s+[-*]\s/, ''))}</li>\n`;
        } else {
          html += `<li>${inline(lines[i].replace(/^[-*]\s/, ''))}</li>\n`;
        }
        i++;
      }
      html += '</ul>\n';
      continue;
    }

    // Ordered list
    if (/^\d+\.\s/.test(line)) {
      html += '<ol>\n';
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
        html += `<li>${inline(lines[i].replace(/^\d+\.\s/, ''))}</li>\n`;
        i++;
      }
      html += '</ol>\n';
      continue;
    }

    // Blank line
    if (line.trim() === '') {
      i++; continue;
    }

    // Paragraph — accumulate consecutive non-special lines
    let para = '';
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^#{1,4}\s/.test(lines[i]) &&
           !/^[-*]\s/.test(lines[i]) &&
           !/^\d+\.\s/.test(lines[i]) &&
           !/^---+$/.test(lines[i].trim()) &&
           !lines[i].startsWith('> ') &&
           !lines[i].includes('|')) {
      para += (para ? ' ' : '') + lines[i];
      i++;
    }
    if (para.trim()) {
      html += `<p>${inline(para.trim())}</p>\n`;
    }
  }
  return html;
}

const README = `# Thousand Year Old Vampire — Core Rules

Based on the TYOV rulebook (Tim Hutchings). Extracted from pages 7–29.

---

## Contents

- [Overview](#overview)
- [What You Need](#what-you-need)
- [Core Concepts](#core-concepts)
  - [The Five Traits](#the-five-traits)
  - [Memories and Experiences](#memories-and-experiences)
  - [The Diary](#the-diary)
- [Trait Types](#trait-types)
  - [Marks](#marks)
  - [Skills](#skills)
  - [Resources](#resources)
  - [Characters](#characters)
- [Character Creation](#character-creation)
- [Playing the Game](#playing-the-game)
  - [Rolling the Dice](#rolling-the-dice)
  - [Answering Prompts](#answering-prompts)
  - [Substitutions and Game Over](#substitutions-and-game-over)
  - [Two Styles of Play](#two-styles-of-play)
- [Philosophy and Tips](#philosophy-and-tips)
  - [Cede Control](#cede-control)
  - [Embrace the Darkness](#embrace-the-darkness)
  - [The Passage of Time](#the-passage-of-time)

---

## Overview

*Thousand Year Old Vampire* is a lonely solo role-playing game in which you chronicle the unlife of a vampire over the many centuries of their existence, beginning with the loss of mortality and ending with their inevitable destruction. This vampire will surprise you as they do things that are unexpected, unpleasant, and sometimes tragic. Making gut-churning decisions, performing irreconcilable acts, and resolving difficult narrative threads are what this game is about as you explore the vampire's human failings, villainous acts, and surprising victories. Game mechanics are simple and intuitive. Play progresses semi-randomly through the Prompts section of this book. Answer Prompts to learn about your vampire's wants and needs, to learn what challenges they face, and to chart their decline into senescence. Build up a character record of [Memories](#memories-and-experiences) and then lose them to the inexorable crush of time. See everyone you've loved and hated grow old and die, then turn to dust.

---

## What You Need

You will need a ten-sided die (d10) and a six-sided die (d6). If you lack dice, there are random number tables in Appendix II. To use them, all you need to do is drop a coin, point a finger, or use some other method to choose a random number from the table.

You will also need a way to record your vampire's story. Paper and pencil is fine, though it is very convenient to use a word processing document or other digital text tool. In a quick game you only need a few pieces of paper to maintain a character record but in the journaling game you might fill a whole diary. If you are brave or foolish, you can write in this book in the spaces provided.

In the appendix you will also find multiplayer rules, safety tools which let you push yourself as hard as possible, alternate Prompts, examples of play, and some context for the creation of the game itself.

---

## Core Concepts

### The Five Traits

The vampire whose chronicles you will record in this game is represented by five different traits: **[Memories](#memories-and-experiences)**, **[Skills](#skills)**, **[Resources](#resources)**, **[Characters](#characters)**, **[Marks](#marks)**. Almost every time you receive a Prompt, one of your traits will be modified. For instance, you may be instructed to check a [Skill](#skills). To do so, you place a checkmark next to that Skill. Alternately, the Prompt may cause you to lose a trait, which is indicated by striking it out with a line. Ensure the lost trait stays readable because you may refer back to it later or even restore it. Some Prompts will give even more dramatic instructions for changing your traits. At all times, follow the instructions given in the Prompt.

### Memories and Experiences

**Memories and Experiences** are important moments that have shaped your vampire, crystallized in writing. They make up the core of the vampire's self — the things they know and care about.

- An **Experience** is a particular event; a **Memory** is an arc of Experiences tied together by subject or theme.
- Experiences cover a particular event, but the amount of time represented might vary dramatically. An Experience might describe a few seconds of impactful events, or two hundred years of lurking in an old castle.
- Almost every Prompt will create an Experience, and Experiences eventually combine with one another to become Memories.

**Limits:**

- You begin with **five Memories**, each holding **up to three Experiences**.
- If you have filled all five Memories and need to start a new one, strike out an existing Memory and all the Experiences it contains — forgetting is a fundamental aspect of the game.
- You may only preserve Memories by moving them into a **[Diary](#the-diary)** (see below).

**Writing Experiences:**

An Experience is a single sentence that describes the resolution of a Prompt. A good format is:

> *"description of the event; how I feel or what I did about it."*

You may add an em dash at the end to include more information. If a new Experience clearly fits inside an existing Memory, add it there. If not, create a new Memory.

### The Diary

A **Diary** can hold up to four of your vampire's [Memories](#memories-and-experiences). Unlike Memories themselves, Diaries are physical objects added to your **[Resource](#resources)** list. You may create a Diary whenever you need to move a Memory into it. Like any other Resource, a Diary can be lost. When this happens, strike out the Memories it held.

- Your vampire can have **one Diary at a time**, and it must contain at least one Memory.
- A Memory placed in the Diary is no longer in your vampire's head — it exists only in the Diary, and your vampire accepts whatever is written as truth.
- Once a Memory has been transferred to the Diary, you may not add any further Experiences to that Memory.
- To move a Memory, simply indicate that the Memory is now written in the Diary.
- When you create a Diary, give it a short description and add it to the [Resource](#resources) list. Examples:
  - *A sturdy, leather-bound book*
  - *A collection of pictogram-adorned pots*
  - *A password-protected forum on an archaic website*

---

## Trait Types

### Marks

A Mark is a visible indication of your vampire's undying state, or anything that sets them apart from mortal people. Marks are permanent for the vampire's entire existence — they only change if a Prompt explicitly removes one.

When creating a Mark, consider whether your vampire conceals it, and how. Examples:

- A pair of great bat wings — *I cut them off with a saw but the stubs remain*
- Hypnotic eyes masked by smoked glasses
- A dark halo hidden under tall military hats
- Under the Moon, a shadow that takes the shape of a jaguar
- Animals fear me, children cry
- Hands with fingers bent into backwards claws, hidden by long sleeves

**A vampire should:**

- Prey on human beings for sustenance
- Seek to camouflage among those on which they feed
- Still have human needs in some sense
- Be susceptible to environmental dangers (sunlight, etc.)
- Be practically immortal, a loner

*The Prompts in TYOV are not necessarily geared toward complex political machinations between factions of immortals.*

### Skills

**Skills** describe the capabilities and characteristics of your vampire. They indicate what the vampire can do and what they might do. Examples:

- Swordplay
- Relaxing Banter
- Operate Heavy Machinery
- *I Do Not Blink The Sand Away*
- *I Teach the Nanissáanah*

When instructed to record a new Skill, relate it to the content of the Prompt. What will it feel like for a vampire to use a Skill tied to a [Memory](#memories-and-experiences) long lost?

- **Unchecked**: what your vampire *can* do.
- **Checked ☑**: what your vampire *has done* — a part of who they are. May only be checked once.
- **Struck ~~Skill~~**: lost entirely, gone.

Some Prompts will instruct you to check a Skill. Mechanically this means the Skill has been used. Narratively, a checked Skill gives you something to flavor your answers to later Prompts. **You may only check a Skill once.** If unchecked Skills are what your vampire is capable of, checked Skills are who the vampire is.

It's entirely possible — and narratively rich — that your vampire's only available Skill to help a friend is *Rage and Kill*. Revel in the plight.

### Resources

**Resources** are assets, structures, or items useful to your vampire or that they value. Examples:

- Knightly equipage
- A loyal impi
- A diamond tiara
- The Castle Umbrecht
- A business empire
- A lucky penny
- A carboy of acid
- A box of tallow candles

**Stationary Resources** cannot be physically hauled away when the vampire flees (e.g., a haunted cave, a hereditary title to land, a hidden pit house).

When creating Resources, make them contextually appropriate. When instructed to lose one, strike it out but leave the entry legible — lost things may return. Let your available Resources flavor how you write your Experiences.

**Inventing ad-hoc items** is allowed for narrative flavor (a fencing foil, a hunting dagger, etc.). These do not need to be listed as Resources and cannot be spent to satisfy mechanical needs.

### Characters

**Characters** are the people with whom your vampire has a relationship. Each should be named and described in a sentence fragment. Add descriptors each time you interact with them.

Characters can be **mortal** or **immortal**:

- **Mortals** die with the passage of time — expect every four or five Prompts. You may strike them out at that point. Outside of this, characters cannot be killed unless a Prompt tells you to.
- **Immortals** are supernatural beings for whom time has little meaning (other vampires, angels, demons, ghosts, scientific experiments, forgotten deities, spirits, animated corpses, household gods, and so on). Immortal Characters persist unless a prompt kills them.

If a helpful Character was introduced in one Prompt, work them into subsequent Prompts even if not instructed. Always include a Character when resolving a Prompt if it makes sense.

---

## Character Creation

Follow these steps in order:

**1. Create the Mortal Self**

Imagine a person in the distant past — a Roman emperor, a Mesopotamian midwife, a French knight. Write one Experience encapsulating their history, placed in [Memory](#memories-and-experiences) 1. This first Experience is a broad summary of the mortal life, not a single event.

**2. Create at least three Mortal [Characters](#characters)**

Relatives, friends, lovers, enemies, mentors, debtors — anything appropriate. Add them to the vampire's record sheet with a short description.

**3. Give your vampire three [Skills](#skills)**

Fit them for the mortal's lot in life and their historical context.

**4. Give your vampire three [Resources](#resources)**

Big or small, a Resource is a Resource. Obsidian knife or a fleet of warships — both work.

**5. Create three more Experiences**

Each enters a separate [Memory](#memories-and-experiences) (slots 2–4). Each Experience should combine two of your existing traits.

**6. Become a vampire**

Create an Immortal — the creature that cursed you with unlife. Then create a **[Mark](#marks)** (with a concealment method) and a final Experience (in Memory 5) describing how you became a creature of the night.

When complete, your vampire will have **three [Skills](#skills)**, **three [Resources](#resources)**, a **[Mark](#marks)**, **at least three Mortals**, **one Immortal**, and **one Experience in each of their five [Memories](#memories-and-experiences)**.

---

## Playing the Game

### Rolling the Dice

Roll your **d10** and **d6**, subtract d6 from d10:

| Result | Movement |
|--------|----------|
| Positive (1–9) | Move **forward** that many prompts |
| Zero | **Stay** on the same prompt (encounter it again) |
| Negative (−5 to −1) | Move **backward** (minimum prompt 1) |

Most common results: forward +1 to +4.

### Answering Prompts

To play, you answer a series of Prompts. These are sparks for creativity — respond to them in satisfying ways to learn about your vampire, experience their travails, and be surprised by their doings.

- You can answer in writing (like a journal) or just aloud to yourself.
- Number your entries to keep chronology straight.
- Every time you answer a Prompt, you must create an Experience and add it to a [Memory](#memories-and-experiences) (unless instructed otherwise).
- Prompts have **two or three entries** — these are encountered the second and third time you land on a Prompt.
- If you land on a Prompt and have exhausted all its entries, move to the next Prompt.
- You do not need to answer every question in a Prompt. Prompts will often combine to tell stories across turns.
- Any amount of time can pass between Prompts.

Prompts run 1–80. Prompts 72–80 are game-ending — each has only one entry, all dark.

### Substitutions and Game Over

If you are instructed to **check a [Skill](#skills)** but have no unchecked Skills available, **lose a [Resource](#resources)** instead. Likewise, if you cannot lose a Resource when instructed, **check a Skill**. When either substitution occurs, **narrate the worst possible outcome**.

**Rules:**

- Only **[Skills](#skills) and [Resources](#resources)** may be substituted for each other.
- You **may not** lose [Characters](#characters), [Memories](#memories-and-experiences), or [Marks](#marks) in place of a Skill or Resource.
- If you must lose a Skill or Resource and you have **none** left, then your **game is over**. Narrate your vampire's demise using the Prompt for inspiration.

**The game also ends if:**

- A Prompt explicitly tells you the game has ended.
- You are unable to check or lose a Skill or Resource when required.

---

### Two Styles of Play

**Quick Game**

Answer the Prompts entirely in the [Memory](#memories-and-experiences) area of your character record. Fast and satisfying, with greater flexibility in interpreting your vampire's story.

**Journaling Game**

Keep a diary. Answer the Prompts in writing, dedicating a short paragraph to each question. You will end up with a document you can look back on.

In both styles, you still add an Experience for each Prompt. If there are contradictions, your Memories and Experiences take precedence over journal detail.

In the Journaling Game you may modify or ignore earlier journal entries as your story clarifies — but you may **never** modify [Memories](#memories-and-experiences) unless instructed by a Prompt.

---

## Philosophy and Tips

### Cede Control

Answer Prompts in a way that feels natural. Never force things. If relationships between existing traits or past events relate to a Prompt, work them in. You do not need to tie everything together — it's not necessary. Your vampire will live for a thousand years and many small, unresolved events will occur. Sometimes a [Character](#characters) will appear then leave without accomplishing anything — that's fine. That's just how life, or un-life, is.

Feel free to gently reinterpret answers to earlier Prompts to better make sense of current situations. But don't try to force coherence. Unexplained events and gaps between prompts are perfectly natural.

### Embrace the Darkness

Overthinking is unhelpful. Not every Prompt needs to be important. You do not need to explain every decision you make while answering a Prompt. Let the game bring back what matters.

Be uncomfortable. Your protagonist is a vampire, even if you try to keep them decent and humane. Terrible and delicious things are going to happen. You should have moments of discomfort as Prompts combine with constrained resources to result in your vampire murdering loved ones and performing strange deeds. This is a strength of the game — let darkness fall where it may.

Prompts are also opportunities to learn about history and the real world. Turn to Wikipedia and read about anything you need. The game will wait.

### The Passage of Time

This game is about the grind of centuries. Your vampire will lose their very memories to the years and must pursue continuous reinvention to keep pace with society. Time is very loose — imagine its progression as you like.

Think about historical events and work them in when it feels right. World wars and political upheavals are hugely important, even for vampires.

**A useful guide:**

- **For the first seven or eight Prompts**, everyone your vampire knew is still alive and the world still feels familiar.
- **Final Experiences** might take place in the early 21st century.

### Conclusion

Don't fret about specific years, but watch for obvious breaks in the timeline. A series of Prompts might tell a small story before something interrupts. Take the opportunity to jump decades ahead. If you reach a game-ending Prompt and it's only the Fifteenth Century — that's fine too.

const contentEl = document.getElementById('content');
const tocEl = document.getElementById('toc-links');

function render() {
  contentEl.innerHTML = renderMarkdown(README);
  buildToc();
}

// ═══════════════════════════════════════════════════════
// TOC — built by scanning the rendered DOM headings
// ═══════════════════════════════════════════════════════
function buildToc() {
  const headings = contentEl.querySelectorAll('h1,h2,h3,h4');
  let html = '';
  headings.forEach(h => {
    const level = parseInt(h.tagName[1]);
    const id = h.id;
    // Get text without the anchor link
    const text = h.textContent.replace('§', '').trim();
    if (level === 1) {
      html += `<div class="toc-section-label">${text}</div>`;
    } else if (level === 2) {
      html += `<button class="toc-link" data-target="${id}">${text}</button>`;
    } else if (level === 3) {
      html += `<button class="toc-link sub" data-target="${id}">${text}</button>`;
    } else {
      html += `<button class="toc-link sub2" data-target="${id}">${text}</button>`;
    }
  });
  tocEl.innerHTML = html;

  // Wire up clicks
  tocEl.querySelectorAll('[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
      smoothScrollTo(btn.dataset.target);
      // Highlight active
      tocEl.querySelectorAll('.toc-link').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

// ═══════════════════════════════════════════════════════
// SMOOTH SCROLL TO ID
// ═══════════════════════════════════════════════════════
function smoothScrollTo(id) {
  const el = document.getElementById(id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // Update URL hash without jumping
    history.replaceState(null, '', '#' + id);
  }
}

// Highlight active TOC item on scroll
function updateActiveToc() {
  const headings = Array.from(contentEl.querySelectorAll('h2,h3,h4'));
  let activeId = null;
  const scrollTop = window.scrollY + 100;
  for (let i = headings.length - 1; i >= 0; i--) {
    if (headings[i].offsetTop <= scrollTop) {
      activeId = headings[i].id;
      break;
    }
  }
  tocEl.querySelectorAll('.toc-link').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.target === activeId);
  });
}
window.addEventListener('scroll', updateActiveToc, { passive: true });

// ═══════════════════════════════════════════════════════
// SEARCH — robust implementation
// ═══════════════════════════════════════════════════════
const searchInput = document.getElementById('search-input');
const resultCount = document.getElementById('result-count');

function performSearch(query) {
  // Remove existing marks safely
  contentEl.querySelectorAll('mark.search-mark').forEach(mark => {
    const parent = mark.parentNode;
    if (parent) {
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize();
    }
  });

  const q = query.trim();
  if (!q) {
    resultCount.textContent = '';
    return;
  }
  const qLower = q.toLowerCase();
  let count = 0;
  let firstMark = null;

  // Collect all text nodes in content (avoid script/style)
  function getTextNodes(root) {
    const nodes = [];
    const walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_TEXT,
      { acceptNode(node) {
        const parent = node.parentElement;
        if (!parent) return NodeFilter.FILTER_REJECT;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }}
    );
    let n;
    while (n = walker.nextNode()) nodes.push(n);
    return nodes;
  }

  const textNodes = getTextNodes(contentEl);

  // Process each text node
  textNodes.forEach(node => {
    const text = node.textContent;
    const lower = text.toLowerCase();
    if (!lower.includes(qLower)) return;

    const frag = document.createDocumentFragment();
    let lastIdx = 0;
    let idx = lower.indexOf(qLower, 0);
    while (idx !== -1) {
      if (idx > lastIdx) {
        frag.appendChild(document.createTextNode(text.slice(lastIdx, idx)));
      }
      const mark = document.createElement('mark');
      mark.className = 'search-mark';
      mark.textContent = text.slice(idx, idx + q.length);
      frag.appendChild(mark);
      if (!firstMark) firstMark = mark;
      count++;
      lastIdx = idx + q.length;
      idx = lower.indexOf(qLower, lastIdx);
    }
    if (lastIdx < text.length) {
      frag.appendChild(document.createTextNode(text.slice(lastIdx)));
    }
    node.parentNode.replaceChild(frag, node);
  });

  if (count > 0) {
    resultCount.textContent = `${count} match${count !== 1 ? 'es' : ''}`;
    if (firstMark) {
      setTimeout(() => firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
    }
  } else {
    resultCount.textContent = 'No matches';
  }
}

function clearSearch() {
  searchInput.value = '';
  performSearch('');
}

searchInput.addEventListener('input', () => performSearch(searchInput.value));
searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });

  btn.addEventListener('click', () => {
    document.body.removeAttribute('data-skin');
    if (btn.dataset.s !== 'book') document.body.setAttribute('data-skin', btn.dataset.s);
    document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    try { localStorage.setItem('tyov-manual-skin', btn.dataset.s); } catch(e){}
  });
});
(function(){
  try {
    const s = localStorage.getItem('tyov-manual-skin') || 'book';
    if (s !== 'book') document.body.setAttribute('data-skin', s);
    document.querySelectorAll('.skin-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.s === s);
    });
  } catch(e) {}
})();

  if (location.hash) {

    setTimeout(() => smoothScrollTo(id), 100);

});
