      openModal('Edit Header', `
    <div class="form-row">
      <label class="form-label">Vampire Name</label>
      <input class="form-input" id="ed-vname" value="${esc(parsedData.vampireName)}">
    </div>
    <div class="form-row">
      <label class="form-label" style="margin-top:10px;">Concept / Tagline</label>
      <input class="form-input" id="ed-subtitle" value="${esc(parsedData.subtitle)}">
      <div class="form-hint">The tagline displayed beneath your vampire name.</div>
    </div>
  `, () => {
        parsedData.vampireName = document.getElementById('ed-vname').value.trim();
        parsedData.subtitle = document.getElementById('ed-subtitle').value.trim();
        parsedData.frontmatter.vampire_desc = parsedData.subtitle;
        parsedData.frontmatter.vampire = parsedData.vampireName;
        markUnsaved();
        closeModal();
      });
    }

    // ── Marks ─────────────────────────────────────────
    function editMarks() {
      if (!editMode) return;
      const activeMarks = parsedData.marks.filter(m => m.status === 'active');
      const lostMarks = parsedData.marks.filter(m => m.status === 'lost');

      let bodyHtml = '<div class="edit-section-title">Active Marks</div>';
      if (activeMarks.length === 0) {
        bodyHtml += '<p style="color:var(--ink-faint);font-style:italic;font-size:.9rem;margin-bottom:12px;">No active marks.</p>';
      }
      activeMarks.forEach(m => {
        const i = parsedData.marks.indexOf(m);
        bodyHtml += '<div class="edit-list-item">'
          + '<div class="edit-list-item-text">' + esc(m.desc)
          + ' <span style="color:var(--ink-faint);font-size:.8rem;">(' + esc(m.concealment) + ')</span></div>'
          + '<div class="edit-list-actions">'
          + '<button class="strike-btn" onclick="loseMark(' + i + ')">Lose</button>'
          + '<button class="trash-btn" onclick="deleteMark(' + i + ')">🗑</button>'
          + '</div></div>';
      });

      if (lostMarks.length > 0) {
        bodyHtml += '<hr class="edit-divider"><div class="edit-section-title">Lost Marks</div>';
        lostMarks.forEach(m => {
          const i = parsedData.marks.indexOf(m);
          bodyHtml += '<div class="edit-list-item struck-item">'
            + '<div class="edit-list-item-text">' + esc(m.desc)
            + ' <span style="color:var(--ink-faint);font-size:.8rem;">(' + esc(m.concealment) + ')</span></div>'
            + '<div class="edit-list-actions">'
            + '<button class="strike-btn" onclick="restoreMark(' + i + ')">Restore</button>'
            + '<button class="trash-btn" onclick="deleteMark(' + i + ')">🗑</button>'
            + '</div></div>';
        });
      }

      bodyHtml += '<hr class="edit-divider"><div class="edit-section-title">Add New Mark</div>'
        + '<div class="form-row"><label class="form-label">Description</label>'
        + '<input class="form-input" id="ed-mark-desc" placeholder="e.g. Cold skin that never warms"></div>'
        + '<div class="form-row"><label class="form-label">How is it concealed?</label>'
        + '<input class="form-input" id="ed-mark-conc" placeholder="e.g. hidden under heavy vestments"></div>';

      openModal('Edit Marks', bodyHtml, () => {
        const desc = document.getElementById('ed-mark-desc').value.trim();
        const conc = document.getElementById('ed-mark-conc').value.trim();
        if (desc && conc) {
          parsedData.marks.push({ desc, concealment: conc, status: 'active' });
          markUnsaved();
        }
      });
    }

    function loseMark(i) {
      parsedData.marks[i].status = 'lost';
      markUnsaved();
      editMarks();
    }

    function restoreMark(i) {
      parsedData.marks[i].status = 'active';
      markUnsaved();
      editMarks();
    }

    function deleteMark(i) {
      if (!editMode) return;
      const m = parsedData.marks[i];
      if (!confirm(`Delete the mark "${m.desc || `Mark ${i + 1}`}"?\n\nThis is an admin action — it removes the mark entirely, different from striking it.`)) return;
      parsedData.marks.splice(i, 1);
      markUnsaved();
      setStatus('ok', 'Mark deleted');
      // Re-render the modal in place
      editMarks();
    }

    // ── Skills ────────────────────────────────────────
    function editSkills() {
      if (!editMode) return;
      const skills = [...parsedData.skills]
        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));

      let bodyHtml = '<div class="edit-section-title">Skills</div>';
      if (skills.length === 0) {
        bodyHtml += '<p style="color:var(--ink-faint);font-style:italic;font-size:.9rem;margin-bottom:12px;">No skills yet.</p>';
      }
      skills.forEach(sk => {
        const i = parsedData.skills.indexOf(sk);
        bodyHtml += '<div class="edit-list-item">'
          + '<div class="edit-list-item-text">' + esc(sk.name)
          + (sk.gained_turn ? '<span style="color:var(--ink-faint);font-size:.8rem;"> · gained turn ' + sk.gained_turn + '</span>' : '')
          + '</div>'
          + '<div class="edit-list-actions">'
          + '<select class="form-select" id="sk-status-' + i + '" style="width:130px;font-size:13px;" onchange="updateSkillStatus(' + i + ', this.value)">'
          + '<option value="unchecked" ' + (sk.status === 'unchecked' ? 'selected' : '') + '>☐ Unchecked</option>'
          + '<option value="checked" ' + (sk.status === 'checked' ? 'selected' : '') + '>☑ Checked</option>'
          + '</select>'
          + '<button class="trash-btn" onclick="deleteSkill(' + i + ')">🗑</button>'
          + '</div></div>';
      });

      bodyHtml += '<hr class="edit-divider"><div class="edit-section-title">Add New Skill</div>'
        + '<div class="form-row"><label class="form-label">Skill Name</label>'
        + '<input class="form-input" id="ed-skill-name" placeholder="e.g. Herbalism"></div>';

      openModal('Edit Skills', bodyHtml, () => {
        const name = document.getElementById('ed-skill-name').value.trim();
        if (name) {
          parsedData.skills.push({ name, status: 'unchecked', gained_turn: currentTurn() });
          markUnsaved();
        }
      });
    }

    function updateSkillStatus(i, val) {
      parsedData.skills[i].status = val;
      markUnsaved();
    }

    // ── Resources ─────────────────────────────────────
    function editResources() {
      if (!editMode) return;
      const activeResources = parsedData.resources.filter(r => r.status === 'active')
        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));
      const lostResources = parsedData.resources.filter(r => r.status === 'lost')
        .sort((a, b) => (b.lost_turn || 0) - (a.lost_turn || 0));

      let bodyHtml = '<div class="edit-section-title">Active Resources</div>';
      if (activeResources.length === 0) {
        bodyHtml += '<p style="color:var(--ink-faint);font-style:italic;font-size:.9rem;margin-bottom:12px;">No active resources.</p>';
      }
      activeResources.forEach(r => {
        const i = parsedData.resources.indexOf(r);
        const icon = r.type === 'diary' ? '📖' : r.type === 'portable' ? '📦' : '📍';
        bodyHtml += '<div class="edit-list-item">'
          + '<div class="edit-list-item-text">'
          + '<strong>' + icon + ' ' + esc(r.name) + '</strong>'
          + (r.gained_turn ? '<span style="color:var(--ink-faint);font-size:.8rem;"> · gained turn ' + r.gained_turn + '</span>' : '')
          + (r.description ? '<br><span style="font-size:.85rem;color:var(--ink-faint);">' + esc(r.description) + '</span>' : '')
          + '</div>'
          + '<div class="edit-list-actions">'
          + '<button class="strike-btn" onclick="loseResource(' + i + ')">Lose</button>'
          + '<button class="trash-btn" onclick="deleteResource(' + i + ')">🗑</button>'
          + '</div></div>';
      });

      if (lostResources.length > 0) {
        bodyHtml += '<hr class="edit-divider"><div class="edit-section-title">Lost Resources</div>';
        lostResources.forEach(r => {
          const i = parsedData.resources.indexOf(r);
          const icon = r.type === 'diary' ? '📖' : r.type === 'portable' ? '📦' : '📍';
          bodyHtml += '<div class="edit-list-item struck-item">'
            + '<div class="edit-list-item-text struck-text">'
            + icon + ' ' + esc(r.name)
            + (r.lost_turn ? '<span style="color:var(--ink-faint);font-size:.8rem;"> · lost turn ' + r.lost_turn + '</span>' : '')
            + '</div>'
            + '<div class="edit-list-actions">'
            + '<button class="strike-btn" onclick="restoreResource(' + i + ')">Restore</button>'
            + '<button class="trash-btn" onclick="deleteResource(' + i + ')">🗑</button>'
            + '</div></div>';
        });
      }

      bodyHtml += '<hr class="edit-divider"><div class="edit-section-title">Add Resource</div>'
        + '<div class="form-row"><label class="form-label">Type</label>'
        + '<select class="form-select" id="ed-res-type">'
        + '<option value="portable">📦 Portable</option>'
        + '<option value="stationary">📍 Stationary</option>'
        + '<option value="diary">📖 Diary</option>'
        + '</select></div>'
        + '<div class="form-row"><label class="form-label">Name</label>'
        + '<input class="form-input" id="ed-res-name" placeholder="e.g. The Red Diary"></div>'
        + '<div class="form-row"><label class="form-label">Description</label>'
        + '<input class="form-input" id="ed-res-desc" placeholder="Brief description…"></div>';

      openModal('Edit Resources', bodyHtml, () => {
        const name = document.getElementById('ed-res-name').value.trim();
        const desc = document.getElementById('ed-res-desc').value.trim();
        const type = document.getElementById('ed-res-type').value;
        if (name) {
          if (type === 'diary') {
            const activeDiary = parsedData.resources.find(r => r.type === 'diary' && r.status === 'active');
            if (activeDiary) {
              alert('You already have an active diary — "' + activeDiary.name + '". Lose it before creating a new one.');
              return;
            }
          }
          parsedData.resources.push({ name, description: desc, type, status: 'active', gained_turn: currentTurn(), lost_turn: null });
          if (type === 'diary' && !parsedData.diaryMemories[name]) {
            parsedData.diaryMemories[name] = [];
          }
          markUnsaved();
        }
      });
    }

    function loseResource(i) {
      if (!editMode) return;
      const r = parsedData.resources[i];
      if (r.type === 'diary') {
        const mems = parsedData.diaryMemories[r.name] || [];
        if (mems.length > 0) {
          if (!confirm('Lose "' + r.name + '"?\n\nAll ' + mems.length + ' memories stored in this diary will be moved to Lost Memories.')) return;
          const turn = currentTurn();
          const now = new Date().toISOString();
          if (!parsedData.lostMemories) parsedData.lostMemories = [];
          mems.forEach(m => {
            parsedData.lostMemories.push({
              n: m.n, theme: m.theme,
              experiences: [...m.experiences],
              lost_at: now, lost_on_turn: turn
            });
          });
          parsedData.diaryMemories[r.name] = [];
        } else {
          if (!confirm('Lose "' + r.name + '"?')) return;
        }
      } else {
        if (!confirm('Lose "' + r.name + '"?')) return;
      }
      r.status = 'lost';
      r.lost_turn = currentTurn();
      markUnsaved();
      renderChronicle(parsedData);
      editResources();
    }

    function restoreResource(i) {
      parsedData.resources[i].status = 'active';
      parsedData.resources[i].lost_turn = null;
      markUnsaved();
      editResources();
    }

    // ── Diary Memories ─────────────────────────────────────

    function editDiaryMemories(diaryName) {
      if (!editMode) return;
      if (!parsedData.diaryMemories) parsedData.diaryMemories = {};
      const mems = parsedData.diaryMemories[diaryName] || [];

      let bodyHtml = '<div class="edit-section-title">' + esc(diaryName) + ' (' + mems.length + '/4 memories)</div>';

      if (mems.length === 0) {
        bodyHtml += '<p style="color:var(--ink-faint);font-style:italic;font-size:.88rem;">No memories stored in this diary yet.</p>';
      }

      mems.forEach((m, i) => {
        bodyHtml += '<div class="edit-list-item" style="flex-direction:column;align-items:stretch;">'
          + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
          + '<strong>Memory ' + m.n + ' — ' + esc(m.theme) + '</strong>'
          + '<button class="trash-btn" onclick="removeDiaryMemory(\'' + diaryName.replace(/'/g, "\\'") + '\',' + i + ')" title="Remove from diary to Lost Memories">🗑</button>'
          + '</div>';
        m.experiences.forEach((exp, j) => {
          bodyHtml += '<div style="font-size:.88rem;padding-left:12px;margin-bottom:3px;">' + (j + 1) + '. ' + esc(exp) + '</div>';
        });
        bodyHtml += '</div>';
      });

      openModal('Diary — ' + diaryName, bodyHtml, () => { });
    }

    function removeDiaryMemory(diaryName, idx) {
      if (!editMode) return;
      const mems = parsedData.diaryMemories[diaryName] || [];
      const m = mems[idx];
      if (!m) return;
      if (!confirm('Remove Memory ' + m.n + ' "' + m.theme + '" from ' + diaryName + '?\n\nIt will be moved to Lost Memories.')) return;

      const turn = parsedData.journal.length > 0
        ? Math.max(...parsedData.journal.map(j => j.turn))
        : null;

      if (!parsedData.lostMemories) parsedData.lostMemories = [];
      parsedData.lostMemories.push({
        n: m.n,
        theme: m.theme,
        experiences: [...m.experiences],
        lost_at: new Date().toISOString(),
        lost_on_turn: turn
      });

      mems.splice(idx, 1);
      parsedData.diaryMemories[diaryName] = mems;
      markUnsaved();
      renderChronicle(parsedData);
      editDiaryMemories(diaryName);
    }

    // ── Characters ────────────────────────────────────
    function editCharacters(type) {
      if (!editMode) return;
      const living = parsedData.characters.filter(c => c.type === type && !c.dead)
        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));

      const label = type === 'mortal' ? 'Mortal' : 'Immortal';

      let bodyHtml = '<div class="edit-section-title">Living ' + label + ' Characters</div>';
      if (living.length === 0) {
        bodyHtml += '<p style="color:var(--ink-faint);font-style:italic;font-size:.9rem;margin-bottom:12px;">None yet.</p>';
      }
      living.forEach(c => {
        const i = parsedData.characters.indexOf(c);
        bodyHtml += '<div class="edit-list-item">'
          + '<div class="edit-list-item-text">'
          + '<strong>' + esc(c.name) + '</strong>'
          + (c.gained_turn ? ' <span style="font-size:.8rem;color:var(--ink-faint);"> · met turn ' + c.gained_turn + '</span>' : '')
          + (c.desc ? '<br><span style="font-size:.85rem;color:var(--ink-faint);">' + esc(c.desc) + '</span>' : '')
          + '</div>'
          + '<div class="edit-list-actions">'
          + '<button class="strike-btn" onclick="killCharacter(' + i + ')">Kill</button>'
          + '<button class="trash-btn" onclick="deleteCharacter(' + i + ')">🗑</button>'
          + '</div></div>';
      });

      bodyHtml += '<hr class="edit-divider"><div class="edit-section-title">Add ' + label + ' Character</div>'
        + '<div class="form-row"><label class="form-label">Name</label>'
        + '<input class="form-input" id="ed-char-name" placeholder="e.g. Sister Agatha"></div>'
        + '<div class="form-row"><label class="form-label">Description</label>'
        + '<textarea class="form-textarea" id="ed-char-desc" style="min-height:60px;" placeholder="Brief description…"></textarea></div>';

      openModal('Edit ' + label + ' Characters', bodyHtml, () => {
        const name = document.getElementById('ed-char-name').value.trim();
        const desc = document.getElementById('ed-char-desc').value.trim();
        if (name) {
          parsedData.characters.push({
            name, desc, type, dead: false,
            death_reason: '', death_epitaph: '',
            gained_turn: currentTurn(), lost_turn: null
          });
          markUnsaved();
        }
      });
    }

    function killCharacter(i) {
      const c = parsedData.characters[i];
      const type = c.type;
      if (!confirm('Kill ' + c.name + '?')) return;
      const bodyHtml = '<div class="form-row"><label class="form-label">Death Reason (required)</label>'
        + '<input class="form-input" id="ed-death-reason" placeholder="e.g. Slain by Lydia Thorne"></div>'
        + '<div class="form-row"><label class="form-label">Epitaph (optional)</label>'
        + '<input class="form-input" id="ed-death-epitaph" placeholder="Short epitaph…"></div>';

      openModal('Record Death — ' + esc(c.name), bodyHtml, () => {
        const reasonVal = document.getElementById('ed-death-reason').value.trim();
        const epitaphVal = document.getElementById('ed-death-epitaph').value.trim();
        if (!reasonVal) { alert('Please provide a death reason.'); return; }
        c.dead = true;
        c.lost_turn = currentTurn();
        c.death_reason = reasonVal;
        c.death_epitaph = epitaphVal;
        markUnsaved();
        setTimeout(() => editCharacters(type), 0);
      });
    }

    function restoreCharacter(i) {
      const c = parsedData.characters[i];
      c.dead = false;
      c.lost_turn = null;
      c.death_reason = '';
      c.death_epitaph = '';
      markUnsaved();
      editObituary();
    }

    function deleteCharacter(i) {
      const c = parsedData.characters[i];
      if (!confirm('Delete ' + c.name + ' entirely?')) return;
      const wasDead = c.dead;
      const type = c.type;
      parsedData.characters.splice(i, 1);
      markUnsaved();
      if (wasDead) editObituary();
      else editCharacters(type);
    }

    // ── Memories ──────────────────────────────────────
    function editMemories() {
      if (!editMode) return;
      let bodyHtml = '<div class="edit-section-title">Active Memories (' + parsedData.memories.length + '/5)</div>';

      parsedData.memories.forEach((mem, i) => {
        bodyHtml += '<div class="edit-list-item" style="flex-direction:column;align-items:stretch;">'
          + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
          + '<strong>Memory ' + mem.n + ' — ' + esc(mem.theme) + '</strong>'
          + '<button class="trash-btn" onclick="deleteMemory(' + i + ')" title="Delete memory entirely">🗑</button>'
          + '</div>';
        mem.experiences.forEach((exp, j) => {
          bodyHtml += '<div style="font-size:.88rem;padding-left:12px;margin-bottom:3px;">'
            + (j + 1) + '. ' + esc(exp) + '</div>';
        });
        if (mem.experiences.length === 0) {
          bodyHtml += '<div style="font-size:.85rem;color:var(--ink-faint);padding-left:12px;font-style:italic;">No experiences yet.</div>';
        }
        const activeDiary = parsedData.resources.find(r => r.type === 'diary' && r.status === 'active');
        if (activeDiary && mem.theme && mem.experiences.length > 0) {
          const diaryFull = (parsedData.diaryMemories[activeDiary.name] || []).length >= 4;
          bodyHtml += '<div style="margin-top:8px;">';
          if (diaryFull) {
            bodyHtml += '<span style="font-size:.82rem;color:var(--ink-faint);font-style:italic;">Diary full (4/4).</span>';
          } else {
            bodyHtml += '<button class="strike-btn" onclick="moveMemoryToDiary(' + i + ')">📖 Move to ' + esc(activeDiary.name) + '</button>';
          }
          bodyHtml += '</div>';
        }
        bodyHtml += '</div>';
      });

      if (parsedData.memories.length < 5) {
        bodyHtml += '<hr class="edit-divider">'
          + '<div class="edit-section-title">Add New Memory</div>'
          + '<div class="form-row">'
          + '<label class="form-label">Theme</label>'
          + '<input class="form-input" id="ed-mem-theme" placeholder="e.g. The Scholarly Curate">'
          + '</div>'
          + '<div class="form-row">'
          + '<label class="form-label">First Experience</label>'
          + '<textarea class="form-textarea" id="ed-mem-exp" style="min-height:60px;" placeholder="First memory experience…"></textarea>'
          + '</div>';
      } else {
        bodyHtml += '<p style="margin-top:12px;color:var(--blood);font-size:.85rem;font-style:italic;">Memory cap reached (5/5).</p>';
      }

      openModal('Edit Memories', bodyHtml, () => {
        const theme = document.getElementById('ed-mem-theme') ? document.getElementById('ed-mem-theme').value.trim() : '';
        const expText = document.getElementById('ed-mem-exp') ? document.getElementById('ed-mem-exp').value.trim() : '';
        if (theme && expText) {
          const newN = parsedData.memories.length > 0 ? Math.max(...parsedData.memories.map(m => m.n)) + 1 : 1;
          parsedData.memories.push({ n: newN, theme, experiences: [expText], description: '' });
          markUnsaved();
        }
      });
    }

    // ── Diary ─────────────────────────────────────────
    function moveMemoryToDiary(memIdx) {
      if (!editMode) return;
      const mem = parsedData.memories[memIdx];
      if (!mem || !mem.theme) return;
      const activeDiary = parsedData.resources.find(r => r.type === 'diary' && r.status === 'active');
      if (!activeDiary) { alert('No active diary. Create a diary resource first.'); return; }
      const diaryMems = parsedData.diaryMemories[activeDiary.name] || [];
      if (diaryMems.length >= 4) { alert(activeDiary.name + ' is full (4/4 memories).'); return; }
      if (!confirm('Move Memory ' + mem.n + ' "' + mem.theme + '" into ' + activeDiary.name + '?\n\nThe memory slot will become empty.')) return;
      diaryMems.push({ n: mem.n, theme: mem.theme, experiences: [...mem.experiences] });
      parsedData.diaryMemories[activeDiary.name] = diaryMems;
      parsedData.memories[memIdx] = { n: mem.n, theme: '', experiences: [], description: '' };
      markUnsaved();
      closeModal();
      renderChronicle(parsedData);
    }


    function editDiary() {
      if (!editMode) return;
      let bodyHtml = `<div class="edit-section-title">Diary Memories (max 4)</div>`;
      if (parsedData.diary.memories.length === 0) {
        bodyHtml += `<p style="color:var(--ink-faint);font-style:italic;font-size:.9rem;margin-bottom:12px;">No diary memories yet.</p>`;
      }
      parsedData.diary.memories.forEach((mem, i) => {
        bodyHtml += `<div class="edit-list-item">
      <div class="edit-list-item-text"><strong>${esc(mem.theme)}</strong> — ${mem.experiences.map(e => esc(e.text)).join('; ')}</div>
      <div class="edit-list-actions">
        <button class="strike-btn struck" onclick="removeDiaryMem(${i})">Remove</button>
        <button class="trash-btn" onclick="deleteDiaryMem(${i})" title="Delete diary entry entirely from schema">🗑</button>
      </div>
    </div>`;
      });

      const activeMemsNotInDiary = parsedData.memories.filter(m => !m.status === 'active' && !m.inDiary);
      if (parsedData.diary.memories.length < 4 && activeMemsNotInDiary.length > 0) {
        bodyHtml += `<hr class="edit-divider">
      <div class="edit-section-title">Move Active Memory to Diary</div>
      <div class="form-row">
        <label class="form-label">Memory</label>
        <select class="form-select" id="ed-diary-mem">
          ${activeMemsNotInDiary.map((m, i) => `<option value="${m.n}">Memory ${m.n} — ${esc(m.theme)}</option>`).join('')}
        </select>
      </div>`;
      } else if (parsedData.diary.memories.length >= 4) {
        bodyHtml += `<p style="margin-top:12px;color:var(--blood);font-size:.85rem;font-style:italic;">Diary is full (4/4 memories).</p>`;
      }

      openModal('Edit Diary', bodyHtml, () => {
        const sel = document.getElementById('ed-diary-mem');
        if (sel) {
          const memN = parseInt(sel.value);
          const mem = parsedData.memories.find(m => m.n === memN);
          if (mem) {
            // Move to diary: mark inDiary on active, add copy to diary section
            mem.inDiary = true;
            const newDiaryN = parsedData.diary.memories.length + 1;
            parsedData.diary.memories.push({ n: newDiaryN, theme: mem.theme, experiences: mem.experiences.filter(e => !e.struck).map(e => ({ text: e.text })) });
            parsedData.frontmatter.diary_exists = 'true';
            parsedData.frontmatter.diary_name = parsedData.frontmatter.diary_name || 'Diary';
            parsedData.diary.exists = true;
            markUnsaved();
          }
        }
      }); // modalConfirm() handles re-render after Update is clicked
    }

    function removeDiaryMem(i) {
      const removed = parsedData.diary.memories[i];
      // Unmark inDiary on the active memory
      const activeMem = parsedData.memories.find(m => m.theme === removed.theme);
      if (activeMem) activeMem.inDiary = false;
      parsedData.diary.memories.splice(i, 1);
      // Re-number
      parsedData.diary.memories.forEach((m, idx) => m.n = idx + 1);
      if (parsedData.diary.memories.length === 0) {
        parsedData.diary.exists = false;
        parsedData.frontmatter.diary_exists = 'false';
      }
      markUnsaved(); editDiary();
    }

    // ── Obituary ─────────────────────────────────────────

    function editObituary() {
      if (!editMode) return;
      const dead = parsedData.characters.filter(c => c.dead)
        .sort((a, b) => (b.lost_turn || 0) - (a.lost_turn || 0));

      let bodyHtml = '<div class="edit-section-title">Obituary</div>';
      if (dead.length === 0) {
        bodyHtml += '<p style="color:var(--ink-faint);font-style:italic;font-size:.9rem;">No dead characters.</p>';
      }
      dead.forEach(c => {
        const i = parsedData.characters.indexOf(c);
        bodyHtml += '<div class="edit-list-item struck-item">'
          + '<div class="edit-list-item-text">'
          + '<strong>' + esc(c.name) + '</strong>'
          + ' <span style="font-size:.8rem;color:var(--ink-faint);">' + c.type
          + (c.lost_turn ? ' · died turn ' + c.lost_turn : '') + '</span>'
          + (c.desc ? '<br><span style="font-size:.85rem;color:var(--ink-faint);">' + esc(c.desc) + '</span>' : '')
          + (c.death_reason ? '<br><span style="font-size:.82rem;color:var(--ink-faint);font-style:italic;">' + esc(c.death_reason) + '</span>' : '')
          + (c.death_epitaph ? '<br><span style="font-size:.82rem;color:var(--blood);font-style:italic;">' + esc(c.death_epitaph) + '</span>' : '')
          + '</div>'
          + '<div class="edit-list-actions">'
          + '<button class="strike-btn" onclick="restoreCharacter(' + i + ')">Restore</button>'
          + '<button class="trash-btn" onclick="deleteCharacter(' + i + ')">🗑</button>'
          + '</div></div>';
      });

      openModal('Obituary', bodyHtml, () => { });
    }

    // ── Admin Delete Actions ────────────────────
    // These are separate from game actions (striking, killing, forgetting).
    // Any admin with edit permission can delete items entirely from the JSON.

    function deleteSkill(i) {
      if (!editMode) return;
      const sk = parsedData.skills[i];
      if (!confirm(`Delete the skill "${sk.name || ('Skill ' + (i + 1))}"?

This is an admin action — it removes the skill entirely from the sheet, not just striking it.`)) return;
      parsedData.skills.splice(i, 1);
      markUnsaved();
      setStatus('ok', 'Skill deleted');
      editSkills();
    }

    function deleteResource(i) {
      if (!editMode) return;
      const r = parsedData.resources[i];
      if (!confirm(`Delete the resource "${r.name || ('Resource ' + (i + 1))}"?

This is an admin action — it removes the resource entirely from the sheet.`)) return;
      parsedData.resources.splice(i, 1);
      markUnsaved();
      setStatus('ok', 'Resource deleted');
      editResources();
    }

    function deleteMemory(i) {
      if (!editMode) return;
      const mem = parsedData.memories[i];
      if (!confirm('Delete Memory ' + mem.n + ' — "' + (mem.theme || 'Memory ' + mem.n) + '"?\n\nThis removes it entirely.')) return;
      parsedData.memories.splice(i, 1);
      markUnsaved();
      setStatus('ok', 'Memory deleted');
      editMemories();
    }

    function deleteDiaryMem(i) {
      if (!editMode) return;
      const mem = parsedData.diary.memories[i];
      if (!confirm(`Delete diary entry "${mem.theme || ('Diary ' + (i + 1))}" entirely?

This is an admin action — removes it from the diary permanently.`)) return;
      const removed = parsedData.diary.memories[i];
      // Unmark inDiary on the active memory
      const activeMem = parsedData.memories.find(m => m.theme === removed.theme);
      if (activeMem) activeMem.inDiary = false;
      parsedData.diary.memories.splice(i, 1);
      parsedData.diary.memories.forEach((m, idx) => { m.n = idx + 1; });
      if (parsedData.diary.memories.length === 0) {
        parsedData.diary.exists = false;
        parsedData.frontmatter.diary_exists = 'false';
        parsedData.frontmatter.diary_name = 'Diary';
      }
      markUnsaved();
      setStatus('ok', 'Diary entry deleted');
      editDiary();
    }

    function deleteJournalEntry(i) {
      if (!editMode) return;
      const je = parsedData.journal[i];
      if (!confirm(`Delete journal entry (Turn ${je.turn}, Prompt ${je.prompt})?

This is an admin action — it removes the entire entry from the sheet.`)) return;
      parsedData.journal.splice(i, 1);
      // Re-number turns
      parsedData.journal.forEach((j, idx) => { j.turn = idx + 1; });
      markUnsaved();
      setStatus('ok', 'Journal entry deleted');
      editJournal();
    }

    function getAnyAwaitingEntry() {
      for (const je of parsedData.journal) {
        if (!je.resolved) return je;
      }
      return null;
    }

    // Returns true if there is at least one active memory slot
    // that can accept an additional experience (i.e. theme exists
    // and experiences.length < 3). Used to gate journal add/resolve UI.
    function hasUnexperiencedMemory() {
      if (!parsedData || !parsedData.memories) return false;
      for (const m of parsedData.memories) {
        if (m && m.theme && Array.isArray(m.experiences) && m.experiences.length < 3) return true;
      }
      return false;
    }

    // ── Journal array-level editing ─────────────────────
    function editJournal() {
      if (!editMode) return;

      let bodyHtml = '';

      // List existing journal entries (for deletion)
      if (parsedData.journal.length > 0) {
        bodyHtml += `<div class="edit-section-title">Journal Entries</div>`;
        parsedData.journal.forEach((je, idx) => {
          bodyHtml += `<div class="edit-list-item">
    <div class="edit-list-item-text"><strong>Turn ${je.turn} — Prompt ${je.prompt}, Entry ${je.entry}</strong><br><span style="color:var(--ink-dim);font-size:.85rem">Awaiting: ${!je.resolved ? 'Yes' : 'No'}${je.prose ? ' — Has prose' : ''}</span></div>
    <div class="edit-list-actions">
      <button class="trash-btn" onclick="deleteJournalEntry(${idx})" title="Delete journal entry entirely">🗑</button>
    </div>
  </div>`;
        });
        bodyHtml += `<hr class="edit-divider">`;
      }

      // Add new prompt entry
      const hasReady = hasUnexperiencedMemory();
      bodyHtml += `<div class="edit-section-title">Add New Journal Entry</div>
<div class="form-row">
  <label class="form-label">Prompt Number (1–80)</label>
  <input class="form-input" id="ed-j-prompt" type="number" min="1" max="80" placeholder="e.g. 5">
</div>
<div class="form-row">
  <label class="form-label">Entry Number</label>
  <input class="form-input" id="ed-j-entry" type="number" min="1" max="3" value="1">
  <div class="form-hint">Prompts 1–71 allow up to 3 entries; 72–80 allow only 1.</div>
</div>`;

      // If there's an awaiting entry and we don't have a ready memory, show memory add
      const awaitingEntry = getAnyAwaitingEntry();
      if (awaitingEntry && !hasReady) {
        bodyHtml += `<div style="background:var(--blood);border-left:3px solid var(--blood-bright);padding:8px 12px;margin-top:14px;font-size:.88rem;color:var(--blood-bright);font-style:italic;">Resolve requires an unrecorded memory. Add one below using the per-entry edit (✎ button), then click Update.</div>`;
      }

      openModal('Edit Journal', bodyHtml, () => {
        // Add new entry — no promptText stored
        const promptNum = parseInt(document.getElementById('ed-j-prompt').value || '0');
        const entryNum = parseInt(document.getElementById('ed-j-entry').value || '1');
        if (promptNum >= 1) {
          const maxTurn = parsedData.journal.length > 0 ? Math.max(...parsedData.journal.map(j => j.turn)) : 0;
          parsedData.journal.push({
            turn: maxTurn + 1,
            prompt: promptNum,
            entry: entryNum,
            prose: '',
            changes: '',
            awaiting: true
          });
          parsedData.frontmatter.current_prompt = promptNum;
          markUnsaved();
        }
      });
    }

    function previewMemoryState(memIdxStr) {
      const i = parseInt(memIdxStr);
      const mem = parsedData.memories[i];
      if (!mem) return;
      const preview = document.getElementById('mem-preview');
      const loseCheck = document.getElementById('ed-je-lose-check');
      const newThemeRow = document.getElementById('ed-je-new-theme-row');
      if (!preview) return;

      if (mem.experiences.length > 0) {
        preview.textContent = mem.experiences.map((e, j) => (j + 1) + '. ' + e).join(' | ');
      } else {
        preview.textContent = 'No experiences yet.';
      }

      // Auto-check and show lose fields if memory is already full
      if (mem.experiences.length === 3) {
        preview.textContent += ' — FULL, will be lost.';
        preview.style.color = 'var(--blood)';
        if (loseCheck) loseCheck.checked = true;
        if (newThemeRow) newThemeRow.style.display = '';
      } else if (mem.experiences.length === 0) {
        // If the selected memory has no experiences yet, require a new theme
        // (this uses the same UI as when replacing a full memory).
        preview.style.color = 'var(--ink-faint)';
        if (loseCheck) loseCheck.checked = false;
        if (newThemeRow) newThemeRow.style.display = '';
      } else {
        preview.style.color = 'var(--ink-faint)';
        // Don't uncheck — player may have manually checked it
        if (loseCheck && !loseCheck.checked && newThemeRow) {
          newThemeRow.style.display = 'none';
        }
      }
    }

    function toggleLoseMemory() {
      const checked = document.getElementById('ed-je-lose-check').checked;
      document.getElementById('ed-je-new-theme-row').style.display = checked ? '' : 'none';
    }

    // ── Per-entry journal editing ───────────────────────
    function editjournalentry(idx) {
      if (!editMode) return;
      if (idx < 0 || idx >= parsedData.journal.length) return;
      const je = parsedData.journal[idx];

      let bodyHtml = '<div class="edit-section-title">Turn ' + je.turn + ' — Prompt ' + je.prompt + ', Entry ' + je.entry + '</div>'
        + '<div style="background:var(--tag-bg);border-left:3px solid var(--blood);padding:8px 12px;margin-bottom:16px;font-size:.88rem;color:var(--ink-dim);">'
        + esc(getPromptText(je.prompt, je.entry))
        + '</div>'
        + '<div class="form-row">'
        + '<label class="form-label">Journal Prose</label>'
        + '<textarea class="form-textarea" id="ed-je-prose" style="min-height:120px;">' + esc(je.prose) + '</textarea>'
        + '<div class="form-hint">Your character\'s experience with this prompt.</div>'
        + '</div>'
        + '<div class="form-row">'
        + '<label class="form-label">Changes (mechanical summary)</label>'
        + '<input class="form-input" id="ed-je-changes" placeholder="e.g. Killed Lydia Thorne. Gained skill Bloodthirsty." value="' + esc(je.changes) + '">'
        + '<div class="form-hint">Describe what changed: characters killed, skills gained/lost, resources changed, memories added.</div>'
        + '</div>';

      if (!je.resolved) {
        bodyHtml += '<hr class="edit-divider">'
          + '<div class="edit-section-title" style="color:var(--blood);">Record Memory Experience (required to resolve)</div>';

        if (parsedData.memories.length === 0) {
          bodyHtml += '<p style="color:var(--blood);font-size:.88rem;font-style:italic;">No active memories. Add a memory first via the Memories section.</p>';
        } else {
          bodyHtml += '<div class="form-row">'
            + '<label class="form-label">Choose Memory</label>'
            + '<select class="form-select" id="ed-je-exp-mem" onchange="previewMemoryState(this.value)">'
            + parsedData.memories.map((m, i) =>
              '<option value="' + i + '">'
              + 'Memory ' + m.n + ' — ' + esc(m.theme)
              + ' (' + m.experiences.length + '/3 experiences)'
              + '</option>'
            ).join('')
            + '</select>'
            + '</div>'
            + '<div id="mem-preview" style="font-size:.82rem;color:var(--ink-faint);padding:6px 0 10px 2px;font-style:italic;"></div>'
            + '<div class="form-row">'
            + '<label class="form-label">New Experience</label>'
            + '<textarea class="form-textarea" id="ed-je-exp-text" style="min-height:80px;" placeholder="A few sentences summarising this memory experience…"></textarea>'
            + '</div>'
            + '<div id="new-theme-wrap">'
            + '<div class="form-row" style="margin-bottom:8px;">'
            + '<label style="display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;">'
            + '<input type="checkbox" id="ed-je-lose-check" onchange="toggleLoseMemory()">'
            + ' Lose this memory (move to Lost Memories and start a new one)'
            + '</label>'
            + '</div>'
            + '<div id="ed-je-new-theme-row" style="display:none;">'
            + '<div class="form-row">'
            + '<label class="form-label" style="color:var(--blood);">New Memory Theme (required)</label>'
            + '<input class="form-input" id="ed-je-new-theme" placeholder="Theme for the new memory that takes its place…">'
            + '</div>'
            + '</div>'
            + '</div>'
        }
      }

      const isAwaiting = !je.resolved === true;
      const resolveDisabled = !isAwaiting || parsedData.memories.length === 0;

      const footerHtml = '<button class="modal-btn" onclick="closeModal()">Cancel</button>'
        + (!isAwaiting ? '<button class="modal-btn" onclick="unresolveJournalEntry(' + idx + ')">↩ Unresolve</button>' : '')
        + '<button class="modal-btn" onclick="saveJournalEntryAsDraft(' + idx + ')">💾 Save as Draft</button>'
        + '<button class="modal-btn primary"'
        + ' style="background:var(--blood);border-color:var(--blood);' + (resolveDisabled ? 'opacity:.4;cursor:not-allowed;' : '') + '"'
        + (resolveDisabled ? ' disabled' : ' onclick="resolveJournalEntry(' + idx + ')"')
        + '>✓ Resolve This Entry</button>';

      openModal('Edit Journal Entry', bodyHtml, () => {
        const proseEl = document.getElementById('ed-je-prose');
        const changesEl = document.getElementById('ed-je-changes');
        if (proseEl) je.prose = proseEl.value.trim();
        if (changesEl) je.changes = changesEl.value.trim();
        markUnsaved();
      }, footerHtml);

      setTimeout(() => {
        const sel = document.getElementById('ed-je-exp-mem');
        if (sel) previewMemoryState(sel.value);
      }, 0);
    }

    function saveJournalEntryAsDraft(idx) {
      if (idx < 0 || idx >= parsedData.journal.length) return;
      const je = parsedData.journal[idx];
      const proseEl = document.getElementById('ed-je-prose');
      const changesEl = document.getElementById('ed-je-changes');
      if (proseEl) je.prose = proseEl.value.trim();
      if (changesEl) je.changes = changesEl.value.trim();
      je.resolved = false;
      markUnsaved();
      renderChronicle(parsedData);
      closeModal();
      setStatus('ok', 'Entry saved as draft — awaiting resolution.');
    }

    function resolveJournalEntry(idx) {
      if (idx < 0 || idx >= parsedData.journal.length) return;
      const je = parsedData.journal[idx];

      // Read prose + changes from DOM
      const proseEl = document.getElementById('ed-je-prose');
      const changesEl = document.getElementById('ed-je-changes');
      if (proseEl) je.prose = proseEl.value.trim();
      if (changesEl) je.changes = changesEl.value.trim();

      if (!je.prose) {
        alert('Cannot resolve: prose must be written first.');
        return;
      }

      // Read memory experience from DOM
      const memSelEl = document.getElementById('ed-je-exp-mem');
      const expTextEl = document.getElementById('ed-je-exp-text');
      const newThemeEl = document.getElementById('ed-je-new-theme');

      if (!memSelEl || !expTextEl) {
        alert('Cannot resolve: no active memories available. Add a memory first.');
        return;
      }

      const memIdx = parseInt(memSelEl.value);
      const expText = expTextEl.value.trim();

      if (isNaN(memIdx) || memIdx < 0 || memIdx >= parsedData.memories.length) {
        alert('Cannot resolve: please select a valid memory.');
        return;
      }
      if (!expText) {
        alert('Cannot resolve: please write a memory experience.');
        return;
      }

      const mem = parsedData.memories[memIdx];

      // If the selected memory slot exists but has no experiences yet,
      // require a new theme for the memory and create it (same flow as
      // replacing a full memory, but without the confirmation).
      if (Array.isArray(mem.experiences) && mem.experiences.length === 0) {
        const newTheme = newThemeEl ? newThemeEl.value.trim() : '';
        if (!newTheme) {
          alert('Please provide a theme for the new memory that will take its place.');
          return;
        }
        parsedData.memories[memIdx] = {
          n: mem.n,
          theme: newTheme,
          experiences: [expText],
          description: ''
        };
      } else {
        const loseCheck = document.getElementById('ed-je-lose-check');
        const playerChoseLose = loseCheck && loseCheck.checked;
        const shouldLose = playerChoseLose || mem.experiences.length === 3;

        if (shouldLose) {
          const newTheme = newThemeEl ? newThemeEl.value.trim() : '';
          if (!newTheme) {
            alert('Please provide a theme for the new memory that will take its place.');
            return;
          }

          if (!confirm(
            'Memory ' + mem.n + ' "' + mem.theme + '" will be lost.\n\n'
            + 'It will be moved to Lost Memories and a new memory "'
            + newTheme + '" will take slot ' + mem.n + '.\n\nContinue?'
          )) return;

          if (!parsedData.lostMemories) parsedData.lostMemories = [];
          parsedData.lostMemories.push({
            n: mem.n,
            theme: mem.theme,
            experiences: [...mem.experiences],
            lost_at: new Date().toISOString(),
            lost_on_turn: je.turn
          });

          parsedData.memories[memIdx] = {
            n: mem.n,
            theme: newTheme,
            experiences: [expText],
            description: ''
          };
        } else {
          mem.experiences.push(expText);
        }
      }

      // Mark resolved
      je.resolved = true;
      je.resolved_at = new Date().toISOString();

      markUnsaved();
      closeModal();
      renderChronicle(parsedData);
      setStatus('ok', 'Turn ' + je.turn + ' resolved.');
    }

    function unresolveJournalEntry(idx) {
      if (idx < 0 || idx >= parsedData.journal.length) return;
      const je = parsedData.journal[idx];
      if (!confirm(`Unresolve Turn ${je.turn}? This marks the entry as awaiting resolution again.`)) return;
      je.resolved = false;
      markUnsaved();
      editjournalentry(idx); // re-open refreshed
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // Ported: build_prompt_lookup() — build (prompt, entry) -> text map
    function buildPromptLookup() {
      const lookup = {};
      for (const page of PROMPTS_DATA) {
        const pn = page.prompt_number;
        for (let i = 0; i < page.entries.length; i++) {
          lookup[pn + ',' + (i + 1)] = page.entries[i].text;
        }
      }
      return lookup;
    }

    // Ported: roll_dice()
    function rollDice() {
      const d10 = Math.floor(Math.random() * 10) + 1;
      const d6 = Math.floor(Math.random() * 6) + 1;
      return [d10, d6];
    }

    // Ported: main() — computeNextPrompt
    function computeNextPrompt(vampire) {
      const journal = vampire.journal || [];
      const lookup = buildPromptLookup();

      // Build true entry limit from PROMPTS_DATA (not hardcoded)
      const entryLimitMap = {};
      for (const page of PROMPTS_DATA) {
        entryLimitMap[page.prompt_number] = page.entries.length;
      }

      // Find the most recently resolved prompt to use as base
      const resolved = journal.filter(j => j.resolved === true || !j.resolved === false);

      // Roll dice
      const d10 = Math.floor(Math.random() * 10) + 1;
      const d6 = Math.floor(Math.random() * 6) + 1;
      const offset = d10 - d6;

      // Base prompt: last resolved prompt number, or 0 if none
      const basePrompt = resolved.length > 0
        ? resolved[resolved.length - 1].prompt
        : 0;

      // Starting destination
      let dest = Math.max(1, Math.min(80, basePrompt + offset));

      // Find the next available prompt/entry combination
      for (let pn = dest; pn <= 80; pn++) {
        const limit = entryLimitMap[pn] || 1;
        const used = journal.filter(j => j.prompt === pn).length;
        if (used < limit) {
          const nextEntry = used + 1;
          const key = pn + ',' + nextEntry;
          if (lookup[key]) {
            return {
              turn: journal.length + 1,
              prompt: pn,
              entry: nextEntry,
              text: lookup[key],
              dice: { d10, d6, offset }
            };
          }
        }
      }

      return { error: 'all_prompts_exhausted' };
    }

    function displayPromptResult(result) {
      const section = document.getElementById('prompt-section');
      if (!section) return;

      if (result.error === 'all_prompts_exhausted') {
        section.innerHTML =
          '<div class="prompt-card prompt-gameover">' +
          '<div class="prompt-label">🏛️ All Prompts Exhausted</div>' +
          '<div class="prompt-text" style="font-size:16px;">The vampire has lived a full thousand years.</div>' +
          '</div>';
        setStatus('ok', 'All prompts exhausted');
        return;
      }

      const diceStr = result.dice
        ? '<div class="prompt-dice">Roll: d10=' + result.dice.d10 + ', d6=' + result.dice.d6 + ' → offset ' + result.dice.offset + '</div>'
        : '';

      section.innerHTML =
        '<div class="prompt-card prompt-success">' +
        '<div class="prompt-label">🎲 Next Prompt</div>' +
        diceStr +
        '<div class="prompt-dice" style="color:white;font-size:13px;margin-bottom:4px;">Turn ' + result.turn + ' — Prompt ' + result.prompt + ' · Entry ' + result.entry + '</div>' +
        '<div class="prompt-text">' + esc(result.text) + '</div>' +
        '</div>';

      setStatus('ok', 'Prompt ' + result.prompt + ', entry ' + result.entry + ' — Turn ' + result.turn);
    }

    // Main handler: compute + update + display
    async function getAndSetNextPrompt() {
      const token = getVaultKey();
      if (!token) { openKeyPanel(); alert('Please enter your vault key (🔑 icon) first.'); return; }

      const sel = document.getElementById('game-select');
      if (!sel.value) { alert('Select a vampire first.'); return; }

      const promptsReady = await ensurePromptsLoaded();
      if (!promptsReady) { openKeyPanel(); alert('Could not load prompts. Please check your vault key.'); return; }

      setStatus('busy', 'Computing next prompt…');

      try {
        // Use parsedData for prompt computation — it reflects current state
        const vampire = JSON.parse(serializeJson(parsedData));
        const result = computeNextPrompt(vampire);
        const mortals = parsedData.characters.filter(c => c.type === 'mortal');

        // For each living mortal, randomly decide (4 or 5 turns) whether to
        // show the grave marker. This uses the upcoming turn number.
        if (parsedData && Array.isArray(mortals) && !result.error) {
          mortals.forEach(m => { delete m._graveIcon; });
          mortals.forEach(m => {
            if (!m.dead) {
              const gt = Number(m.gained_turn) || 0;
              const threshold = Math.floor(Math.random() * 2) + 4; // 4 or 5
              if (result.turn - gt >= threshold) m._graveIcon = true;
            }
          });
          // Rerender immediately so the UI reflects any grave prefixes.
          renderChronicle(parsedData);
        }

        if (result.error === 'all_prompts_exhausted') {
          displayPromptResult(result);
          return;
        }

        displayPromptResult(result);

        // Add to parsedData journal and commit to GitHub
        parsedData.journal.push({
          turn: result.turn,
          prompt: result.prompt,
          entry: result.entry,
          prose: '',
          changes: '',
          awaiting: true,
          resolved_at: null
        });
        parsedData.frontmatter.current_prompt = String(result.prompt);

        // Save to GitHub
        const filename = sel.value;
        const fileUrl = GITHUB_API + '/' + encodeURIComponent(filename);

        // Get current SHA
        const headResp = await fetch(fileUrl, { headers: { Authorization: 'token ' + token } });
        if (!headResp.ok) throw new Error('API error: ' + headResp.status);
        const headData = await headResp.json();
        currentSha = headData.sha;

        const newJson = serializeJson(parsedData);
        const encoded = btoa(unescape(encodeURIComponent(newJson)));

        const putResp = await fetch(fileUrl, {
          method: 'PUT',
          headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: 'TYOV: prompt ' + result.prompt + ' entry ' + result.entry + ' turn ' + result.turn,
            content: encoded,
            sha: currentSha
          })
        });

        if (!putResp.ok) {
          const errMsg = await putResp.text();
          throw new Error('Save failed: ' + putResp.status + ' ' + errMsg);
        }

        const putData = await putResp.json();
        currentSha = putData.content.sha;
        currentJson = newJson;

        renderChronicle(parsedData);
        setStatus('ok', 'Prompt ' + result.prompt + ', entry ' + result.entry + ' — Turn ' + result.turn);

      } catch (e) {
        console.error('getAndSetNextPrompt:', e);
        setStatus('err', 'Unable to retrieve next journal entry');
        alert('Unable to retrieve next journal entry. Please try again, or check your vault key is correct.');
      }
    }

    loadGameList().then(() => {
      const last = localStorage.getItem('tyov-last-chronicle');
      if (last) loadVampire(last).catch(() => localStorage.removeItem('tyov-last-chronicle'));
    });
  </script>
</body>
