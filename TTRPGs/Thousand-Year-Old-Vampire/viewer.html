<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thousand Year Old Vampire — Chronicle Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=UnifrakturMaguntia&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="./viewer.css">
</head>

<body>
  <!-- Key Panel -->
  <button id="key-toggle" style="display:none;">🔑</button>
  <div id="key-panel">
    <div class="key-label">🔑 Vault Key</div>
    <input type="password" id="vault-key" class="key-input" placeholder="ghp_...">
    <div class="key-info">The key to your vault.</div>
    <button class="modal-btn primary" onclick="closeKeyPanel()" style="width:100%">Done</button>
  </div>

  <!-- Edit Mode Banner -->
  <div id="edit-mode-banner">✎ Edit Mode Active — Changes are local until you save</div>

  <div id="top-bar">
    <div id="picker-row">
      <span id="picker-label">Chronicle</span>
      <a id="game-link" href="character-creator.html">New Character</a>
      <a id="game-link" href="core-rules.html">Core Rules</a>
      <select id="game-select">
        <option value="">— Loading games… —</option>
      </select>
      <button id="refresh-btn" class="top-btn" onclick="refreshCurrent()">↻ Refresh</button>
      <button id="edit-mode-btn" class="top-btn" style="display:none;" onclick="toggleEditMode()">✎ Edit</button>
      <button id="save-btn" class="top-btn" style="display:none;" onclick="saveChronicle()">✓ Save</button>
      <button id="cancel-btn" class="top-btn" style="display:none;" onclick="cancelEditMode()">✕ Cancel</button>
      <div id="skin-switcher">
        <button class="skin-btn active" data-s="book"></button>
        <button class="skin-btn" data-s="dark"></button>
        <button class="skin-btn" data-s="scholar"></button>
      </div>
    </div>
    <div id="status-row">
      <div id="status-dot"></div>
      <span id="status-text">Loading game list…</span>
    </div>
  </div>

  <div id="app">
    <div id="empty-state">
      <h2>Thousand Year Old Vampire</h2>
      <p>Select a chronicle to begin.</p>
    </div>
    <div id="content" style="display:none;">
      <div class="prompt-section" id="prompt-section"></div>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Edit</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer">
        <button class="modal-btn" onclick="closeModal()">Cancel</button>
        <button class="modal-btn primary" id="modal-confirm-btn" onclick="modalConfirm()">Update</button>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════
    // CONFIG & STATE
    // ═══════════════════════════════════════════════════
    const GITHUB_API = 'https://api.github.com/repos/gclawmax/vault-public/contents/TTRPGs/Thousand%20Year%20Old%20Vampire/Vampires';
    const RAW_BASE = 'https://raw.githubusercontent.com/gclawmax/vault-public/main/TTRPGs/Thousand%20Year%20Old%20Vampire/Vampires/';

    let currentSha = null;
    let currentFileUrl = null;
    let currentJson = null;   // last saved state from GitHub — never mutated
    let editMode = false;
    let parsedData = null;    // live working copy — mutated by editors, persisted to localStorage
    let currentModalConfirm = null;
    let currentFilename = null; // tracks which file is loaded, for localStorage key

    function draftKey() { return currentFilename ? 'tyov-draft-' + currentFilename : null; }

    function saveDraft() {
      const key = draftKey();
      if (!key || !parsedData) return;
      try { localStorage.setItem(key, serializeJson(parsedData)); } catch (e) { }
    }

    function clearDraft() {
      const key = draftKey();
      if (key) try { localStorage.removeItem(key); } catch (e) { }
    }

    function loadDraft() {
      const key = draftKey();
      if (!key) return null;
      try { const d = localStorage.getItem(key); return d || null; } catch (e) { return null; }
    }


    // ═══════════════════════════════════════════════════
    // UTILITY
    // ═══════════════════════════════════════════════════
    function toDateString(val) {
      if (!val) return '';
      const d = new Date(val);
      if (isNaN(d.getTime())) return val; // unparseable — return as-is
      return d.toISOString().slice(0, 10);
    }

    function toStringArray(arr) {
      return (arr || []).map(e => typeof e === 'string' ? e : String(e.text || e.description || e || ''));
    }

    function currentTurn() {
      if (!parsedData || !parsedData.journal || parsedData.journal.length === 0) return null;
      return Math.max(...parsedData.journal.map(j => j.turn));
    }

    function formatDateShort(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
      } catch (e) { return iso; }
    }

    function setStatus(state, msg) {
      document.getElementById('status-dot').className = state;
      document.getElementById('status-text').textContent = msg;
    }

    function getVaultKey() { return document.getElementById('vault-key').value.trim(); }

    function esc(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ═══════════════════════════════════════════════════
    // SKIN SWITCHER
    // ═══════════════════════════════════════════════════
    document.querySelectorAll('.skin-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.body.removeAttribute('data-skin');
        if (btn.dataset.s !== 'book') document.body.setAttribute('data-skin', btn.dataset.s);
        document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        localStorage.setItem('tyov-skin', btn.dataset.s);
      });
    });
    (function () {
      const s = localStorage.getItem('tyov-skin') || 'book';
      if (s !== 'book') document.body.setAttribute('data-skin', s);
      document.querySelectorAll('.skin-btn').forEach(b => { if (b.dataset.s === s) b.classList.add('active'); else b.classList.remove('active'); });
    })();

    // ═══════════════════════════════════════════════════
    // KEY PANEL
    // ═══════════════════════════════════════════════════
    function openKeyPanel() { document.getElementById('key-panel').classList.add('open'); }
    function closeKeyPanel() { document.getElementById('key-panel').classList.remove('open'); }
    document.getElementById('key-toggle').addEventListener('click', () => {
      document.getElementById('key-panel').classList.toggle('open');
    });
    // Restore saved tokens
    const savedVaultKey = localStorage.getItem('tyov-vault-key');
    if (savedVaultKey) document.getElementById('vault-key').value = savedVaultKey;
    document.getElementById('vault-key').addEventListener('change', () => {
      localStorage.setItem('tyov-vault-key', document.getElementById('vault-key').value.trim());
    });

    // ═══════════════════════════════════════════════════
    // GAME LIST LOADING
    // ═══════════════════════════════════════════════════
    async function loadGameList() {
      setStatus('busy', 'Loading chronicles…');
      try {
        const resp = await fetch(GITHUB_API, {
          headers: getVaultKey() ? { Authorization: 'token ' + getVaultKey() } : {}
        });
        if (!resp.ok) throw new Error('GitHub API error: ' + resp.status);
        const files = await resp.json();
        const jsonFiles = files.filter(f =>
          f.name.endsWith('.json') &&
          f.name !== 'vampire-schema.json' &&
          !f.name.startsWith('TEST_') &&
          !f.name.startsWith('test_')
        );
        const sel = document.getElementById('game-select');
        sel.innerHTML = '<option value="">— Select a chronicle —</option>';
        jsonFiles.forEach(f => {
          const o = document.createElement('option');
          o.value = f.name;
          o.textContent = f.name.replace('.json', '');
          sel.appendChild(o);
        });
        setStatus('ok', `${jsonFiles.length} chronicle${jsonFiles.length !== 1 ? 's' : ''} found`);
      } catch (e) {
        setStatus('err', 'Failed to load game list: ' + e.message);
      }
    }

    document.getElementById('game-select').addEventListener('change', async (e) => {
      if (!e.target.value) return;
      await loadVampire(e.target.value);
    });

    async function loadVampire(filename) {
      setStatus('busy', `Loading ${filename}…`);
      try {
        const url = GITHUB_API + '/' + encodeURIComponent(filename);
        const resp = await fetch(url, {
          headers: getVaultKey() ? { Authorization: 'token ' + getVaultKey() } : {}
        });
        if (!resp.ok) throw new Error(resp.status);
        const data = await resp.json();
        currentSha = data.sha;
        currentFileUrl = url;
        currentFilename = filename;
        currentJson = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));

        await ensurePromptsLoaded();

        // Check for a localStorage draft
        const draft = loadDraft();
        if (draft) {
          const resume = confirm('You have unsaved edits for this chronicle. Resume editing?');
          if (resume) {
            parsedData = parseSource(draft);
            editMode = true;
            applyEditModeUI();
          } else {
            clearDraft();
            parsedData = parseSource(currentJson);
          }
        } else {
          parsedData = parseSource(currentJson);
        }

        if (!parsedData.frontmatter.modified && data.committed_date) {
          parsedData.frontmatter.modified = data.committed_date.slice(0, 10);
        }

        renderChronicle(parsedData);
        const select = document.getElementById('game-select');
        if (select) select.value = filename;
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('edit-mode-btn').style.display = '';
        setStatus('ok', draft && editMode ? `Resumed draft: ${filename}` : `Loaded: ${filename}`);
      } catch (e) {
        setStatus('err', 'Load failed: ' + e.message);
      }
      localStorage.setItem('tyov-last-chronicle', filename);
    }

    function resetToGameList() {
      if (editMode) {
        if (!confirm('You have unsaved changes. Discard them?')) return;
      }
      leaveEditMode();
      document.getElementById('content').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('edit-mode-btn').style.display = 'none';
      document.getElementById('game-select').value = '';
      currentJson = null; workingJson = null; parsedData = null;
    }

    async function refreshCurrent() {
      const sel = document.getElementById('game-select');
      if (sel.value) await loadVampire(sel.value);
      else await loadGameList();
    }

    // ═══════════════════════════════════════════════════
    // PROMPTS — load once, cache in sessionStorage
    // ═══════════════════════════════════════════════════
    const PROMPTS_SESSION_KEY = 'tyov-prompts-cache';
    let PROMPTS_DATA = null;

    async function ensurePromptsLoaded() {
      // Already in memory — free
      if (PROMPTS_DATA) return true;

      // Try sessionStorage — avoids a network call for the rest of the tab session
      try {
        const cached = sessionStorage.getItem(PROMPTS_SESSION_KEY);
        if (cached) {
          PROMPTS_DATA = JSON.parse(cached); // cache already holds just the array
          return true;
        }
      } catch (e) { /* sessionStorage unavailable — proceed to fetch */ }

      // Need a token to fetch from the private repo
      const token = getVaultKey();
      if (!token) return false;

      const url = 'https://api.github.com/repos/gclawmax/hermes-skills/contents/thousand-year-vampire-agent/prompts.json';
      try {
        const resp = await fetch(url, {
          headers: { Authorization: 'token ' + token }
        });
        if (!resp.ok) throw new Error('Prompts fetch failed: ' + resp.status);

        const data = await resp.json();
        // GitHub API returns file content as base64 — decode it to a UTF-8 string
        const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        // The prompts JSON is { metadata: {...}, pages: [...] } — we only need the array
        PROMPTS_DATA = JSON.parse(decoded).pages;

        // Cache just the array for the rest of this tab session
        try { sessionStorage.setItem(PROMPTS_SESSION_KEY, JSON.stringify(PROMPTS_DATA)); } catch (e) { }

        return true;
      } catch (e) {
        console.error('ensurePromptsLoaded:', e);
        setStatus('err', 'Unable to retrieve next journal entry');
        return false;
      }
    }

    // ═══════════════════════════════════════════════════
    // GETPROMPTTEXT — helper to read prompts from cache in sessionStorage
    // ═══════════════════════════════════════════════════

    function getPromptText(prompt, entry) {
      if (!PROMPTS_DATA) return `[Prompt ${prompt}.${entry} — unlock text with Vault Key]`;
      const lookup = buildPromptLookup();
      return lookup[prompt + ',' + entry] || `[Prompt ${prompt}.${entry} — not found]`;
    }

    // ═══════════════════════════════════════════════
    // ⏰ AUTO-POLLER — ETag conditional GET (30s, visible-only)
    // GitHub docs: "304 responses do NOT count against rate limits."
    // Only 200 (content changed) consumes quota (~60/hr unauth, 5k/hr+ with token).
    // ═══════════════════════════════════════════════
    var _ptl = null, _pviz = document.visibilityState === 'visible', _etag = {};

    function _armPoll() { if (_pviz && !_ptl) { _ptl = setTimeout(_pollTick, 30000); } }
    function _disPoll() { clearTimeout(_ptl); _ptl = null; }

    function _pollTick() {
      if (!_pviz || editMode) { _ptl = setTimeout(_pollTick, 30000); return; } // don't poll during edits
      var t = [];
      var sel = document.getElementById('game-select');
      // Poll current vampire sheet
      if (sel.value) {
        t.push(_chkFile(GITHUB_API + '/' + encodeURIComponent(sel.value), 'v'));
      } else {
        t.push(_chkFile(GITHUB_API, 'g')); // refresh game list
      }
      Promise.allSettled(t).then(function () { _ptl = setTimeout(_pollTick, 30000); });
    }

    function _chkFile(url, key) {
      var h = {}, o = _etag['' + key];
      if (o && key !== '_') { h['If-None-Match'] = o; }
      var tok = getVaultKey();
      if (tok) { h['Authorization'] = 'token ' + tok; }
      fetch(url, { cache: 'no-store', headers: h }).then(function (r) {
        if (r.status === 304) {
          // unchanged — ZERO rate-limit cost
          return;
        }
        if (r.status === 403) {
          setStatus('err', 'Rate-limited — add Vault Key for 5,000/hr');
          return;
        }
        if (!r.ok) { return; }
        var et = r.headers.get('etag');
        if (et) { _etag['' + key] = et; }
        // Content changed
        if (key === 'v' && currentFileUrl) {
          return r.json().then(function (d) {
            currentSha = d.sha;
            currentJson = decodeURIComponent(escape(atob(d.content.replace(/\n/g, ''))));
            workingJson = currentJson;
            parsedData = parseSource(currentJson);
            renderChronicle(parsedData);
            setStatus('ok', '✓ Chronicle refreshed — ' + new Date().toLocaleTimeString());
          });
        }
        if (key === 'g') {
          // Game list changed — reload
          return r.json().then(function (files) {
            loadGameList();
            setStatus('ok', '✓ Chronicle list refreshed — ' + new Date().toLocaleTimeString());
          });
        }
      }).catch(function () { /* transient network error */ });
    }

    document.addEventListener('visibilitychange', function () {
      _pviz = document.visibilityState === 'visible';
      if (_pviz) { _armPoll(); } else { _disPoll(); }
    });

    // Start the poller immediately when the page is visible
    if (_pviz) { _armPoll(); }

    // Also (re-)arm when a game is selected

    // ═══════════════════════════════════════════════
    // JSON PARSER  (produces structured parsedData)
    // ═══════════════════════════════════════════════
    function parseSource(source) {
      const trimmed = source.trim();
      if (!trimmed) throw new Error('Empty JSON source');
      return jsonToParsedData(JSON.parse(trimmed));
    }

    function jsonToParsedData(json) {
      const data = {
        frontmatter: {},
        vampireName: json.name || '',
        subtitle: json.vampire_desc || '',
        epitaph: (json.epitaph && json.epitaph.experience) ? json.epitaph.experience : '',
        marks: (json.marks || []).map(m => ({
          desc: m.description || '',
          concealment: m.concealment || '',
          status: m.status || 'active'
        })),
        characters: (json.characters || []).map(c => ({
          name: c.name || '',
          desc: c.description || '',
          type: c.type === 'immortal' ? 'immortal' : 'mortal',
          dead: c.status === 'dead',
          death_reason: c.death_reason || '',
          death_epitaph: c.death_epitaph || '',
          gained_turn: c.gained_turn || null,
          lost_turn: c.lost_turn || null
        })),

        memories: (json.memories || []).map((mem, idx) => ({
          n: mem.n || idx + 1,
          theme: mem.theme || '',
          description: mem.description || '',
          experiences: toStringArray(mem.experiences),
        })),
        lostMemories: (json.lost_memories || []).map(m => ({
          n: m.n,
          theme: m.theme || '',
          experiences: toStringArray(m.experiences),
          lost_at: m.lost_at || null,
          lost_on_turn: m.lost_on_turn || null
        })),
        skills: (json.skills || []).map(sk => ({
          name: sk.name || '',
          status: sk.status || 'unchecked',
          gained_turn: sk.gained_turn || null,
          lost_turn: sk.lost_turn || null
        })),
        resources: (json.resources || []).map(r => ({
          name: r.name || '',
          description: r.description || '',
          type: r.type || 'portable',
          status: r.status || 'active',
          gained_turn: r.gained_turn || null,
          lost_turn: r.lost_turn || null
        })),
        diaryMemories: Object.fromEntries(
          Object.entries(json.diary_memories || {}).map(([k, v]) => [
            k,
            (v || []).map(m => ({
              n: m.n,
              theme: m.theme || '',
              experiences: toStringArray(m.experiences)
            }))
          ])
        ),
        journal: (json.journal || []).map(j => ({
          turn: j.turn,
          prompt: j.prompt,
          entry: j.entry,
          prose: j.experience || '',
          changes: j.changes || '',
          resolved: j.resolved !== false, // default true if missing
          resolved_at: j.resolved_at || null
        })),
        gameOver: !!json.game_over,
      };

      data.frontmatter = {
        game_start: json.game_start || '',
        modified: toDateString(json.modified) || '',
        game_over: json.game_over ? 'true' : 'false',
        current_prompt: json.current_prompt !== undefined ? String(json.current_prompt) : ''
      };

      return data;
    }

    function serializeJson(d) {
      const json = {
        name: d.vampireName || '',
        vampire_desc: d.subtitle || '',
        game_over: d.frontmatter.game_over === 'true',
        game_start: d.frontmatter.game_start || '',
        modified: new Date().toISOString().slice(0, 10),
        current_prompt: d.frontmatter.current_prompt ? parseInt(d.frontmatter.current_prompt, 10) : 0,
        epitaph: d.epitaph ? { experience: d.epitaph } : null,
        marks: (d.marks || []).map(m => ({
          description: m.desc || '',
          concealment: m.concealment || '',
          status: m.status || 'active'
        })),
        memories: (d.memories || []).map(mem => ({
          n: mem.n,
          theme: mem.theme || '',
          description: mem.description || '',
          experiences: toStringArray(mem.experiences)
        })),
        lost_memories: (d.lostMemories || []).map(m => ({
          n: m.n,
          theme: m.theme || '',
          experiences: toStringArray(m.experiences),
          lost_at: m.lost_at || null,
          lost_on_turn: m.lost_on_turn || null
        })),
        skills: (d.skills || []).map(sk => ({
          name: sk.name || '',
          status: sk.status || 'unchecked',
          gained_turn: sk.gained_turn || null,
          lost_turn: sk.lost_turn || null
        })),
        resources: (d.resources || []).map(r => ({
          name: r.name || '',
          description: r.description || '',
          type: r.type || 'portable',
          status: r.status || 'active',
          gained_turn: r.gained_turn || null,
          lost_turn: r.lost_turn || null
        })),
        diary_memories: Object.fromEntries(
          Object.entries(d.diaryMemories || {}).map(([k, v]) => [
            k,
            (v || []).map(m => ({
              n: m.n,
              theme: m.theme || '',
              experiences: toStringArray(m.experiences)
            }))
          ])
        ),
        characters: (d.characters || []).map(c => ({
          name: c.name || '',
          type: c.type || 'mortal',
          description: c.desc || '',
          status: c.dead ? 'dead' : 'alive',
          death_reason: c.death_reason || '',
          death_epitaph: c.death_epitaph || '',
          gained_turn: c.gained_turn || null,
          lost_turn: c.lost_turn || null
        })),
        journal: (d.journal || []).map(j => ({
          turn: j.turn,
          prompt: j.prompt,
          entry: j.entry,
          resolved: j.resolved !== false,
          resolved_at: j.resolved_at || null,
          experience: j.prose || '',
          changes: j.changes || ''
        })),
      };

      return JSON.stringify(json, null, 2);
    }

    // ═══════════════════════════════════════════════════
    // RENDERER
    // ═══════════════════════════════════════════════════
    function renderChronicle(d) {
      const el = document.getElementById('content');
      const fm = d.frontmatter;
      const em = editMode;

      function editAttr(fn) {
        return em ? 'onclick="event.stopPropagation();' + fn + '" style="cursor:pointer;"' : '';
      }

      const hasUnresolved = d.journal.some(j => !j.resolved === true);
      const promptBtnDisabled = em || hasUnresolved;

      let html = '';

      // ── Header ──
      html += '<div class="section-editwrap" data-section="header" ' + (em ? 'onclick="editHeader()" title="Click to edit header"' : '') + '>'
        + '<div class="vamp-header">'
        + '<div class="vamp-name-wrap">'
        + '<div class="vamp-rule"><span></span><span></span></div>'
        + '<div class="vamp-name">' + esc(d.vampireName) + '</div>'
        + '<div class="vamp-rule"><span></span><span></span></div>'
        + '</div>'
        + '<div class="vamp-subtitle">A Thousand Year Old Vampire</div>'
        + '<div class="vamp-epitaph">' + esc(d.subtitle) + '</div>'
        + '<div class="meta-row">'
        + (fm.game_start ? '<span class="meta-pill">Started <span>' + fm.game_start + '</span></span>' : '')
        + (fm.game_over === 'true' ? '<span class="meta-pill" style="color:var(--blood)">Game Over</span>' : '')
        + (d.frontmatter.modified ? '<span class="meta-pill">Last played <span>' + d.frontmatter.modified + '</span></span>' : '')
        + '</div>'
        + '</div>'
        + '</div>';

      // ── Dashboard ──
      html += '<div class="dashboard-strip">';

      // Marks
      html += '<div class="strip-cell section-editwrap" data-section="marks" '
        + (em ? 'onclick="editMarks()" title="Click to edit marks"' : '') + '>'

        + '<div class="marks-inline">';

      html += '</div></div>';

        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));

      html += '<div class="strip-cell section-editwrap" data-section="skills" '
        + (em ? 'onclick="editSkills()" title="Click to edit skills"' : '') + '>'
        + '<div class="strip-label"><span class="section-icon">⚔</span> Skills</div>'
        + '<div class="skills-inline">';
      if (uncheckedSkills.length === 0) html += '<span style="color:var(--ink-faint);font-size:.85rem;">None</span>';
      uncheckedSkills.forEach(sk => {
        html += '<span class="skill-chip" title="' + (sk.gained_turn ? 'Gained turn ' + sk.gained_turn : '') + '">'
          + '<span class="skill-box"></span>'
          + esc(sk.name) + '</span>';
      });
      html += '</div></div>';

      // Resources
      const activeResources = d.resources.filter(r => r.status === 'active')
        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));

      html += '<div class="strip-cell section-editwrap" data-section="resources" '
        + (em ? 'onclick="editResources()" title="Click to edit resources"' : '') + '>'
        + '<div class="strip-label"><span class="section-icon">🏚</span> Resources</div>'
        + '<div class="resources-inline">';
      if (activeResources.length === 0) html += '<span style="color:var(--ink-faint);font-size:.85rem;">None</span>';
      activeResources.forEach(r => {
        const icon = r.type === 'diary' ? '📖' : r.type === 'portable' ? '📦' : '📍';
        html += '<span class="resource-chip" title="' + esc(r.type) + (r.gained_turn ? ' · gained turn ' + r.gained_turn : '') + '">'
          + '<span class="resource-type-icon">' + icon + '</span>'
          + esc(r.name) + '</span>';
      });
      html += '</div></div>';

      html += '</div>'; // dashboard-strip

      // ── Main layout ──
      html += '<div class="main-layout">';

      // Mortal Characters — living only
      const livingMortals = d.characters.filter(c => c.type === 'mortal' && !c.dead)
        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));

      html += '<div class="char-col section-editwrap" data-section="characters-mortal" '
        + (em ? 'onclick="editCharacters(\'mortal\')" title="Click to edit mortal characters"' : '') + '>'
        + '<div class="char-panel" style="height:100%;"><div class="panel-title"><span class="section-icon">🧑</span> Mortal Characters</div>'
        + '<div class="char-list">';
      if (livingMortals.length === 0) html += '<p style="color:var(--ink-faint);font-style:italic;font-size:.85rem;padding:8px 0;">None yet</p>';
      livingMortals.forEach(c => {
        html += '<div class="char-row">'
          + '<div class="char-row-name">' + esc(c.name) + '</div>'
          + '<div class="char-row-desc">' + esc(c.desc) + '</div>'

      });
      html += '</div></div></div>';

      // Journal
      html += '<div class="journal-col section-editwrap" data-section="journal" '
        + (em ? 'onclick="editJournal()" title="Click to add/remove journal entries"' : '') + '>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'
        + '<div style="font-family:\'Cinzel\',serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-dim);">📖 Journal</div>'
        + '<button class="top-btn" onclick="event.stopPropagation();getAndSetNextPrompt()" title="'
        + (promptBtnDisabled ? (em ? 'Disabled in edit mode' : 'Resolve current entry first') : 'Get next prompt')
        + '" style="font-size:11px;padding:5px 12px;'
        + (promptBtnDisabled ? 'opacity:.4;cursor:not-allowed;' : '') + '"'
        + (promptBtnDisabled ? ' disabled' : '') + '>🎲 Next Prompt</button>'

      if (d.journal.length === 0) {
        html += '<p style="color:var(--ink-faint);font-style:italic;">No journal entries yet.</p>';
      }

      const journalDisplay = [...d.journal].sort((a, b) => {
        if (a.awaiting && !b.awaiting) return -1;
        if (!a.awaiting && b.awaiting) return 1;
        if (a.resolved_at && b.resolved_at) return new Date(b.resolved_at) - new Date(a.resolved_at);
        return b.turn - a.turn;
      });

      journalDisplay.forEach(j => {
        const trueIdx = d.journal.indexOf(j);
        html += '<div class="journal-entry" data-entry-idx="' + trueIdx + '" '
          + (em ? 'onclick="event.stopPropagation();editjournalentry(' + trueIdx + ')" title="Click to edit this entry"' : '') + '>'
          + '<div class="journal-turn">Turn ' + j.turn + ' — Prompt ' + j.prompt + ', Entry ' + j.entry + '</div>'
          + '<div class="journal-scrap">'
          + '<div class="journal-prompt-text">' + esc(getPromptText(j.prompt, j.entry)) + '</div>'
          + '<div class="journal-body">';
        if (j.prose) html += '<p>' + esc(j.prose) + '</p>';
        if (!j.resolved) {
          html += '<p class="journal-awaiting">Awaiting resolution…</p>';
        } else if (j.changes) {
          html += '<p style="font-size:.85rem;color:var(--ink-faint);border-top:1px solid var(--border);padding-top:10px;margin-top:10px;"><strong>Changes:</strong> ' + esc(j.changes) + '</p>';
        }

          const resolvedDate = String(rd.getDate()).padStart(2, '0') + '-'

            + rd.getFullYear() + ' '
            + String(rd.getHours()).padStart(2, '0') + ':'
            + String(rd.getMinutes()).padStart(2, '0');
          html += '<p style="font-size:.75rem;color:var(--ink-faint);margin-top:6px;">Resolved ' + resolvedDate + '</p>';
        }
        html += '</div></div></div>';

      html += '</div>'; // journal-col

      // Immortal Characters — living only
      const livingImmortals = d.characters.filter(c => c.type === 'immortal' && !c.dead)
        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));

      html += '<div class="char-col section-editwrap" data-section="characters-immortal" '
        + (em ? 'onclick="editCharacters(\'immortal\')" title="Click to edit immortal characters"' : '') + '>'
        + '<div class="char-panel" style="height:100%;"><div class="panel-title"><span class="section-icon">🧛</span> Immortal Characters</div>'
        + '<div class="char-list">';
      if (livingImmortals.length === 0) html += '<p style="color:var(--ink-faint);font-style:italic;font-size:.85rem;padding:8px 0;">None yet</p>';
      livingImmortals.forEach(c => {
        html += '<div class="char-row">'
          + '<div class="char-row-name">' + esc(c.name) + '</div>'

      html += '</div></div></div>';

      html += '</div>'; // main-layout

      // Memories
      // Active memories

        html += '<div class="' + cls + '">'
          + '<div class="memory-title">'

          html += '<ol>';
          mem.experiences.forEach(exp => { html += '<li>' + esc(exp) + '</li>'; });
          html += '</ol>';
        } else {
          html += '<p style="font-size:.85rem;color:var(--ink-faint);font-style:italic;">Awaiting new memory.</p>';
        }
        html += '</div>';
      });
      html += '</div></div>';

      // Diary memories — one section per active diary
      const activeDiary = d.resources.find(r => r.type === 'diary' && r.status === 'active');
      if (activeDiary) {
        const mems = d.diaryMemories[activeDiary.name] || [];
        let contentHtml = '<div class="memories-grid">';
        if (mems.length === 0) {
          contentHtml += '<p style="color:var(--ink-faint);font-style:italic;font-size:.88rem;">No memories stored in this diary.</p>';
        }

            + '<div class="memory-title">Memory ' + mem.n + ' — ' + esc(mem.theme) + '</div>'
            + '<ol>';

          contentHtml += '</ol></div>';
        });
        contentHtml += '</div>';
        html += '<div class="memories-section section-editwrap" '
          + (em ? 'onclick="editDiaryMemories(\'' + activeDiary.name.replace(/'/g, "\\'") + '\')" title="Click to edit diary memories"' : '') + '>'
          + '<div class="memories-section-label"><span class="section-icon">📖</span> ' + esc(activeDiary.name) + '</div>'
          + contentHtml
          + '</div>';
      }

      // Lost Memories
      if (d.lostMemories && d.lostMemories.length > 0) {
        const sorted = [...d.lostMemories].sort((a, b) => new Date(b.lost_at) - new Date(a.lost_at));
        let contentHtml = '<div class="memories-grid">';
        sorted.forEach(mem => {
          const ld = new Date(mem.lost_at);
          const lostDate = String(ld.getDate()).padStart(2, '0') + '-'
            + String(ld.getMonth() + 1).padStart(2, '0') + '-' + ld.getFullYear();
          contentHtml += '<div class="memory-block forgotten">'
            + '<div class="memory-title">Memory ' + mem.n + ' — ' + esc(mem.theme)
            + ' <span style="font-size:.75em;color:var(--ink-faint);">lost turn ' + mem.lost_on_turn + ' · ' + lostDate + '</span></div>'
            + '<ol>';
          mem.experiences.forEach(exp => { contentHtml += '<li>' + esc(exp) + '</li>'; });
          contentHtml += '</ol></div>';
        });
        contentHtml += '</div>';
        html += collapsibleSection('lost-memories', '🌒', 'Lost Memories', contentHtml, em ? 'editLostMemories()' : null, sorted.length);
      }

      // ── Lost Resources ──
      const lostResources = d.resources.filter(r => r.status === 'lost')
        .sort((a, b) => (b.lost_turn || 0) - (a.lost_turn || 0));
      if (lostResources.length > 0) {
        let contentHtml = '<div class="memories-grid">';
        lostResources.forEach(r => {
          const icon = r.type === 'diary' ? '📖' : r.type === 'portable' ? '📦' : '📍';
          contentHtml += '<div class="memory-block forgotten">'
            + '<div class="memory-title">' + icon + ' ' + esc(r.name)
            + (r.lost_turn ? '<span style="font-size:.75em;color:var(--ink-faint);"> — lost turn ' + r.lost_turn + '</span>' : '')
            + '</div>'
            + (r.description ? '<p style="font-size:.88rem;">' + esc(r.description) + '</p>' : '')
            + '</div>';
        });
        contentHtml += '</div>';
        html += collapsibleSection('lost-resources', '🏚', 'Lost Resources', contentHtml, em ? 'editResources()' : null, lostResources.length);
      }

      // ── Checked Skills ──
      const checkedSkills = d.skills.filter(sk => sk.status === 'checked')
        .sort((a, b) => (b.gained_turn || 0) - (a.gained_turn || 0));
      if (checkedSkills.length > 0) {
        let contentHtml = '<div class="memories-grid">';
        checkedSkills.forEach(sk => {
          contentHtml += '<div class="memory-block forgotten">'
            + '<div class="memory-title">☑ ' + esc(sk.name)
            + (sk.gained_turn ? '<span style="font-size:.75em;color:var(--ink-faint);"> — gained turn ' + sk.gained_turn + '</span>' : '')
            + '</div>'
            + (sk.description ? '<p style="font-size:.88rem;">' + esc(sk.description) + '</p>' : '')
            + '</div>';
        });
        contentHtml += '</div>';
        html += collapsibleSection('checked-skills', '☑', 'Checked Skills', contentHtml, em ? 'editSkills()' : null, checkedSkills.length);
      }

      // ── Obituary ──
      const deadChars = d.characters.filter(c => c.dead)
        .sort((a, b) => (b.lost_turn || 0) - (a.lost_turn || 0));
      if (deadChars.length > 0) {
        let contentHtml = '<div class="memories-grid">';
        deadChars.forEach(c => {
          contentHtml += '<div class="memory-block forgotten">'
            + '<div class="memory-title">' + esc(c.name)
            + ' <span style="font-size:.75em;color:var(--ink-faint);">— ' + c.type
            + (c.lost_turn ? ' · died turn ' + c.lost_turn : '') + '</span></div>'
            + (c.desc ? '<p style="font-size:.88rem;margin-bottom:6px;">' + esc(c.desc) + '</p>' : '')
            + (c.death_reason ? '<p style="font-size:.82rem;color:var(--ink-faint);font-style:italic;">' + esc(c.death_reason) + '</p>' : '')
            + (c.death_epitaph ? '<p style="font-size:.82rem;color:var(--blood);font-style:italic;border-left:2px solid var(--blood);padding-left:8px;margin-top:6px;">' + esc(c.death_epitaph) + '</p>' : '')
            + '</div>';
        });
        contentHtml += '</div>';
        html += collapsibleSection('obituary', '💀', 'Obituary', contentHtml, em ? 'editObituary()' : null, deadChars.length);
      }

      el.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════
    // COLLAPSED SECTIONS
    // ═══════════════════════════════════════════════════

    const _collapsedSections = new Set(['lost-memories', 'lost-resources', 'checked-skills', 'obituary']);

    function toggleSection(id) {
      const content = document.getElementById('section-content-' + id);
      const wrap = content ? content.closest('.collapsible-section') : null;
      if (!content || !wrap) return;
      if (_collapsedSections.has(id)) {
        _collapsedSections.delete(id);
        content.style.display = '';
        wrap.classList.remove('section-collapsed');
      } else {
        _collapsedSections.add(id);
        content.style.display = 'none';
        wrap.classList.add('section-collapsed');
      }
    }

    function collapsibleSection(id, icon, label, contentHtml, editFn, count) {
      const collapsed = _collapsedSections.has(id);
      return '<div class="memories-section section-editwrap collapsible-section' + (collapsed ? ' section-collapsed' : '') + '"'
        + (editFn ? ' onclick="' + editFn + '"' : '') + '>'
        + '<div class="memories-section-label collapsible-label" onclick="event.stopPropagation();toggleSection(\'' + id + '\')" style="cursor:pointer;user-select:none;">'
        + '<span class="section-icon">' + icon + '</span> ' + label
        + (collapsed && count ? '<span class="collapse-count">' + count + ' sealed within</span>' : '')
        + '<span class="collapse-arrow">' + (collapsed ? '✦' : '▾') + '</span>'
        + '</div>'
        + '<div id="section-content-' + id + '" style="display:' + (collapsed ? 'none' : '') + ';">'
        + contentHtml
        + '</div></div>';
    }

    // ═══════════════════════════════════════════════════
    // EDIT MODE TOGGLE
    // ═══════════════════════════════════════════════════
    function toggleEditMode() {
      if (!editMode) enterEditMode();
      else cancelEditMode();
    }

    function applyEditModeUI() {
      document.body.classList.add('edit-mode');
      document.getElementById('edit-mode-btn').classList.add('active-edit');
      document.getElementById('edit-mode-btn').textContent = '✎ Editing';
      document.getElementById('save-btn').style.display = '';
      document.getElementById('cancel-btn').style.display = '';
      document.getElementById('edit-mode-banner').classList.add('visible');
      document.getElementById('game-select').disabled = true;
      document.getElementById('key-toggle').style.display = 'flex';
      document.getElementById('game-link').style.pointerEvents = 'none';  // ← add
      document.getElementById('game-link').style.opacity = '0.4';
    }

    function enterEditMode() {
      editMode = true;
      applyEditModeUI();
      renderChronicle(parsedData); // re-render to show per-entry edit buttons
      setStatus('busy', 'Edit mode — changes saved locally, not yet on GitHub');
    }

    function leaveEditMode() {
      editMode = false;
      document.body.classList.remove('edit-mode');
      document.getElementById('edit-mode-btn').classList.remove('active-edit');
      document.getElementById('edit-mode-btn').textContent = '✎ Edit';
      document.getElementById('save-btn').style.display = 'none';
      document.getElementById('cancel-btn').style.display = 'none';
      document.getElementById('edit-mode-banner').classList.remove('visible');
      document.getElementById('game-select').disabled = false;
      document.getElementById('key-toggle').style.display = 'none';
      document.getElementById('key-panel').classList.remove('open');
      document.getElementById('game-link').style.pointerEvents = '';       // ← add
      document.getElementById('game-link').style.opacity = '';
    }

    function cancelEditMode() {
      if (!confirm('Discard all unsaved edits and revert to the last saved version?')) return;
      clearDraft();
      leaveEditMode();
      parsedData = parseSource(currentJson);
      renderChronicle(parsedData);
      setStatus('ok', 'Edits discarded — showing last saved version.');
    }

    function markUnsaved() {
      saveDraft(); // persist to localStorage immediately
      setStatus('busy', 'Unsaved changes — draft saved locally');
    }

    // ═══════════════════════════════════════════════════
    // SAVE TO GITHUB
    // ═══════════════════════════════════════════════════
    async function saveChronicle() {
      const token = getVaultKey();
      if (!token) { openKeyPanel(); alert('Please enter your vault key first (🔑 key panel).'); return; }
      if (!currentFileUrl) { setStatus('err', 'No file URL — reload the chronicle.'); return; }
      setStatus('busy', 'Saving…');
      try {
        const newJson = serializeJson(parsedData);
        const encoded = btoa(unescape(encodeURIComponent(newJson)));
        const resp = await fetch(currentFileUrl, {
          method: 'PUT',
          headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Chronicle update via TYOV viewer', content: encoded, sha: currentSha })
        });
        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.message || resp.status);
        }
        const result = await resp.json();
        currentSha = result.content.sha;
        currentJson = newJson;   // advance the clean reference
        clearDraft();            // draft is now on GitHub — remove local copy
        leaveEditMode();
        renderChronicle(parsedData);
        setStatus('ok', 'Saved to GitHub ✓');
      } catch (e) {
        setStatus('err', 'Save failed: ' + e.message);
        alert('Save failed: ' + e.message);
      }
    }

    // ═══════════════════════════════════════════════════
    // MODAL HELPERS
    // ═══════════════════════════════════════════════════
    function openModal(title, bodyHtml, confirmFn, footerHtml) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const footer = document.getElementById('modal-footer');
      if (footerHtml !== undefined) {
        footer.innerHTML = footerHtml;
      } else {
        footer.innerHTML = `
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" id="modal-confirm-btn" onclick="modalConfirm()">Update</button>`;
      }
      currentModalConfirm = confirmFn;
      document.getElementById('modal-overlay').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      currentModalConfirm = null;
    }
    function modalConfirm() {
      let cb = currentModalConfirm;
      currentModalConfirm = null;
      document.getElementById('modal-overlay').classList.remove('open');
      if (cb) {
        cb();
        markUnsaved();           // persist draft after every modal confirm
        renderChronicle(parsedData);
      }
    }

    // Inline game actions trigger immediate re-renders
    // since they don't go through the Update button flow.

    // ═══════════════════════════════════════════════════
    // SECTION EDITORS
    // ═══════════════════════════════════════════════════

    // ── Header  ──────────────────────────────
